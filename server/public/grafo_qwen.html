<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafo · Ética Nicomaquea I</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<style>
:root {
  --text: #2C2C2B;
  --muted: #7D7A75;
  --canvas: #FFFFFF;
  --soft: #F9F8F7;
  --surface: #F0EFED;
  --border: #E6E5E3;
  --blue: #2783DE;
  --blue-soft: #E5F2FC;
  --green: #46A171;
  --green-soft: #EDF7F1;
  --orange: #D5803B;
  --orange-soft: #FBF1E8;
  --head: 60px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text);
  background: var(--canvas);
  height: 100dvh;
  display: grid;
  grid-template-rows: var(--head) 1fr;
  grid-template-areas: "hd" "stage";
  overflow: hidden;
}
#hd {
  grid-area: hd;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 16px; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
.brand .sub { color: var(--muted); font-size: 13px; }
.back { margin-left: auto; font-size: 13px; color: var(--blue); text-decoration: none; }
.back:hover { text-decoration: underline; }
#stage { grid-area: stage; position: relative; overflow: hidden; }
#cy {
  width: 100%;
  height: 100%;
  background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
  background-size: 24px 24px;
}
#hint {
  position: absolute;
  bottom: 72px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 8px 20px;
  font-size: 13px;
  color: var(--muted);
  pointer-events: none;
  transition: opacity .4s ease;
  animation: pulse 2.2s ease-in-out infinite;
  white-space: nowrap;
}
#hint.hidden { opacity: 0; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .65; } }
#controls {
  position: absolute;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 5;
}
#controls button {
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--canvas);
  color: var(--muted);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s, color .15s;
}
#controls button:hover { background: var(--soft); color: var(--text); }
#legend {
  position: absolute;
  bottom: 20px;
  left: 20px;
  background: var(--canvas);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  gap: 7px;
  z-index: 5;
}
.legend-item { display: flex; align-items: center; gap: 8px; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid; flex: none; }
#panel {
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 320px;
  background: var(--canvas);
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform .22s ease;
  z-index: 10;
  display: flex;
  flex-direction: column;
  box-shadow: -4px 0 16px rgba(0,0,0,.06);
}
#panel.open { transform: translateX(0); }
.panel-hd { display: flex; align-items: flex-start; justify-content: space-between; padding: 18px 18px 0; }
.panel-hd h2 { margin: 0; font-size: 18px; }
.panel-greek { font-size: 15px; color: var(--muted); margin: 2px 0 0; }
#panel-close {
  width: 28px; height: 28px;
  border: none; border-radius: 6px;
  background: transparent; color: var(--muted);
  font-size: 18px; cursor: pointer; flex: none;
}
#panel-close:hover { background: var(--surface); color: var(--text); }
.panel-meta { padding: 12px 18px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted); }
.panel-body { padding: 16px 18px; font-size: 14px; line-height: 1.55; overflow-y: auto; flex: 1; }
.placeholder { color: var(--muted); font-style: italic; margin: 0; }
@media (max-width: 820px) {
  .brand .sub { display: none; }
  #legend { display: none; }
  #panel { width: 280px; }
}
</style>
</head>
<body>

<header id="hd">
  <div class="brand">
    <h1>Grafo semántico</h1>
    <span class="sub">Aristóteles · Ética Nicomaquea, libro I</span>
  </div>
  <a href="index.html" class="back">← App principal</a>
</header>

<div id="stage">
  <div id="cy"></div>
  <div id="hint">Hacé click en <strong>εὐδαιμονία</strong> para desplegar el grafo</div>
  <div id="controls">
    <button id="zoom-in" title="Acercar">+</button>
    <button id="zoom-out" title="Alejar">−</button>
    <button id="zoom-fit" title="Ajustar">⊙</button>
  </div>
  <div id="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#E5F2FC;border-color:#2783DE"></span> Concepto central</div>
    <div class="legend-item"><span class="legend-dot" style="background:#F0EFED;border-color:#B8B5B0;border-radius:4px"></span> Familia de conceptos</div>
    <div class="legend-item"><span class="legend-dot" style="background:#FFFFFF;border-color:#E6E5E3"></span> Eje semántico</div>
    <div class="legend-item"><span class="legend-dot" style="background:#EDF7F1;border-color:#46A171;border-radius:4px"></span> Acceso</div>
  </div>
  <aside id="panel">
    <div class="panel-hd">
      <div>
        <h2 id="panel-title"></h2>
        <p class="panel-greek" id="panel-greek"></p>
      </div>
      <button id="panel-close" title="Cerrar">✕</button>
    </div>
    <div class="panel-meta" id="panel-meta"></div>
    <div class="panel-body" id="panel-body"></div>
  </aside>
</div>

<script>
/* ══════════════════════════════════════════════
   DATOS DEL GRAFO
   ══════════════════════════════════════════════ */

const GRUPOS = [
  { id: 'g_bien',       label: 'Arquitectura del bien',   ejes: ['telos','agathon','ariston','autarkeia','teleios','bios'] },
  { id: 'g_virtud',     label: 'Antropología y virtud',   ejes: ['ergon','arete','energeia','hexis','psyche','zoe','logos'] },
  { id: 'g_rivales',    label: 'Bienes rivales',          ejes: ['hedone','time','ploutos','tyche'] },
  { id: 'g_calif',      label: 'Calificadores',           ejes: ['kalon','theion'] },
  { id: 'g_metodo',     label: 'Método y audiencia',      ejes: ['akribeia','endoxa','akroates'] },
  { id: 'g_polemica',   label: 'Polémica filosófica',     ejes: ['idea'] },
  { id: 'g_principios', label: 'Principios y estructura', ejes: ['arkhe','politike'] },
];

const EJES = {
  telos:     { label: 'Fin',                 greek: 'τέλος' },
  agathon:   { label: 'Bienes',              greek: 'ἀγαθόν' },
  ariston:   { label: 'Bien supremo',        greek: 'ἄριστον' },
  autarkeia: { label: 'Autarquía',           greek: 'αὐτάρκεια' },
  teleios:   { label: 'Lo completo',         greek: 'τέλειος' },
  bios:      { label: 'Curso de vida',       greek: 'βίος' },
  ergon:     { label: 'Función propia',      greek: 'ἔργον' },
  arete:     { label: 'Virtud',              greek: 'ἀρετή' },
  energeia:  { label: 'Actividad',           greek: 'ἐνέργεια' },
  hexis:     { label: 'Hábito',              greek: 'ἕξις' },
  psyche:    { label: 'Alma',                greek: 'ψυχή' },
  zoe:       { label: 'El vivir',            greek: 'ζωή' },
  logos:     { label: 'Razón',               greek: 'λόγος' },
  hedone:    { label: 'Placer',              greek: 'ἡδονή' },
  time:      { label: 'Honor',               greek: 'τιμή' },
  ploutos:   { label: 'Riqueza',             greek: 'πλοῦτος' },
  tyche:     { label: 'Fortuna',             greek: 'τύχη' },
  kalon:     { label: 'Lo noble',            greek: 'καλόν' },
  theion:    { label: 'Lo divino',           greek: 'θεῖον' },
  akribeia:  { label: 'Método',              greek: 'ἀκρίβεια' },
  endoxa:    { label: 'Opiniones recibidas', greek: 'ἔνδοξα' },
  akroates:  { label: 'Oyente',              greek: 'ἀκροατής' },
  idea:      { label: 'Idea platónica',      greek: 'ἰδέα' },
  arkhe:     { label: 'Principio',           greek: 'ἀρχή' },
  politike:  { label: 'Política',            greek: 'πολιτική' },
};

const ACCESOS = [
  { id: 'acc_texto', label: 'Texto',       desc: 'Lectura de los 10 libros de la Ética Nicomaquea.' },
  { id: 'acc_herm',  label: 'Hermenéusis', desc: 'Búsqueda vectorial, preguntas frecuentes y chat.' },
];

/* ══════════════════════════════════════════════
   ESTADO
   ══════════════════════════════════════════════ */

let rootExpanded = false;
const expandedGroups = new Set();

// Cache de posiciones: recuerda dónde dejó cada nodo el usuario
const nodePositions = {};

/* ══════════════════════════════════════════════
   CYTOSCAPE
   ══════════════════════════════════════════════ */

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: [],
  style: [
    { selector: 'node', style: {
        'label': 'data(label)', 'font-size': 12, 'color': '#2C2C2B',
        'text-wrap': 'wrap', 'text-max-width': '90px',
        'text-valign': 'bottom', 'text-margin-y': 6,
        'background-color': '#FFFFFF', 'border-color': '#E6E5E3', 'border-width': 1.5,
        'width': 36, 'height': 36,
        'transition-property': 'border-color, border-width, background-color',
        'transition-duration': '0.15s',
    }},
    { selector: 'node[type="root"]', style: {
        'width': 64, 'height': 64,
        'background-color': '#E5F2FC', 'border-color': '#2783DE', 'border-width': 2.5,
        'font-size': 15, 'font-weight': '600', 'color': '#2783DE', 'text-margin-y': 8,
    }},
    { selector: 'node[type="group"]', style: {
        'width': 44, 'height': 44, 'shape': 'roundrectangle',
        'background-color': '#F0EFED', 'border-color': '#B8B5B0',
        'font-size': 11, 'font-weight': '600', 'text-transform': 'uppercase',
        'color': '#7D7A75', 'text-max-width': '130px', 'text-margin-y': 8,
    }},
    { selector: 'node[type="access"]', style: {
        'width': 48, 'height': 48, 'shape': 'roundrectangle',
        'background-color': '#EDF7F1', 'border-color': '#46A171',
        'font-size': 12, 'font-weight': '600', 'color': '#2C6B4F', 'text-margin-y': 8,
    }},
    { selector: 'node[id="acc_herm"]', style: {
        'background-color': '#FBF1E8', 'border-color': '#D5803B', 'color': '#8F5A28',
    }},
    { selector: 'edge', style: {
        'width': 1.5, 'line-color': '#E6E5E3', 'curve-style': 'bezier',
        'transition-property': 'line-color', 'transition-duration': '0.15s',
    }},
    { selector: 'edge[type="root-group"]', style: { 'width': 2, 'line-color': '#D0CDC9' }},
    { selector: 'node:hover', style: { 'border-color': '#2783DE', 'border-width': 2.5 }},
    { selector: 'node:selected', style: {
        'border-color': '#2783DE', 'border-width': 3, 'background-color': '#E5F2FC',
    }},
  ],
  layout: { name: 'preset' },
  wheelSensitivity: 0.3,
  minZoom: 0.15,
  maxZoom: 3,
});

cy.add({ data: { id: 'root', label: 'εὐδαιμονία', type: 'root' }, position: { x: 0, y: 0 } });

// Guardar posición cuando el usuario termina de arrastrar un nodo
cy.on('dragfree', 'node', function (evt) {
  const node = evt.target;
  nodePositions[node.id()] = { x: node.position('x'), y: node.position('y') };
});

/* ══════════════════════════════════════════════
   POSICIONAMIENTO EN CÍRCULO
   ══════════════════════════════════════════════ */

// Distribuye los hijos en círculo alrededor del padre.
// Si un hijo ya tiene posición guardada (el usuario lo movió), la respeta.
function positionChildren(parentId, childIds) {
  const parent = cy.getElementById(parentId);
  if (!parent.length) return;
  const px = parent.position('x');
  const py = parent.position('y');

  // Radio proporcional a la cantidad de hijos, con mínimo generoso
  const radius = Math.max(200, childIds.length * 40);

  childIds.forEach((childId, i) => {
    const node = cy.getElementById(childId);
    if (!node.length) return;

    // Si el usuario ya lo posicionó antes, usar esa posición
    if (nodePositions[childId]) {
      node.position(nodePositions[childId]);
      return;
    }

    // Distribuir en círculo, empezando desde arriba (-90°)
    const angle = (2 * Math.PI * i) / childIds.length - Math.PI / 2;
    const x = px + radius * Math.cos(angle);
    const y = py + radius * Math.sin(angle);

    node.position({ x, y });
    nodePositions[childId] = { x, y }; // guardar para futuras expansiones
  });
}



/* ══════════════════════════════════════════════
   EXPANSIÓN / CONTRACCIÓN
   ══════════════════════════════════════════════ */

function expandRoot() {
  const elems = [];
  const childIds = [];

  GRUPOS.forEach(g => {
    elems.push({ data: { id: g.id, label: g.label, type: 'group' } });
    elems.push({ data: { source: 'root', target: g.id, type: 'root-group' } });
    childIds.push(g.id);
  });

  ACCESOS.forEach(a => {
    elems.push({ data: { id: a.id, label: a.label, type: 'access' } });
    elems.push({ data: { source: 'root', target: a.id, type: 'root-access' } });
    childIds.push(a.id);
  });

  cy.add(elems);
  rootExpanded = true;
  document.getElementById('hint').classList.add('hidden');

  positionChildren('root', childIds);
}

function collapseRoot() {
  cy.nodes().filter(n => n.id() !== 'root').remove();
  rootExpanded = false;
  expandedGroups.clear();
  document.getElementById('hint').classList.remove('hidden');
  closePanel();
 //S cy.center(cy.getElementById('root'));
}

function expandGroup(groupId) {
  const grupo = GRUPOS.find(g => g.id === groupId);
  const elems = [];
  const ejeIds = [];

  grupo.ejes.forEach(ejeId => {
    const eje = EJES[ejeId];
    elems.push({ data: { id: ejeId, label: eje.label, greek: eje.greek, type: 'axis' } });
    elems.push({ data: { source: groupId, target: ejeId, type: 'group-axis' } });
    ejeIds.push(ejeId);
  });

  cy.add(elems);
  expandedGroups.add(groupId);

  positionChildren(groupId, ejeIds);
}

function collapseGroup(groupId) {
  const grupo = GRUPOS.find(g => g.id === groupId);
  grupo.ejes.forEach(ejeId => cy.getElementById(ejeId).remove());
  expandedGroups.delete(groupId);
 // cy.center(cy.getElementById(groupId));
}

/* ══════════════════════════════════════════════
   PANEL LATERAL
   ══════════════════════════════════════════════ */

function openPanel(node) {
  const panel = document.getElementById('panel');
  const title = document.getElementById('panel-title');
  const greek = document.getElementById('panel-greek');
  const meta  = document.getElementById('panel-meta');
  const body  = document.getElementById('panel-body');
  const d = node.data();

  if (d.type === 'root') {
    title.textContent = 'Eudaimonia';
    greek.textContent = 'εὐδαιμονία';
    meta.textContent  = 'Concepto central · 25 ejes · 7 familias · 2 accesos';
    body.innerHTML = '<p class="placeholder">La felicidad como concepto organizador del libro I. Hacé click en una familia para desplegar sus ejes, o de nuevo en el centro para contraer todo.</p>';
  } else if (d.type === 'group') {
    const grupo = GRUPOS.find(g => g.id === d.id);
    const exp = expandedGroups.has(d.id);
    title.textContent = grupo.label;
    greek.textContent = '';
    meta.textContent  = 'Familia · ' + grupo.ejes.length + ' ejes';
    body.innerHTML = '<p class="placeholder">' + (exp ? 'Hacé click para contraer esta familia.' : 'Hacé click para desplegar los ejes de esta familia.') + '</p>';
  } else if (d.type === 'axis') {
    const grupo = GRUPOS.find(g => g.ejes.includes(d.id));
    title.textContent = d.label;
    greek.textContent = d.greek;
    meta.textContent  = 'Eje semántico · Familia: ' + grupo.label;
    body.innerHTML = '<p class="placeholder">Aquí irán los pasajes del corpus donde este eje es dominante, las definiciones y las relaciones con otros ejes.</p>';
  } else if (d.type === 'access') {
    const acc = ACCESOS.find(a => a.id === d.id);
    title.textContent = acc.label;
    greek.textContent = '';
    meta.textContent  = 'Acceso';
    body.innerHTML = '<p class="placeholder">' + acc.desc + ' (Próximamente.)</p>';
  }
  panel.classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
}

document.getElementById('panel-close').onclick = closePanel;

/* ══════════════════════════════════════════════
   EVENTOS
   ══════════════════════════════════════════════ */

cy.on('tap', 'node', evt => {
  const node = evt.target;
  const d = node.data();
  if (d.type === 'root') {
    rootExpanded ? collapseRoot() : expandRoot();
    closePanel();
  } else if (d.type === 'group') {
    expandedGroups.has(d.id) ? collapseGroup(d.id) : expandGroup(d.id);
    openPanel(node);
  } else {
    openPanel(node);
  }
});

cy.on('tap', evt => { if (evt.target === cy) closePanel(); });

/* ══════════════════════════════════════════════
   ZOOM
   ══════════════════════════════════════════════ */

document.getElementById('zoom-in').onclick  = () => cy.zoom({ level: cy.zoom() * 1.3, renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } });
document.getElementById('zoom-out').onclick = () => cy.zoom({ level: cy.zoom() / 1.3, renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } });
document.getElementById('zoom-fit').onclick = () => cy.fit(undefined, 50);
</script>
</body>
</html>
