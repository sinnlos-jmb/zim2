<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Query Builder · Ética Nicomaquea I</title>
<style>
:root{--text:#2C2C2B;--muted:#7D7A75;--canvas:#fff;--soft:#F9F8F7;--surface:#F0EFED;--border:#E6E5E3;--blue:#2783DE;--blue-soft:#E5F2FC;--green:#46A171;--orange:#D5803B}
*{box-sizing:border-box}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--canvas);margin:0;padding:0 20px 60px}
header{display:flex;align-items:baseline;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
header h1{font-size:16px;margin:0}
header .sub{color:var(--muted);font-size:13px}
header a{margin-left:auto;font-size:13px;color:var(--blue);text-decoration:none}
#controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
#qtypes{display:flex;gap:4px;flex-wrap:wrap}
.qtype{padding:7px 14px;font-size:13px;border:1px solid var(--border);border-radius:8px;background:var(--canvas);cursor:pointer}
.qtype.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:600}
.selwrap{display:flex;flex-direction:column;gap:3px}
.selwrap label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.selwrap select{height:36px;padding:0 10px;font-size:14px;border:1px solid var(--border);border-radius:8px;min-width:200px;background:var(--canvas)}
#go{height:36px;padding:0 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}
#go:hover{filter:brightness(.95)}
#question{font-size:15px;color:var(--muted);margin-bottom:14px;min-height:22px;font-style:italic}
.card{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--canvas)}
.ctop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rank{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border-radius:6px;font-size:12px;color:var(--muted);flex:none}
.meta{display:flex;align-items:baseline;gap:8px}
.meta strong{font-size:14px}
.bek{font-size:12px;color:var(--muted)}
.score{margin-left:auto;font-size:13px;color:var(--blue);font-weight:600}
.text{margin:0 0 10px;font-size:14px;line-height:1.55}
.why{border-top:1px solid var(--border);padding-top:8px;margin-bottom:8px}
.why .muted{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.bar{display:flex;align-items:center;gap:8px;margin:2px 0}
.bl{font-size:12px;color:var(--muted);width:130px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{flex:1;height:6px;background:var(--surface);border-radius:3px;overflow:hidden}
.bf{display:block;height:100%;background:var(--blue);border-radius:3px}
.bv{font-size:12px;color:var(--muted);width:40px;text-align:right;flex:none}
.gloss{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.gtag{font-size:12px;padding:2px 7px;background:var(--soft);border:1px solid var(--border);border-radius:5px}
.defmark{display:inline-block;font-size:11px;color:var(--green);background:#EDF7F1;border:1px solid #CDE8D9;border-radius:999px;padding:1px 8px;margin-left:8px}
.cov{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface);border-radius:999px;padding:3px 8px}
.cov.full{color:var(--green);background:#EDF7F1}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px}
</style>
</head>
<body>
<header>
  <h1>Query Builder</h1>
  <span class="sub">Aristóteles · Ética Nicomaquea, libro I</span>
  <a href="index.html">← App principal</a>
</header>

<div id="controls">
  <div id="qtypes"></div>
  <div class="selwrap">
    <label id="lab1">Concepto</label>
    <select id="sel1"></select>
  </div>
  <div class="selwrap" id="wrap2" hidden>
    <label id="lab2">Predicado</label>
    <select id="sel2"></select>
  </div>
  <button id="go">Consultar</button>
</div>

<div id="question"></div>
<div id="results"></div>

<script type="module">
import { AXES } from './js/lexicon.js';
import { vectorize, vectorFromAxes, topK } from './js/vectorize.js';

/* ---- corpus ---- */
const CORPUS = await fetch('./data/corpus.json').then(r => r.json());
const PASSAGES = CORPUS.passages.map(p => {
  const { vector, raw, hits } = vectorize(p.esOnly, p.glosses);
  return { ...p, vector, raw, hits };
});

/* ---- grupos ---- */
const GROUPS = [
  ['Arquitectura del bien',  ['telos','agathon','ariston','eudaimonia','autarkeia','teleios','bios']],
  ['Antropología y virtud',  ['ergon','arete','energeia','hexis','psyche','zoe','logos']],
  ['Bienes rivales',         ['hedone','time','ploutos','tyche']],
  ['Calificadores',          ['kalon','theion']],
  ['Método y audiencia',     ['akribeia','endoxa','akroates']],
  ['Polémica filosófica',    ['idea']],
  ['Principios y estructura',['arkhe','politike']],
];

/* ---- tipos ---- */
const TYPES = {
  que:      { label:'¿Qué es?',     axes:1, l1:'Concepto',  l2:null },
  esun:     { label:'¿Es un?',      axes:2, l1:'Sujeto',    l2:'Predicado' },
  modifica: { label:'¿Modifica a?', axes:2, l1:'Atributo',  l2:'Sujeto' },
  cual:     { label:'¿Cuál es?',    axes:2, l1:'Posesión',  l2:'Sujeto' },
};
let curType = 'que';

/* ---- marcas definicionales (boost para "¿Qué es?") ---- */
const DEF_RE = /decimos que|llamamos|definimos|ponemos|estimemos|consiste en|es una|es aquello|parece ser|tal parece|se dice que/i;

/* ---- UI: tipo de pregunta ---- */
const $ = s => document.querySelector(s);
const box = $('#qtypes');
for (const [k, t] of Object.entries(TYPES)) {
  const b = document.createElement('button');
  b.className = 'qtype' + (k === curType ? ' on' : '');
  b.textContent = t.label;
  b.onclick = () => {
    curType = k;
    document.querySelectorAll('.qtype').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    syncSelectors();
  };
  box.append(b);
}

/* ---- UI: selectores de ejes ---- */
function fillSelect(sel) {
  sel.innerHTML = '';
  for (const [glabel, ids] of GROUPS) {
    const og = document.createElement('optgroup');
    og.label = glabel;
    for (const id of ids) {
      const ax = AXES.find(a => a.id === id);
      if (!ax) continue;
      const o = document.createElement('option');
      o.value = ax.id;
      o.textContent = ax.label + ' (' + ax.greek + ')';
      og.append(o);
    }
    sel.append(og);
  }
}
fillSelect($('#sel1'));
fillSelect($('#sel2'));

function syncSelectors() {
  const t = TYPES[curType];
  $('#lab1').textContent = t.l1;
  $('#wrap2').hidden = t.axes < 2;
  if (t.axes >= 2) $('#lab2').textContent = t.l2;
}
syncSelectors();

/* ---- consulta ---- */
$('#go').onclick = run;

function run() {
  const a1 = $('#sel1').value;
  const a2 = $('#sel2').value;
  const ax1 = AXES.find(a => a.id === a1);
  const ax2 = AXES.find(a => a.id === a2);
  const t = TYPES[curType];

  /* frase plantilla */
  let q;
  if (curType === 'que')       q = '¿Qué es ' + art(ax1) + ax1.label.toLowerCase() + '?';
  else if (curType === 'esun') q = '¿' + cap(ax1.label) + ' es ' + art(ax2) + ax2.label.toLowerCase() + '?';
  else if (curType === 'modifica') q = '¿' + ax1.label + ' modifica a ' + art(ax2) + ax2.label.toLowerCase() + '?';
  else                         q = '¿Cuál es ' + art(ax1) + ax1.label.toLowerCase() + ' de ' + art(ax2) + ax2.label.toLowerCase() + '?';
  $('#question').textContent = q;

  /* vector */
  const selected = { [a1]: 1 };
  if (t.axes >= 2) selected[a2] = 1;
  const { vector } = vectorFromAxes(selected);
  let results = topK(vector, PASSAGES, 10);

  /* boost definicional para "¿Qué es?" */
  if (curType === 'que') {
    const i1 = AXES.findIndex(a => a.id === a1);
    results = results.map(r => {
      const hasMark = DEF_RE.test(r.passage.esOnly);
      const axisOn  = r.passage.raw[i1] > 0;
      return { ...r, score: r.score * (hasMark && axisOn ? 1.35 : 1), defMark: hasMark && axisOn };
    }).sort((a, b) => (Number(b.defMark) - Number(a.defMark)) || (b.score - a.score));
  }

  render(results, t);
}

function art(ax) {
  const l = ax.label.toLowerCase();
  if (/^(alma|actividad|autarquía|idea|riqueza|fortuna|honor|función)/.test(l)) return 'la ';
  if (/^(fin|bien|placer|vivir|oyente|principio)/.test(l)) return 'el ';
  if (/^lo /.test(l)) return '';
  return 'el ';
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

/* ---- render ---- */
function render(results, t) {
  const box = $('#results');
  box.innerHTML = '';
  if (!results.length) { box.append(el('div','empty','Sin coincidencias.')); return; }

  results.forEach((r, i) => {
    const p = r.passage;
    const card = el('div','card');
    const top = el('div','ctop');
    top.append(el('span','rank', String(i+1)));
    const meta = el('div','meta');
    meta.append(el('strong',null,p.id));
    meta.append(el('span','bek',p.bekker||''));
    top.append(meta);

    if (t.axes > 1) {
      const cov = el('span','cov' + (r.hitAxes===r.axisCount?' full':''), r.hitAxes+'/'+r.axisCount+' ejes');
      top.append(cov);
    }
    if (r.defMark) top.append(el('span','defmark','definición'));
    top.append(el('span','score', r.score.toFixed(3)));
    card.append(top);

    card.append(el('p','text', p.esOnly.length>320 ? p.esOnly.slice(0,320)+'…' : p.esOnly));

    /* aporte por eje */
    const qv = r.passage.vector.map((v,j)=>({j,c:v*lastVec[j]})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,4);
    if (qv.length) {
      const why = el('div','why');
      why.append(el('span','muted','Aporte al puntaje'));
      const mx = qv[0].c;
      qv.forEach(c => {
        const row = el('div','bar');
        row.append(el('span','bl',AXES[c.j].label));
        const tr = el('span','bt'); const fl = el('span','bf');
        fl.style.width = Math.max(2,(c.c/mx)*100)+'%';
        tr.append(fl); row.append(tr);
        row.append(el('span','bv',((c.c/r.cos)*100).toFixed(0)+'%'));
        why.append(row);
      });
      card.append(why);
    }

    if (p.glosses.length) {
      const g = el('div','gloss');
      p.glosses.slice(0,6).forEach(x => g.append(el('span','gtag',x)));
      card.append(g);
    }
    box.append(card);
  });
}

let lastVec = [];
const _origRun = run;
run = function() {
  const a1 = $('#sel1').value;
  const a2 = $('#sel2').value;
  const t = TYPES[curType];
  const selected = { [a1]: 1 };
  if (t.axes >= 2) selected[a2] = 1;
  const { vector } = vectorFromAxes(selected);
  lastVec = vector;
  _origRun();
};

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
}
</script>
</body>
</html>
