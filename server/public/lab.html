<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab · Ética Nicomaquea I</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/lab.css">
</head>
<body data-section="lab" class="sec-lab">

<!-- La barra de secciones la arma js/shell.js: ninguna pagina repite el markup -->
<header id="topbar"></header>

<!-- ===================================================== SIDEBAR DE LA SECCION
     Navegacion por parrafo del .txt fuente, agrupada por capitulo, y aparte
     los pasajes sin numero de parrafo (hoy intagueables por parrafo_nro).
     ========================================================================= -->
<aside id="sb">
  <div class="sbin">

    <section class="sbsec">
      <button class="sbtitle" type="button" data-target="sb-pars" aria-expanded="true" aria-controls="sb-pars">
        <span class="car">▸</span>Párrafos<span class="n" id="npar"></span>
      </button>
      <div class="sbbody" id="sb-pars">
        <p class="sbtip">Navegá el corpus por número de párrafo del .txt fuente. Borde punteado: el párrafo alimenta más de un pasaje (un tag cae en todos). También podés moverte con ← y →.</p>
        <div id="parlist"></div>
      </div>
    </section>

    <section class="sbsec">
      <button class="sbtitle" type="button" data-target="sb-orphans" aria-expanded="true" aria-controls="sb-orphans">
        <span class="car">▸</span>Sin párrafo<span class="n" id="norf"></span>
      </button>
      <!-- lo llena renderOrphans() en lab.js: pasajes sin parrafoNros -->
      <div class="sbbody sblist" id="orphanlist"></div>
    </section>

  </div>
</aside>
<div id="scrim"></div>

<main id="mn">
  <div class="mnin">
    <nav id="crumbs" aria-label="Ruta"></nav>
    <div id="parhead"></div>
    <div id="parview"></div>
  </div>
</main>

<footer id="ft">
  <span id="status"></span>
  <span id="stats"></span>
</footer>

<script src="js/shell.js"></script>
<script src="js/panels.js"></script>
<script type="module" src="js/lab.js"></script>
</body>
</html>
