<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificador de Tags · Ética Nicomaquea I</title>
<style>
:root {
  --text:#2C2C2B; --muted:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7;
  --surface:#F0EFED; --border:#E6E5E3; --blue:#2783DE; --blue-soft:#E5F2FC;
  --green:#46A171; --green-soft:#EDF7F1; --orange:#D5803B; --orange-soft:#FBF1E8;
  --red:#C0392B; --red-soft:#FDEDEC;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; }
body {
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text); background:var(--canvas);
}
header {
  display:flex; align-items:center; gap:14px; padding:14px 20px;
  border-bottom:1px solid var(--border);
}
header h1 { font-size:16px; margin:0; }
header .sub { color:var(--muted); font-size:13px; }
header a { margin-left:auto; font-size:13px; color:var(--blue); text-decoration:none; }
.layout { display:grid; grid-template-columns:300px 1fr; min-height:calc(100dvh - 53px); }
@media(max-width:820px){ .layout{grid-template-columns:1fr;} }

/* ---- Panel izquierdo ---- */
#panel {
  border-right:1px solid var(--border); background:var(--soft);
  padding:16px; overflow-y:auto;
}
#panel h2 { font-size:12px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
.field { margin-bottom:14px; }
.field label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
.field select, .field input[type=text] {
  width:100%; height:34px; padding:0 10px; font-size:14px;
  border:1px solid var(--border); border-radius:8px; background:var(--canvas);
}
.field select:focus, .field input:focus { outline:2px solid var(--blue); outline-offset:-1px; }
button.primary {
  width:100%; height:38px; background:var(--blue); color:#fff; border:none;
  border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; margin-top:6px;
}
button.primary:hover { filter:brightness(.95); }
button.secondary {
  width:100%; height:34px; background:var(--canvas); color:var(--text);
  border:1px solid var(--border); border-radius:8px; font-size:13px; cursor:pointer; margin-top:6px;
}
button.secondary:hover { border-color:var(--muted); }
/* ---- Stats ---- */
#stats { margin-top:16px; padding-top:12px; border-top:1px solid var(--border); }
#stats h3 { font-size:12px; margin:0 0 8px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
.stat-row { display:flex; justify-content:space-between; font-size:13px; padding:2px 0; }
.stat-row .val { font-weight:600; color:var(--blue); }
/* ---- Área principal ---- */
#main { padding:20px; overflow-y:auto; }
#results-count { font-size:13px; color:var(--muted); margin-bottom:12px; }
/* ---- Card de resultado ---- */
.card {
  border:1px solid var(--border); border-radius:12px; padding:16px;
  margin-bottom:12px; background:var(--canvas);
}
.card-top { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.card-top .rank {
  display:inline-flex; align-items:center; justify-content:center;
  width:24px; height:24px; border-radius:6px; background:var(--surface);
  font-size:12px; color:var(--muted); flex:none;
}
.card-top .meta { display:flex; align-items:baseline; gap:8px; }
.card-top .meta strong { font-size:14px; }
.card-top .meta .bek { font-size:12px; color:var(--muted); }
.card-top .meta .chap { font-size:12px; color:var(--muted); }
/* ---- Tags ---- */
.tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
.tag {
  font-size:12px; padding:3px 8px; border-radius:6px;
  border:1px solid var(--border); background:var(--soft);
  display:inline-flex; align-items:center; gap:4px;
}
.tag.rol-define { background:var(--blue-soft); border-color:var(--blue); color:var(--blue); }
.tag.rol-afirma { background:var(--green-soft); border-color:var(--green); color:var(--green); }
.tag.rol-faq { background:var(--orange-soft); border-color:var(--orange); color:var(--orange); }
.tag .eje { font-weight:600; }
.tag .tipo { font-style:italic; }
.tag .peso { opacity:.7; }
/* ---- Texto ---- */
.card-text { font-size:14px; line-height:1.6; margin-bottom:8px; }
.card-text .es { margin-bottom:6px; }
.card-text .gr {
  font-size:13px; color:var(--muted); line-height:1.7;
  padding:10px 12px; background:var(--soft); border-radius:8px;
}
details.grk { margin-top:6px; font-size:13px; }
details.grk summary { cursor:pointer; color:var(--muted); }
details.grk summary:hover { color:var(--text); }
/* ---- FAQ tag ---- */
.faq-q { font-size:13px; color:var(--orange); font-weight:500; margin-bottom:4px; }
.faq-r { font-size:13px; color:var(--muted); font-style:italic; }
/* ---- Error ---- */
.error-box {
  background:var(--red-soft); border:1px solid var(--red); border-radius:8px;
  padding:12px 16px; margin-bottom:12px; font-size:13px; color:var(--red);
}
/* ---- Textarea ---- */
#input-section { margin-bottom:16px; }
#input-section textarea {
  width:100%; height:180px; font-size:12px; font-family:Menlo,Consolas,monospace;
  border:1px solid var(--border); border-radius:8px; padding:10px; resize:vertical;
}
#input-section .hint { font-size:12px; color:var(--muted); margin-top:4px; }
</style>
</head>
<body>
<header>
  <h1>Verificador de Tags</h1>
  <span class="sub">Aristóteles · Ética Nicomaquea, libro I</span>
  <a href="index.html">← App principal</a>
</header>

<div class="layout">
  <div id="panel">
    <div id="input-section">
      <h2>Archivo tagueado</h2>
      <textarea id="raw-input" placeholder="Pegá aquí el archivo tagueado (EN_libro1_v7_tags_fixed.txt)..."></textarea>
      <div class="hint">Pegá el archivo tagueado o usá "Cargar archivo" si está en el servidor.</div>
      <button class="primary" id="btn-parse">Parsear archivo</button>
      <button class="secondary" id="btn-fetch">Cargar desde servidor (fetch)</button>
    </div>
<h2>Consulta</h2>
<div class="field">
  <label>Rol</label>
  <select id="f-rol">
    <option value="">Todos</option>
    <option value="define">define</option>
    <option value="afirma">afirma</option>
    <option value="faq">faq</option>
  </select>
</div>
<div class="field">
  <label>Eje</label>
  <select id="f-eje"><option value="">Todos</option></select>
</div>
<div class="field">
  <label>Tipo</label>
  <select id="f-tipo">
    <option value="">Todos</option>
    <option value="es">es</option>
    <option value="es_un">es_un</option>
    <option value="es_propiedad_de">es_propiedad_de</option>
  </select>
</div>
<div class="field">
  <label>Búsqueda de texto</label>
  <input type="text" id="f-texto" placeholder="Buscar en el texto...">
</div>
<button class="primary" id="btn-query">Consultar</button>

<div id="stats">
  <h3>Estadísticas</h3>
  <div id="stats-body"><span style="font-size:13px;color:var(--muted)">Parseá el archivo para ver estadísticas.</span></div>
</div>
</div>

  <div id="main">
    <div id="results-count"></div>
    <div id="results"></div>
  </div>
</div>

<script>
/* ================================================================
   Ejes del léxico (para poblar el selector y validar)
   ================================================================ */
const EJES = [
  'telos','agathon','ariston','eudaimonia','ergon','arete','energeia',
  'psyche','logos','hexis','hedone','time','ploutos','tyche','autarkeia',
  'akribeia','endoxa','politike','akroates','idea','bios','zoe',
  'kalon','theion','arkhe','teleios'
];

/* ================================================================
   Parser del archivo tagueado
   ================================================================ */
function parseTaggedFile(text) {
  const lines = text.split('\n');
  const paragraphs = [];
  let currentChapter = null;
  let currentTags = null;
  let currentText = [];
  let currentGreek = [];
  let errors = [];

  function flush() {
    if (currentTags !== null) {
      paragraphs.push({
        chapter: currentChapter,
        parrafo_nro: currentTags.parrafo_nro,
        tags: currentTags.tags || [],
        rawTag: currentTags,
        text: currentText.join('\n').trim(),
        greek: currentGreek.join('\n').trim()
      });
    }
    currentText = [];
    currentGreek = [];
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();

    // Línea de capítulo (número solo)
    if (/^\d+$/.test(trimmed)) {
      flush();
      currentChapter = parseInt(trimmed);
      currentTags = null;
      continue;
    }

    // Línea de separadores
    if (trimmed.startsWith('═') || trimmed.startsWith('─') || trimmed.startsWith('ARISTOTELES')) {
      continue;
    }

    // Línea de tags JSON
    if (trimmed.startsWith('{') && trimmed.includes('parrafo_nro')) {
      flush();
      try {
        currentTags = JSON.parse(trimmed);
      } catch (e) {
        errors.push({ line: i + 1, msg: 'JSON inválido: ' + e.message, raw: trimmed });
        currentTags = { parrafo_nro: null, tags: [], _error: e.message };
      }
      continue;
    }

    // Si no hay tag activo, saltar
    if (currentTags === null) continue;

    // Línea de griego paralelo (tiene caracteres griegos y no es un tag)
    if (/[\u0370-\u03FF\u1F00-\u1FFF]/.test(trimmed)) {
      currentGreek.push(trimmed);
      continue;
    }

    // Línea de texto castellano
    if (trimmed) {
      currentText.push(trimmed);
    }
  }
  flush();

  return { paragraphs, errors };
}

/* ================================================================
   Consulta
   ================================================================ */
function queryTags(paragraphs, { rol, eje, tipo, texto }) {
  return paragraphs.filter(p => {
    // Si no tiene tags, solo pasa si no hay filtros de rol/eje/tipo
    if (!p.tags.length) {
      if (rol || eje || tipo) return false;
      if (texto && !p.text.toLowerCase().includes(texto.toLowerCase())) return false;
      return true;
    }

    return p.tags.some(t => {
      // Filtro por rol
      if (rol && t.rol !== rol) return false;

      // Filtro por eje
      if (eje) {
        const ejesEnTag = [t.eje, t.eje1, t.eje2, t.eje3, t.concepto].filter(Boolean);
        if (!ejesEnTag.includes(eje)) return false;
      }

      // Filtro por tipo
      if (tipo && t.tipo !== tipo) return false;

      // Filtro por texto
      if (texto && !p.text.toLowerCase().includes(texto.toLowerCase())) return false;

      return true;
    });
  });
}

/* ================================================================
   Renderizado
   ================================================================ */
function renderResults(results) {
  const box = document.getElementById('results');
  const count = document.getElementById('results-count');
  box.innerHTML = '';
  count.textContent = results.length + ' resultado(s)';

  results.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card';

    // Top
    const top = document.createElement('div');
    top.className = 'card-top';

    const rank = document.createElement('span');
    rank.className = 'rank';
    rank.textContent = String(i + 1);
    top.appendChild(rank);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const strong = document.createElement('strong');
    strong.textContent = 'Párrafo ' + (p.parrafo_nro != null ? p.parrafo_nro : '?');
    meta.appendChild(strong);
    if (p.chapter) {
      const chap = document.createElement('span');
      chap.className = 'chap';
      chap.textContent = 'Cap. ' + p.chapter;
      meta.appendChild(chap);
    }
    top.appendChild(meta);
    card.appendChild(top);

    // Tags
    if (p.tags.length) {
      const tagsDiv = document.createElement('div');
      tagsDiv.className = 'tags';
      p.tags.forEach(t => {
        const tag = document.createElement('span');
        tag.className = 'tag rol-' + (t.rol || '');

        let html = '<span class="rol">' + (t.rol || '?') + '</span>';

        // Ejes
        const ejes = [];
        if (t.eje) ejes.push(t.eje);
        if (t.eje1) ejes.push(t.eje1);
        if (t.eje2) ejes.push('→ ' + t.eje2);
        if (t.eje3) ejes.push('→ ' + t.eje3);
        if (t.concepto) ejes.push(t.concepto);
        if (ejes.length) html += ' <span class="eje">' + ejes.join(' ') + '</span>';

        // Tipo
        if (t.tipo) html += ' <span class="tipo">[' + t.tipo + ']</span>';

        // Peso
        if (t.peso != null) html += ' <span class="peso">(' + t.peso + ')</span>';

        tag.innerHTML = html;
        tagsDiv.appendChild(tag);
      });
      card.appendChild(tagsDiv);
    }

    // FAQ
    p.tags.filter(t => t.rol === 'faq').forEach(t => {
      if (t.pregunta) {
        const q = document.createElement('div');
        q.className = 'faq-q';
        q.textContent = '❓ ' + t.pregunta;
        card.appendChild(q);
      }
      if (t.rta) {
        const r = document.createElement('div');
        r.className = 'faq-r';
        r.textContent = '↳ ' + t.rta;
        card.appendChild(r);
      }
    });

    // Nota
    p.tags.filter(t => t.nota).forEach(t => {
      const n = document.createElement('div');
      n.style.cssText = 'font-size:12px;color:var(--muted);font-style:italic;margin-bottom:6px;';
      n.textContent = '📝 ' + t.nota;
      card.appendChild(n);
    });

    // Texto castellano
    if (p.text) {
      const textDiv = document.createElement('div');
      textDiv.className = 'card-text';
      const es = document.createElement('div');
      es.className = 'es';
      es.textContent = p.text.length > 400 ? p.text.slice(0, 400) + '…' : p.text;
      textDiv.appendChild(es);
      card.appendChild(textDiv);
    }

    // Griego paralelo
    if (p.greek) {
      const det = document.createElement('details');
      det.className = 'grk';
      const sum = document.createElement('summary');
      sum.textContent = 'Griego original';
      det.appendChild(sum);
      const gr = document.createElement('div');
      gr.className = 'card-text';
      const grDiv = document.createElement('div');
      grDiv.className = 'gr';
      grDiv.textContent = p.greek;
      gr.appendChild(grDiv);
      det.appendChild(gr);
      card.appendChild(det);
    }

    box.appendChild(card);
  });
}

/* ================================================================
   Estadísticas
   ================================================================ */
function renderStats(paragraphs) {
  const body = document.getElementById('stats-body');
  body.innerHTML = '';

  const total = paragraphs.length;
  const withTags = paragraphs.filter(p => p.tags.length > 0).length;
  const withoutTags = total - withTags;

  // Contar por rol
  const roles = {};
  const ejes = {};
  const tipos = {};
  paragraphs.forEach(p => {
    p.tags.forEach(t => {
      if (t.rol) roles[t.rol] = (roles[t.rol] || 0) + 1;
      if (t.tipo) tipos[t.tipo] = (tipos[t.tipo] || 0) + 1;
      const ejesEnTag = [t.eje, t.eje1, t.eje2, t.eje3, t.concepto].filter(Boolean);
      ejesEnTag.forEach(e => { ejes[e] = (ejes[e] || 0) + 1; });
    });
  });

  function addRow(label, val) {
    const row = document.createElement('div');
    row.className = 'stat-row';
    const lab = document.createElement('span');
    lab.textContent = label;
    const v = document.createElement('span');
    v.className = 'val';
    v.textContent = val;
    row.appendChild(lab);
    row.appendChild(v);
    body.appendChild(row);
  }

  addRow('Párrafos totales', total);
  addRow('Con tags', withTags);
  addRow('Sin tags', withoutTags);
  addRow('Tags totales', Object.values(roles).reduce((a, b) => a + b, 0));

  // Separador
  const sep = document.createElement('div');
  sep.style.cssText = 'border-top:1px solid var(--border);margin:8px 0;';
  body.appendChild(sep);

  Object.entries(roles).sort((a, b) => b[1] - a[1]).forEach(([r, n]) => addRow('Rol: ' + r, n));

  const sep2 = document.createElement('div');
  sep2.style.cssText = 'border-top:1px solid var(--border);margin:8px 0;';
  body.appendChild(sep2);

  Object.entries(tipos).sort((a, b) => b[1] - a[1]).forEach(([t, n]) => addRow('Tipo: ' + t, n));

  const sep3 = document.createElement('div');
  sep3.style.cssText = 'border-top:1px solid var(--border);margin:8px 0;';
  body.appendChild(sep3);

  Object.entries(ejes).sort((a, b) => b[1] - a[1]).forEach(([e, n]) => addRow('Eje: ' + e, n));
}

/* ================================================================
   Poblar selector de ejes
   ================================================================ */
function populateEjes() {
  const sel = document.getElementById('f-eje');
  EJES.forEach(e => {
    const opt = document.createElement('option');
    opt.value = e;
    opt.textContent = e;
    sel.appendChild(opt);
  });
}

/* ================================================================
   Init
   ================================================================ */
let PARSED = { paragraphs: [], errors: [] };

document.getElementById('btn-parse').onclick = () => {
  const raw = document.getElementById('raw-input').value;
  if (!raw.trim()) { alert('Pegá el archivo tagueado primero.'); return; }
  PARSED = parseTaggedFile(raw);

  // Mostrar errores de parseo
  const main = document.getElementById('main');
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '';
  PARSED.errors.forEach(e => {
    const box = document.createElement('div');
    box.className = 'error-box';
    box.textContent = 'Línea ' + e.line + ': ' + e.msg;
    resultsDiv.appendChild(box);
  });

  renderStats(PARSED.paragraphs);
  renderResults(PARSED.paragraphs);
};

document.getElementById('btn-fetch').onclick = async () => {
  try {
    const res = await fetch('EN_libro1_v7_tags_fixed.txt');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    document.getElementById('raw-input').value = text;
    document.getElementById('btn-parse').click();
  } catch (e) {
    alert('No se pudo cargar el archivo: ' + e.message + '\n\nPegá el archivo en el textarea y usá "Parsear archivo".');
  }
};

document.getElementById('btn-query').onclick = () => {
  const rol = document.getElementById('f-rol').value;
  const eje = document.getElementById('f-eje').value;
  const tipo = document.getElementById('f-tipo').value;
  const texto = document.getElementById('f-texto').value;

  if (!PARSED.paragraphs.length) {
    alert('Parseá el archivo primero.');
    return;
  }

  const results = queryTags(PARSED.paragraphs, { rol, eje, tipo, texto });
  renderResults(results);
};

populateEjes();
</script>
</body>
</html>
