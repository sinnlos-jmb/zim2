<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vectorizador · Ética Nicomaquea I</title>
<style>
:root{
  --text:#2C2C2B; --muted:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7;
  --surface:#F0EFED; --border:#E6E5E3; --blue:#2783DE; --blue-soft:#E5F2FC;
  --green:#46A171; --orange:#D5803B;
  --sbw:288px;              /* ancho de la sidebar; 0 cuando colapsa */
  --head:60px; --foot:40px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text); background:var(--canvas);
  /* El header y el footer no se mueven porque no scrollean: el scroll vive
     dentro de la sidebar y del main por separado. Sin position:fixed. */
  height:100dvh; display:grid;
  /* minmax(0,...) y no 1fr: un track 1fr tiene minimo automatico min-content,
     asi que cualquier contenido con nowrap adentro estira la columna y
     desborda el viewport. */
  grid-template-columns:var(--sbw) minmax(0,1fr);
  grid-template-rows:var(--head) 1fr var(--foot);
  grid-template-areas:"hd hd" "sb mn" "ft ft";
  transition:grid-template-columns .18s ease;
}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border);background:var(--canvas);color:var(--text)}
.muted{color:var(--muted);font-size:13px}

/* ------------------------------------------------------------------ HEADER */
#hd{
  grid-area:hd; display:flex; align-items:center; gap:14px;
  padding:0 20px; border-bottom:1px solid var(--border); background:var(--canvas);
}
#sbtoggle{
  flex:none; width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  color:var(--muted); font-size:15px; line-height:1;
}
#sbtoggle:hover{color:var(--text);border-color:var(--muted)}
.brand{flex:none;display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:16px;line-height:1.2;margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand .sub{color:var(--muted);font-size:13px;white-space:nowrap}
@media(max-width:1080px){.brand .sub{display:none}}

.searchbar{display:flex;gap:8px;flex:1;min-width:0;max-width:620px;margin:0 auto}
input[type=text]{
  flex:1;min-width:0;height:38px;padding:0 12px;font-size:15px;color:var(--text);
  background:var(--canvas);border:1px solid var(--border);border-radius:8px;
}
input[type=text]:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
#go{height:38px;padding:0 16px;background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500;flex:none}
#go:hover{filter:brightness(.95)}
/* boton Preguntas + su menu desplegable, a la izquierda de la searchbar */
.faq{position:relative;flex:none}
#faqbtn{height:38px;padding:0 14px;background:var(--soft);color:var(--text);display:flex;align-items:center;gap:7px}
#faqbtn:hover{border-color:var(--muted)}
#faqbtn[aria-expanded="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
#faqbtn .car{font-size:10px;color:var(--muted)}
#faqbtn[aria-expanded="true"] .car{color:var(--blue)}
#faqmenu{
  position:absolute;top:calc(100% + 6px);left:0;z-index:30;
  width:330px;max-width:calc(100vw - 24px);max-height:min(70vh,520px);overflow-y:auto;
  overscroll-behavior:contain;background:var(--canvas);border:1px solid var(--border);
  border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.13);padding:6px;
}
#faqmenu[hidden]{display:none}
.faqcat{border-bottom:1px solid var(--border)}
.faqcat:last-child{border-bottom:0}
.faqcat>summary{
  list-style:none;padding:9px 10px;font-size:12px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;color:var(--muted);border-radius:6px;
  display:flex;align-items:center;gap:8px;
}
.faqcat>summary::-webkit-details-marker{display:none}
.faqcat>summary:hover{background:var(--soft);color:var(--text)}
.faqcat>summary::before{content:"\25B8";font-size:10px;transition:transform .15s ease}
.faqcat[open]>summary::before{transform:rotate(90deg)}
.faqcat[open]>summary{color:var(--text)}
.faqq{
  display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;
  padding:7px 10px 7px 28px;font-size:13.5px;line-height:1.35;color:var(--muted);border-radius:6px;
}
.faqq:hover{background:var(--soft);color:var(--text)}
.faqq:last-child{margin-bottom:6px}

/* ----------------------------------------------------------------- SIDEBAR */
#sb{
  /* columna flex que NO scrollea: el encabezado queda fijo y el scroll vive
     dentro de #axes. min-height:0 en la cadena o el hijo flexible se niega
     a encogerse y el scroll se escapa al contenedor de arriba. */
  grid-area:sb; display:flex; flex-direction:column; overflow:hidden;
  border-right:1px solid var(--border); background:var(--soft);
}
body.sb-off{--sbw:0px}
body.sb-off #sb{border-right:0}
.sbin{width:288px;flex:1;min-height:0;display:flex;flex-direction:column}
.sbhead{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;padding:16px 14px 0;flex:none}
.sbhead h2{font-size:12px;margin:0;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
#axcount{font-size:12px;color:var(--blue)}
#clearax{margin-left:auto;font-size:12px;padding:2px 8px;color:var(--muted);border-color:transparent;background:transparent}
#clearax:hover{color:var(--text);border-color:var(--border)}
#clearax[hidden]{display:none}
.sbhint{font-size:12px;color:var(--muted);margin:0 0 10px;padding:0 14px;line-height:1.45;flex:none}
#axes{
  flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  /* auto-fill: mete tantas columnas como entren. En la sidebar de 288px dan
     dos; si el contenedor crece, pasan a tres solas. */
  display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
  gap:6px; align-content:start; padding:10px 14px 24px;
  border-top:1px solid var(--border);
}
.chip{
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  gap:1px;width:100%;text-align:left;padding:6px 9px;font-size:12.5px;
  line-height:1.25;min-height:46px;background:var(--canvas);
}
.chip .gr{color:var(--muted);font-size:12px;margin-left:0}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--blue-soft);border-color:var(--blue)}
.chip.on .gr{color:var(--blue)}

/* -------------------------------------------------------------------- MAIN */
#mn{grid-area:mn;overflow-y:auto;padding:24px 24px 56px}
.mnin{max-width:760px;margin:0 auto}

/* franja horizontal del vector de la consulta, arriba de los resultados */
#qvec{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--soft);margin-bottom:20px}
#qvec h3{font-size:12px;margin:0 0 2px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600}
#qvec .qlabel{font-size:13px;color:var(--text);margin:0 0 10px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 20px}
.hitlist{margin-top:10px;padding-top:9px;border-top:1px solid var(--border);line-height:2.1}
.hitlist code{font:12px/1 Menlo,Consolas,monospace;background:var(--surface);padding:3px 6px;border-radius:4px;margin-right:4px}

.rhead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.rhead h3{font-size:15px;margin:0}

.card{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--canvas)}
.ctop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--surface);font-size:12px;color:var(--muted);flex:none}
.meta{display:flex;align-items:baseline;gap:8px;min-width:0}
.meta strong{font-size:14px}
.bek{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.score{margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums;color:var(--blue);font-weight:600;flex:none}
.text{margin:0 0 12px;font-size:15px;line-height:1.55}

.why{border-top:1px solid var(--border);padding-top:10px;margin-bottom:10px}
.why .muted{display:block;margin-bottom:6px;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0}
.bl{font-size:12px;color:var(--muted);width:140px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{flex:1;height:6px;background:var(--surface);border-radius:3px;overflow:hidden;min-width:30px}
.bf{display:block;height:100%;background:var(--blue);border-radius:3px}
.bv{font-size:12px;color:var(--muted);width:42px;text-align:right;flex:none;font-variant-numeric:tabular-nums}

.gloss{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.gtag{font-size:13px;padding:3px 8px;background:var(--soft);border:1px solid var(--border);border-radius:6px}
details{font-size:13px}
summary{cursor:pointer;color:var(--muted);min-height:24px}
summary:hover{color:var(--text)}
.grtext{margin:8px 0 0;padding:12px;background:var(--soft);border-radius:8px;line-height:1.7}

.empty{padding:36px 20px;text-align:center;border:1px dashed var(--border);border-radius:12px}
.empty p{margin:0 0 16px;font-size:14px;color:var(--muted)}
.examples{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ex{font-size:13px;padding:6px 12px;background:var(--soft);color:var(--muted)}
.ex:hover{background:var(--surface);color:var(--text)}

/* ------------------------------------------------------------------ FOOTER */
#ft{
  grid-area:ft; display:flex; align-items:center; gap:12px; padding:0 20px;
  border-top:1px solid var(--border); background:var(--canvas);
}
#status{font-size:12px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stats{flex:none;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
#rebuild{margin-left:4px;font-size:12px;padding:5px 12px;color:var(--muted);flex:none}
#rebuild:hover{color:var(--text);border-color:var(--muted)}

/* ------------------------------------------------------------------- MOVIL */
#scrim{display:none}
@media(max-width:820px){
  body{grid-template-columns:minmax(0,1fr);grid-template-areas:"hd" "mn" "ft"}
  /* unico lugar donde fixed se justifica: la sidebar pasa a ser un cajon */
  #sb{
    position:fixed;top:var(--head);bottom:var(--foot);left:0;width:288px;z-index:20;
    transform:translateX(-100%);transition:transform .18s ease;border-right:1px solid var(--border);
  }
  body.sb-open #sb{transform:none}
  body.sb-open #scrim{display:block;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.28)}
  #mn{padding:16px 16px 40px}
  /* el titulo con nowrap desbordaba el header a 390px; con la app abierta
     el hamburguesa y el input alcanzan para orientarse */
  .brand{display:none}
  #hd{gap:10px;padding:0 12px}
  .searchbar{max-width:none;margin:0}
  #ft{padding:0 12px}
  #stats{display:none}
  /* el boton se reduce a su icono para no comerle ancho al input; sin la
     etiqueta, un cursor solo no dice nada, asi que entra el signo */
  .faqlab{display:none}
  #faqbtn{padding:0 10px;gap:4px}
  #faqbtn::before{content:"?";font-size:15px;font-weight:600}
  #faqbtn .car{font-size:9px}
  .bl{width:110px}
}
</style>
</head>
<body>

<header id="hd">
  <button id="sbtoggle" type="button" aria-label="Mostrar u ocultar categorías" aria-expanded="true">☰</button>
  <div class="brand">
    <h1>Vectorizador semántico</h1>
    <span class="sub">Aristóteles &middot; Ética Nicomaquea, libro I</span>
  </div>
  <div class="faq">
    <button id="faqbtn" type="button" aria-expanded="false" aria-haspopup="true" aria-controls="faqmenu">
      <span class="faqlab">Preguntas</span><span class="car">▼</span>
    </button>
    <div id="faqmenu" role="menu" hidden></div>
  </div>
  <div class="searchbar">
    <input type="text" id="q" placeholder="Escribí una pregunta: ¿qué es la felicidad?" aria-label="Consulta">
    <button id="go">Buscar</button>
  </div>
</header>

<aside id="sb">
  <div class="sbin">
    <div class="sbhead">
      <h2>Categorías</h2>
      <span id="axcount"></span>
      <button id="clearax" type="button" hidden>limpiar</button>
    </div>
    <p class="sbhint">Las 24 dimensiones del espacio. Seleccioná una o varias para consultar desde los ejes, sin escribir texto.</p>
    <div id="axes"></div>
  </div>
</aside>
<div id="scrim"></div>

<main id="mn">
  <div class="mnin">
    <section id="qvec"></section>
    <div id="results"></div>
  </div>
</main>

<footer id="ft">
  <span id="status"></span>
  <span id="stats"></span>
  <button id="rebuild">Reconstruir índice</button>
</footer>

<script>
const CORPUS = {"version":1,"passages":[{"id":"EN.I.1.a","chapter":1,"bekker":"1094a1","words":86,"esOnly":"Toda arte y toda investigación, y del mismo modo toda acción y elección, parecen tender a algún bien; por esto se ha dicho con razón que el bien es aquello a que todas las cosas tienden. Pero parece que hay alguna diferencia entre los fines, pues unos son actividades, y los otros, aparte de éstas, ciertas obras; en los casos en que hay algunos fines aparte de las acciones, son naturalmente preferibles las obras a las actividades.","glosses":["τέχνη καὶ μέθοδος","πρᾶξίς καὶ προαίρεσις","ἐφίεσθαι","ἐνέργειαι","ἔργα"],"greekParallel":"1094a Πᾶσα τέχνη καὶ πᾶσα μέθοδος, ὁμοίως δὲ πρᾶξίς τε καὶ προαίρεσις, ἀγαθοῦ τινὸς ἐφίεσθαι δοκεῖ· διὸ καλῶς ἀπεφήναντο τἀγαθόν, οὗ πάντ᾽ ἐφίεται. διαφορὰ δέ τις φαίνεται τῶν τελῶν· τὰ μὲν γάρ εἰσιν ἐνέργειαι, τὰ δὲ παρ᾽ αὐτὰς [5] ἔργα τινά. ὧν δ᾽ εἰσὶ τέλη τινὰ παρὰ τὰς πράξεις, ἐν τούτοις βελτίω πέφυκε τῶν ἐνεργειῶν τὰ ἔργα.","textHash":"39076a1b8f5e"},{"id":"EN.I.1.b","chapter":1,"bekker":"1094a7","words":161,"esOnly":"Pero como hay muchas acciones, artes y ciencias, resultan también muchos los fines: en efecto, el de la medicina es la salud; el de la construcción naval, el barco; el de la estrategia, la victoria; el de la economía, la riqueza. Y en todas aquellas que dependen de una sola facultad los fines de las principales son preferibles a los de las subordinadas, ya que éstos se persiguen en vista de aquéllos. Y es indiferente que los fines de las acciones sean las actividades mismas o alguna otra cosa fuera de ellas, como en las ciencias mencionadas.","glosses":["πράξεων καὶ τεχνῶν καὶ ἐπιστημῶν","τέλη","δύναμιν","ἀρχιτεκτονικῶν τέλη","τὰ τέλη τῶν πράξεων","τὰς ἐνεργείας αὐτὰς","λεχθεισῶν ἐπιστημῶν"],"greekParallel":"πολλῶν δὲ πράξεων οὐσῶν καὶ τεχνῶν καὶ ἐπιστημῶν πολλὰ γίνεται καὶ τὰ τέλη· ἰατρικῆς μὲν γὰρ ὑγίεια, ναυπηγικῆς δὲ πλοῖον, στρατηγικῆς δὲ νίκη, οἰκονομικῆς δὲ πλοῦτος. ὅσαι [10] δ᾽ εἰσὶ τῶν τοιούτων ὑπὸ μίαν τινὰ δύναμιν, καθάπερ ὑπὸ τὴν ἱππικὴν χαλινοποιικὴ καὶ ὅσαι ἄλλαι τῶν ἱππικῶν ὀργάνων εἰσίν, αὕτη δὲ καὶ πᾶσα πολεμικὴ πρᾶξις ὑπὸ τὴν στρατηγικήν, κατὰ τὸν αὐτὸν δὴ τρόπον ἄλλαι ὑφ᾽ ἑτέρας: ἐν ἁπάσαις δὲ τὰ τῶν ἀρχιτεκτονικῶν τέλη πάντων [15] ἐστὶν αἱρετώτερα τῶν ὑπ᾽ αὐτά: τούτων γὰρ χάριν κἀκεῖνα διώκεται. διαφέρει δ᾽ οὐδὲν τὰς ἐνεργείας αὐτὰς εἶναι τὰ τέλη τῶν πράξεων ἢ παρὰ ταύτας ἄλλο τι, καθάπερ ἐπὶ τῶν λεχθεισῶν ἐπιστημῶν.","textHash":"9dea48f47a8a"},{"id":"EN.I.2.a","chapter":2,"bekker":"1094a19","words":117,"esOnly":"Si existe, pues, algún fin de nuestros actos que queramos por él mismo y los demás por él, y no elegimos todo por otra cosa -pues así se seguiría hasta el infinito, de suerte que el deseo sería vacío y vano, es evidente que ese fin será lo bueno y lo mejor. Y así, ¿no tendrá su conocimiento gran influencia sobre nuestra vida, y, como arqueros que tienen un blanco, no alcanzaremos mejor el nuestro? Si es así, hemos de intentar comprender de un modo general cuál es y a cuál de las ciencias o facultades pertenece.","glosses":["τέλος τῶν πρακτῶν","ὃ δι᾽ αὑτὸ βουλόμεθα","αἱρούμεθα","ὄρεξιν","τἀγαθὸν καὶ τὸ ἄριστον","πρὸς τὸν βίον","περιλαβεῖν","ἐπιστημῶν ἢ δυνάμεων"],"greekParallel":"Εἰ δή τι τέλος ἐστὶ τῶν πρακτῶν ὃ δι᾽ αὑτὸ βουλόμεθα, τἆλλα δὲ διὰ τοῦτο, καὶ μὴ [20] πάντα δι᾽ ἕτερον αἱρούμεθα (πρόεισι γὰρ οὕτω γ᾽ εἰς ἄπειρον, ὥστ᾽ εἶναι κενὴν καὶ ματαίαν τὴν ὄρεξιν), δῆλον ὡς τοῦτ᾽ ἂν εἴη τἀγαθὸν καὶ τὸ ἄριστον.   ἆρ᾽ οὖν καὶ πρὸς τὸν βίον ἡ γνῶσις αὐτοῦ μεγάλην ἔχει ῥοπήν, καὶ καθάπερ τοξόται σκοπὸν ἔχοντες μᾶλλον ἂν τυγχάνοιμεν τοῦ δέοντος; εἰ δ᾽ [25] οὕτω, πειρατέον τύπῳ γε περιλαβεῖν αὐτὸ τί ποτ᾽ ἐστὶ καὶ τίνος τῶν ἐπιστημῶν ἢ δυνάμεων.","textHash":"11d007d00d69"},{"id":"EN.I.2.b","chapter":2,"bekker":"1094a27","words":184,"esOnly":"Parecería que ha de ser el de la más principal y eminentemente directiva. Tal es manifiestamente la política. En efecto, ella es la que establece qué ciencias son necesarias en las ciudades y cuáles ha de aprender cada uno, y hasta qué punto. Vemos además que las facultades más estimadas le están subordinadas, como la estrategia, la economía, la retórica. Y puesto que la política se sirve de las demás ciencias prácticas y legisla además qué se debe hacer y de qué hay que apartarse, el fin de ella comprenderá los de las demás ciencias, de modo que constituirá el bien del hombre; pues aunque el bien del individuo y el de la ciudad sean el mismo, es evidente que será mucho más grande y más perfecto alcanzar y preservar el de la ciudad; porque, ciertamente, ya es apetecible procurarlo para uno solo, pero es más noble y divino para un pueblo y para ciudades. Este es, pues, el objeto al que apunta nuestra investigación, que es una cierta disciplina política.","glosses":["κυριωτάτης","μάλιστα ἀρχιτεκτονικῆς","τἀνθρώπινον ἀγαθόν","μεῖζόν καὶ τελειότερον","κάλλιον καὶ θειότερον","ἐφίεται","μέθοδος"],"greekParallel":"δόξειε δ᾽ ἂν τῆς κυριωτάτης καὶ μάλιστα ἀρχιτεκτονικῆς. τοιαύτη δ᾽ ἡ πολιτικὴ φαίνεται· τίνας γὰρ εἶναι χρεὼν τῶν ἐπιστημῶν ἐν ταῖς πόλεσι, 1094b [1] καὶ ποίας ἑκάστους μανθάνειν καὶ μέχρι τίνος, αὕτη διατάσσει· ὁρῶμεν δὲ καὶ τὰς ἐντιμοτάτας τῶν δυνάμεων ὑπὸ ταύτην οὔσας, οἷον στρατηγικὴν οἰκονομικὴν ῥητορικήν· χρωμένης δὲ ταύτης ταῖς λοιπαῖς [πρακτικαῖς] τῶν ἐπιστημῶν, [5] ἔτι δὲ νομοθετούσης τί δεῖ πράττειν καὶ τίνων ἀπέχεσθαι, τὸ ταύτης τέλος περιέχοι ἂν τὰ τῶν ἄλλων, ὥστε τοῦτ᾽ ἂν εἴη τἀνθρώπινον ἀγαθόν. εἰ γὰρ καὶ ταὐτόν ἐστιν ἑνὶ καὶ πόλει, μεῖζόν γε καὶ τελειότερον τὸ τῆς πόλεως φαίνεται καὶ λαβεῖν καὶ σῴζειν· ἀγαπητὸν μὲν γὰρ καὶ ἑνὶ [10] μόνῳ, κάλλιον δὲ καὶ θειότερον ἔθνει καὶ πόλεσιν. ἡ μὲν οὖν μέθοδος τούτων ἐφίεται, πολιτική τις οὖσα. ἡ μὲν οὖν μέθοδος τούτων ἐφίεται, πολιτική τις οὖσα","textHash":"a1ca1dcfab80"},{"id":"EN.I.3.a","chapter":3,"bekker":"1094b12","words":103,"esOnly":"Nos contentaremos con dilucidar esto en la medida en que lo permite su materia; porque no se ha de buscar el rigor por igual en todos los razonamientos, como tampoco en todos los trabajos manuales; la nobleza y la justicia que la política considera presentan tantas diferencias y desviaciones, que parecen ser solo por convencion y no por naturaleza. Una incertidumbre semejante tienen también los bienes, por haber sobrevenido males a muchos a consecuencia de ellos; pues algunos han perecido a causa de su riqueza, y otros por su valor.","glosses":["διασαφηθείη","ὑποκειμένην ὕλην","ἅπασι τοῖς λόγοις","καλὰ καὶ δίκαια","νόμῳ μόνον","φύσει","ἀνδρείαν"],"greekParallel":null,"textHash":"9677df81e2c4"},{"id":"EN.I.3.b","chapter":3,"bekker":"1094b12","words":108,"esOnly":"Por consiguiente, hablando de cosas de esta índole y con tales puntos de partida, hemos de darnos por contentos con mostrar la verdad de un modo tosco y esquemático; hablando solo de lo que ocurre por lo general y partiendo de tales datos, basta con llegar a conclusiones semejantes. Del mismo modo se ha de aceptar cuanto aquí digamos: porque es propio del hombre instruido buscar la exactitud en cada género de conocimientos en la medida en que la admite la naturaleza del asunto; evidentemente, tan absurdo sería aprobar a un matemático que empleara la persuasión como reclamar demostraciones a un retórico.","glosses":["ἀληθὲς ἐνδείκνυσθαι","πεπαιδευμένου","πράγματος φύσις","ἀποδείξεις"],"greekParallel":"Λέγοιτο δ᾽ ἂν ἱκανῶς, εἰ κατὰ τὴν ὑποκειμένην ὕλην διασαφηθείη· τὸ γὰρ ἀκριβὲς οὐχ ὁμοίως ἐν ἅπασι τοῖς λόγοις ἐπιζητητέον, ὥσπερ οὐδ᾽ ἐν τοῖς δημιουργουμένοις. τὰ δὲ καλὰ καὶ τὰ δίκαια, [15] περὶ ὧν ἡ πολιτικὴ σκοπεῖται, πολλὴν ἔχει διαφορὰν καὶ πλάνην, ὥστε δοκεῖν νόμῳ μόνον εἶναι, φύσει δὲ μή. τοιαύτην δέ τινα πλάνην ἔχει καὶ τἀγαθὰ διὰ τὸ πολλοῖς συμβαίνειν βλάβας ἀπ᾽ αὐτῶν· ἤδη γάρ τινες ἀπώλοντο διὰ πλοῦτον, ἕτεροι δὲ δι᾽ ἀνδρείαν.\nἀγαπητὸν οὖν περὶ τοιούτων [20] καὶ ἐκ τοιούτων λέγοντας παχυλῶς καὶ τύπῳ τἀληθὲς ἐνδείκνυσθαι, καὶ περὶ τῶν ὡς ἐπὶ τὸ πολὺ καὶ ἐκ τοιούτων λέγοντας τοιαῦτα καὶ συμπεραίνεσθαι. τὸν αὐτὸν δὴ τρόπον καὶ ἀποδέχεσθαι χρεὼν ἕκαστα τῶν λεγομένων· πεπαιδευμένου γάρ ἐστιν ἐπὶ τοσοῦτον τἀκριβὲς ἐπιζητεῖν καθ᾽ ἕκαστον [25] γένος, ἐφ᾽ ὅσον ἡ τοῦ πράγματος φύσις ἐπιδέχεται· παραπλήσιον γὰρ φαίνεται μαθηματικοῦ τε πιθανολογοῦντος ἀποδέχεσθαι καὶ ῥητορικὸν ἀποδείξεις ἀπαιτεῖν.","textHash":"07feb57a48c5"},{"id":"EN.I.3.c","chapter":3,"bekker":"1094b28","words":200,"esOnly":"Por otra parte, cada uno juzga bien aquello que conoce, y de eso es buen juez; de cada cosa particular el instruído en ella, y de una manera absoluta el instruído en todo. Por esta razón, el joven no es discípulo apropiado para la política, ya que no tiene experiencia de las acciones de la vida, y la política se apoya en ellas y sobre ellas versa; además, por dejarse llevar de sus sentimientos, aprenderá en vano y sin provecho, puesto que el fin de la política no es el conocimiento, sino la acción; y es indiferente que sea joven en edad o de carácter, pues el defecto no está en el tiempo, sino en vivir y procurar todas las cosas de acuerdo con la pasión. Para tales personas, el conocimiento resulta inútil, como para los intemperantes; en cambio, para los que encauzan sus deseos y acciones según la razón, el saber acerca de estas cosas será muy provechoso. Y baste esto como introducción sobre el discípulo, el modo de recibir nuestras enseñanzas y lo que nos proponemos.","glosses":["κρίνει","νέος","βίον πράξεων","πάθεσιν","οὐ γνῶσις ἀλλὰ πρᾶξις","ἦθος","κατὰ πάθος ζῆν","γνῶσις","ἀκρατέσιν","ὀρέξεις καὶ πράττουσι","κατὰ λόγον","εἰδέναι","ἀποδεκτέον"],"greekParallel":"Ἕκαστος δὲ κρίνει καλῶς ἃ γινώσκει, καὶ τούτων ἐστὶν ἀγαθὸς κριτής. 1095a [1] καθ᾽ ἕκαστον μὲν ἄρα ὁ πεπαιδευμένος, ἁπλῶς δ᾽ ὁ περὶ πᾶν πεπαιδευμένος. διὸ τῆς πολιτικῆς οὐκ ἔστιν οἰκεῖος ἀκροατὴς ὁ νέος· ἄπειρος γὰρ τῶν κατὰ τὸν βίον πράξεων, οἱ λόγοι δ᾽ ἐκ τούτων καὶ περὶ τούτων· ἔτι δὲ τοῖς πάθεσιν ἀκολουθητικὸς ὢν [5] ματαίως ἀκούσεται καὶ ἀνωφελῶς, ἐπειδὴ τὸ τέλος ἐστὶν οὐ γνῶσις ἀλλὰ πρᾶξις. διαφέρει δ᾽ οὐδὲν νέος τὴν ἡλικίαν ἢ τὸ ἦθος νεαρός· οὐ γὰρ παρὰ τὸν χρόνον ἡ ἔλλειψις, ἀλλὰ διὰ τὸ κατὰ πάθος ζῆν καὶ διώκειν ἕκαστα. τοῖς γὰρ τοιούτοις ἀνόνητος ἡ γνῶσις γίνεται, καθάπερ τοῖς ἀκρατέσιν· [10] τοῖς δὲ κατὰ λόγον τὰς ὀρέξεις ποιουμένοις καὶ πράττουσι πολυωφελὲς ἂν εἴη τὸ περὶ τούτων εἰδέναι.","textHash":"20f7ad1f8b62"},{"id":"EN.I.4.a","chapter":4,"bekker":"1095a13","words":217,"esOnly":"Volviendo a nuestro tema, puesto que todo conocimiento y toda elección tienden a algún bien, digamos cuál es aquel a que la política aspira y cuál es el supremo entre todos los bienes que pueden realizarse. Casi todo el mundo está de acuerdo en cuanto a su nombre, pues tanto la multitud como los refinados dicen que es la felicidad, y admiten que vivir bien y obrar bien es lo mismo que ser feliz. Pero acerca de qué es la felicidad, dudan y no lo explican del mismo modo el vulgo y los sabios. Pues unos creen que es alguna de las cosas visibles y manifiestas, como el placer o la riqueza o los honores; otros, otra cosa; a menudo, incluso una misma persona opina cosas distintas: si está enfermo, la salud; si es pobre, la riqueza; los que tienen conciencia de su ignorancia admiran a los que dicen algo grande y que está por encima de su alcance. Pero algunos creen que, aparte de toda esta multitud de bienes, hay algún otro que es bueno por sí mismo y que es la causa de que todos aquéllos sean bienes.","glosses":["γνῶσις καὶ προαίρεσις","ἐφίεσθαι","ἀκρότατον τῶν πρακτῶν ἀγαθῶν","εὐδαιμονίαν","εὖ ζῆν καὶ εὖ πράττειν","οἱ πολλοὶ","ἡδονὴν ἢ πλοῦτον ἢ τιμήν","ὑγίειαν","θαυμάζουσιν","ᾤοντο","καθ᾽ αὑτὸ","αἴτιόν"],"greekParallel":"Λέγωμεν δ᾽ ἀναλαβόντες, ἐπειδὴ πᾶσα γνῶσις καὶ προαίρεσις [15] ἀγαθοῦ τινὸς ὀρέγεται, τί ἐστὶν οὗ λέγομεν τὴν πολιτικὴν ἐφίεσθαι καὶ τί τὸ πάντων ἀκρότατον τῶν πρακτῶν ἀγαθῶν. ὀνόματι μὲν οὖν σχεδὸν ὑπὸ τῶν πλείστων ὁμολογεῖται· τὴν γὰρ εὐδαιμονίαν καὶ οἱ πολλοὶ καὶ οἱ χαρίεντες λέγουσιν, τὸ δ᾽ εὖ ζῆν καὶ τὸ εὖ πράττειν ταὐτὸν ὑπολαμβάνουσι [20] τῷ εὐδαιμονεῖν· περὶ δὲ τῆς εὐδαιμονίας, τί ἐστιν, ἀμφισβητοῦσι καὶ οὐχ ὁμοίως οἱ πολλοὶ τοῖς σοφοῖς ἀποδιδόασιν. οἳ μὲν γὰρ τῶν ἐναργῶν τι καὶ φανερῶν, οἷον ἡδονὴν ἢ πλοῦτον ἢ τιμήν, ἄλλοι δ᾽ ἄλλο--πολλάκις δὲ καὶ ὁ αὐτὸς ἕτερον· νοσήσας μὲν γὰρ ὑγίειαν, πενόμενος δὲ [25] πλοῦτον· συνειδότες δ᾽ ἑαυτοῖς ἄγνοιαν τοὺς μέγα τι καὶ ὑπὲρ αὐτοὺς λέγοντας θαυμάζουσιν. ἔνιοι δ᾽ ᾤοντο (cf. οἴομαι) παρὰ τὰ πολλὰ ταῦτα ἀγαθὰ ἄλλο τι καθ᾽ αὑτὸ εἶναι, ὃ καὶ τούτοις πᾶσιν αἴτιόν ἐστι τοῦ εἶναι ἀγαθά.","textHash":"6f1986712c23"},{"id":"EN.I.4.b","chapter":4,"bekker":"1095a29","words":22,"esOnly":"Pero quizá es inútil exponer en detalle todas las opiniones, y basta con examinar las predominantes o que parecen tener alguna razón.","glosses":[],"greekParallel":"Μὴ λανθανέτω δ᾽ ἡμᾶς ὅτι διαφέρουσιν οἱ ἀπὸ τῶν ἀρχῶν λόγοι καὶ οἱ ἐπὶ τὰς ἀρχάς. εὖ γὰρ καὶ ὁ Πλάτων ἠπόρει τοῦτο καὶ ἐζήτει, πότερον ἀπὸ τῶν ἀρχῶν ἢ ἐπὶ τὰς ἀρχάς ἐστιν ἡ ὁδός, 1095b [1] ὥσπερ ἐν τῷ σταδίῳ ἀπὸ τῶν ἀθλοθετῶν ἐπὶ τὸ πέρας ἢ ἀνάπαλιν. ἀρκτέον μὲν γὰρ ἀπὸ τῶν γνωρίμων, ταῦτα δὲ διττῶς· τὰ μὲν γὰρ ἡμῖν τὰ δ᾽ ἁπλῶς. ἴσως οὖν ἡμῖν γε ἀρκτέον ἀπὸ τῶν ἡμῖν γνωρίμων.\nδιὸ δεῖ τοῖς ἔθεσιν ἦχθαι καλῶς τὸν [5] περὶ καλῶν καὶ δικαίων καὶ ὅλως τῶν πολιτικῶν ἀκουσόμενον ἱκανῶς. ἀρχὴ γὰρ τὸ ὅτι, καὶ εἰ τοῦτο φαίνοιτο ἀρκούντως, οὐδὲν προσδεήσει τοῦ διότι· ὁ δὲ τοιοῦτος ἔχει ἢ λάβοι ἂν ἀρχὰς ῥᾳδίως. ᾧ δὲ μηδέτερον ὑπάρχει τούτων, ἀκουσάτω τῶν Ἡσιόδου· [10] οὗτος μὲν πανάριστος ὃς αὐτὸς πάντα νοήσῃ,\nἐσθλὸς δ᾽ αὖ κἀκεῖνος ὃς εὖ εἰπόντι πίθηται.\nὃς δέ κε μήτ᾽ αὐτὸς νοέῃ μήτ᾽ ἄλλου ἀκούων\nἐν θυμῷ βάλληται, ὃ δ᾽ αὖτ᾽ ἀχρήιος ἀνήρ.","textHash":"71adfaa56173"},{"id":"EN.I.4.c","chapter":4,"bekker":"1095a30","words":108,"esOnly":"Tengamos presente que los razonamientos que parten de los principios difieren de los que conducen a los principios. En efecto, también Platón se preguntaba y buscaba con razón si se ha de proceder partiendo de los principios o hacia los principios; como en el estadio, de los que presiden los juegos hacia la meta o al revés. Sin duda, se ha de empezar por las cosas más fáciles de conocer; pero éstas lo son en dos sentidos: unas, para nosotros; las otras, en absoluto. Debemos, pues, acaso empezar por las más fáciles de conocer para nosotros.","glosses":["λόγοι","ἀπὸ τῶν ἀρχῶν","ἐπὶ τὰς ἀρχάς","ἀπὸ τῶν γνωρίμων","ἡμῖν","ἁπλῶς"],"greekParallel":null,"textHash":"29d69eac72a0"},{"id":"EN.I.4.d","chapter":4,"bekker":"1095b6","words":126,"esOnly":"Por eso es menester que el que se propone aprender acerca de las cosas buenas y justas y, en suma, de la política, haya sido bien conducido por sus costumbres. Pues el punto de partida es el qué, y si está suficientemente claro, no habrá ninguna necesidad del porqué. Un hombre tal, o tiene ya o adquirirá fácilmente los principios. Pero el que no dispone de ninguna de estas cosas, escuche las palabras de Hesíodo: Es el mejor de todos el que por sí solo comprende todas las cosas; es noble asimismo el que obedece al que aconseja bien; pero el que ni comprende por sí mismo ni lo que escucha a otro retiene en su mente, es un hombre inútil.","glosses":["καλῶν καὶ δικαίων","ἦχθαι","ἀρχὰς"],"greekParallel":null,"textHash":"cb0e4ca3dc6c"},{"id":"EN.I.5.a","chapter":5,"bekker":"1095b14","words":134,"esOnly":"Pero continuemos desde el punto en que nos desviamos. En efecto, a juzgar por las formas de vida que llevan, no parece infundado afirmar que la mayoría, por demás vulgar, identifica el bien y la felicidad con el placer, y por eso ama la vida dedicada al disfrute. Pues son tres los principales modos de vida: el que acabamos de mencionar, la política y en tercer lugar la contemplativa. Los hombres vulgares se muestran completamente serviles al preferir una vida de bestias, pero tienen derecho a hablar porque muchos de los que están en puestos elevados se asemejan en sus pasiones a Sardanápalo. En cambio, los hombres cultivados y activos ponen el bien en el honor, pues tal viene a ser el fin de la vida política.","glosses":["οἱ πολλοὶ","ἡδονήν","χαρίεντες καὶ πρακτικοὶ","τιμήν"],"greekParallel":"Ἡμεῖς δὲ λέγωμεν ὅθεν παρεξέβημεν. τὸ γὰρ ἀγαθὸν [15] καὶ τὴν εὐδαιμονίαν οὐκ ἀλόγως ἐοίκασιν ἐκ τῶν βίων ὑπολαμβάνειν οἱ μὲν πολλοὶ καὶ φορτικώτατοι τὴν ἡδονήν· διὸ καὶ τὸν βίον ἀγαπῶσι τὸν ἀπολαυστικόν. τρεῖς γάρ εἰσι μάλιστα οἱ προύχοντες, ὅ τε νῦν εἰρημένος καὶ ὁ πολιτικὸς καὶ τρίτος ὁ θεωρητικός. οἱ μὲν οὖν πολλοὶ παντελῶς [20] ἀνδραποδώδεις φαίνονται βοσκημάτων βίον προαιρούμενοι, τυγχάνουσι δὲ λόγου διὰ τὸ πολλοὺς τῶν ἐν ταῖς ἐξουσίαις ὁμοιοπαθεῖν Σαρδαναπάλλῳ. οἱ δὲ χαρίεντες καὶ πρακτικοὶ τιμήν· τοῦ γὰρ πολιτικοῦ βίου σχεδὸν τοῦτο τέλος.","textHash":"1cd729748b4f"},{"id":"EN.I.5.b","chapter":5,"bekker":"1095b24","words":91,"esOnly":"Pero parece ser más superficial que lo que buscamos, pues parece que está más en los que conceden los honores que en el honrado, y presuponemos que el bien es algo propio y difícil de arrebatar. Dan la impresión, además, de perseguir el honor para persuadirse a sí mismos de que son buenos, pues buscan ser honrados por los hombres prudentes y entre quienes los conocen, y fundados en la virtud; es evidente, por tanto, que según ellos mismos la virtud es superior.","glosses":["ἐπιπολαιότερον","μαντευόμεθα","οἰκεῖόν καὶ δυσαφαίρετον","τιμᾶσθαι","φρονίμων","ἀρετῇ"],"greekParallel":"φαίνεται δ᾽ ἐπιπολαιότερον εἶναι τοῦ ζητουμένου· δοκεῖ γὰρ ἐν [25] τοῖς τιμῶσι μᾶλλον εἶναι ἢ ἐν τῷ τιμωμένῳ, τἀγαθὸν δὲ οἰκεῖόν τι καὶ δυσαφαίρετον εἶναι μαντευόμεθα. ἔτι δ᾽ ἐοίκασι τὴν τιμὴν διώκειν ἵνα πιστεύσωσιν ἑαυτοὺς ἀγαθοὺς εἶναι· ζητοῦσι γοῦν ὑπὸ τῶν φρονίμων τιμᾶσθαι, καὶ παρ᾽ οἷς γινώσκονται, καὶ ἐπ᾽ ἀρετῇ· δῆλον οὖν ὅτι κατά γε [30] τούτους ἡ ἀρετὴ κρείττων.","textHash":"7c445a5e7159"},{"id":"EN.I.5.c","chapter":5,"bekker":"1095b31","words":79,"esOnly":"Acaso se podría suponer que ésta sea el fin de la vida política; pero resulta también insuficiente, pues parece posible que: el que posee la virtud esté dormido o inactivo durante toda su vida, y además de esto padezca grandes males y los mayores infortunios; y nadie juzgará feliz al que viviera así, a no ser para defender esa tesis. Y basta sobre esto, pues ya hemos hablado suficientemente de ello en nuestros escritos enciclopédicos.","glosses":["ὑπολάβοι","ἀρετὴ","ἀτελεστέρα","ἀπρακτεῖν"],"greekParallel":"τάχα δὲ καὶ μᾶλλον ἄν τις τέλος τοῦ πολιτικοῦ βίου ταύτην ὑπολάβοι. φαίνεται δὲ  καὶ αὕτη· δοκεῖ γὰρ ἐνδέχεσθαι καὶ καθεύδειν ἔχοντα τὴν ἀρετὴν ἢ ἀπρακτεῖν διὰ βίου, καὶ πρὸς τούτοις κακοπαθεῖν καὶ ἀτυχεῖν τὰ μέγιστα· 1096a [1] τὸν δ᾽ οὕτω ζῶντα οὐδεὶς ἂν εὐδαιμονίσειεν, εἰ μὴ θέσιν διαφυλάττων. καὶ περὶ μὲν τούτων ἅλις· ἱκανῶς γὰρ καὶ ἐν τοῖς ἐγκυκλίοις εἴρηται περὶ αὐτῶν.","textHash":"35922c5abe0f"},{"id":"EN.I.5.d","chapter":5,"bekker":"1096a4","words":93,"esOnly":"El tercer modo de vida es el contemplativo, que examinaremos más adelante. En cuanto a la vida de dedicada a ganar dinero, es, en cierto modo, forzada, y es evidente que la riqueza no es el bien que buscamos, pues sólo es útil como medio en vista de otra cosa. Por eso más bien se tomarían como fines las cosas antes mencionados, ya que son apreciadas por sí mismas; pero es evidente que tampoco lo son, aunque se hayan acumulado sobre ellos muchas razones. Dejémoslos, pues.","glosses":["χρηματιστὴς","πλοῦτος","τὸ ζητούμενον ἀγαθόν","δι᾽ αὑτὰ"],"greekParallel":"τρίτος δ᾽ ἐστὶν ὁ θεωρητικός, ὑπὲρ οὗ [5] τὴν ἐπίσκεψιν ἐν τοῖς ἑπομένοις ποιησόμεθα.\nὉ δὲ χρηματιστὴς βίαιός τις ἐστίν, καὶ ὁ πλοῦτος δῆλον ὅτι οὐ τὸ ζητούμενον ἀγαθόν· χρήσιμον γὰρ καὶ ἄλλου χάριν. διὸ μᾶλλον τὰ πρότερον λεχθέντα τέλη τις ἂν ὑπολάβοι· δι᾽ αὑτὰ γὰρ ἀγαπᾶται. φαίνεται δ᾽ οὐδ᾽ ἐκεῖνα· καίτοι πολλοὶ λόγοι [10] πρὸς αὐτὰ καταβέβληνται. ταῦτα μὲν οὖν ἀφείσθω.","textHash":"3b8d54feee0b"},{"id":"EN.I.6.a","chapter":6,"bekker":"1096a11","words":76,"esOnly":"Quizá sea mejor considerar el aspecto general de la cuestión y preguntarnos cuál es su sentido, aunque esta investigación nos resulte difícil por ser amigos nuestros los que han introducido las ideas. Parece, con todo, que es mejor y que debemos, para salvar la verdad, sacrificar incluso lo que nos es propio; sobre todo, siendo filósofos, pues siéndonos ambas cosas queridas, es debido preferir la verdad.","glosses":["ἐπισκέψασθαι","καθόλου","διαπορῆσαι","τὰ εἴδη","τὰ οἰκεῖα … ἀναιρεῖν","ἀλήθειαν"],"greekParallel":"Τὸ δὲ καθόλου βέλτιον ἴσως ἐπισκέψασθαι καὶ διαπορῆσαι πῶς λέγεται, καίπερ προσάντους τῆς τοιαύτης ζητήσεως γινομένης διὰ τὸ φίλους ἄνδρας εἰσαγαγεῖν τὰ εἴδη. δόξειε δ᾽ ἂν ἴσως βέλτιον εἶναι καὶ δεῖν ἐπὶ σωτηρίᾳ γε τῆς [15] ἀληθείας καὶ τὰ οἰκεῖα ἀναιρεῖν, ἄλλως τε καὶ φιλοσόφους ὄντας· ἀμφοῖν γὰρ ὄντοιν φίλοιν ὅσιον προτιμᾶν τὴν ἀλήθειαν.","textHash":"0db498ef6542"},{"id":"EN.I.6.b","chapter":6,"bekker":"1096a17","words":86,"esOnly":"Los que introdujeron esta doctrina no pusieron ideas en las cosas en que se decía anterior y posterior —y por eso no establecieron idea de los números —; pero el bien se dice en la sustancia y en la cualidad y en la relación; ahora bien, lo que es por sí, la sustancia, es anterior por naturaleza a la relación —que parece una ramificación y accidente del ente —, de modo que no podría haber idea común a ambas.","glosses":["δόξαν","ἀριθμῶν","τί ἐστι","ποιῷ","πρός τι","οὐσία","ὄντος"],"greekParallel":"Οἱ δὴ κομίσαντες τὴν δόξαν ταύτην οὐκ ἐποίουν ἰδέας ἐν οἷς τὸ πρότερον καὶ ὕστερον ἔλεγον, διόπερ οὐδὲ τῶν ἀριθμῶν ἰδέαν κατεσκεύαζον· τὸ δ᾽ ἀγαθὸν λέγεται καὶ ἐν [20] τῷ τί ἐστι καὶ ἐν τῷ ποιῷ καὶ ἐν τῷ πρός τι, τὸ δὲ καθ᾽ αὑτὸ καὶ ἡ οὐσία πρότερον τῇ φύσει τοῦ πρός τι (παραφυάδι γὰρ τοῦτ᾽ ἔοικε καὶ συμβεβηκότι τοῦ ὄντος)· ὥστ᾽ οὐκ ἂν εἴη κοινή τις ἐπὶ τούτοις ἰδέα.","textHash":"1d893f94b26c"},{"id":"EN.I.6.c","chapter":6,"bekker":"1096a24","words":99,"esOnly":"Además, como el bien se dice de tantos modos como el ser —pues se dice en la categoría de sustancia, como Dios y el entendimiento; y en la de cualidad las virtudes, y en la de cantidad la medida adecuada, y en la de relación lo útil, y en la de tiempo la oportunidad, y en la de lugar la residencia, etc.—, es claro que no habrá ninguna noción común universal y una; porque no se predicaría en todas las categorías, sino sólo en una.","glosses":["τῷ ὄντι","τῷ τί","νοῦς","ἀρεταί","ποσῷ","τὸ μέτριον","χρήσιμον","καιρός","δίαιτα","καθόλου","ἕν"],"greekParallel":"ἔτι δ᾽ ἐπεὶ τἀγαθὸν ἰσαχῶς λέγεται τῷ ὄντι (καὶ γὰρ ἐν τῷ τί λέγεται, οἷον ὁ θεὸς καὶ [25] ὁ νοῦς, καὶ ἐν τῷ ποιῷ αἱ ἀρεταί, καὶ ἐν τῷ ποσῷ τὸ μέτριον, καὶ ἐν τῷ πρός τι τὸ χρήσιμον, καὶ ἐν χρόνῳ καιρός, καὶ ἐν τόπῳ δίαιτα καὶ ἕτερα τοιαῦτα), δῆλον ὡς οὐκ ἂν εἴη κοινόν τι καθόλου καὶ ἕν· οὐ γὰρ ἂν ἐλέγετ᾽ ἐν πάσαις ταῖς κατηγορίαις, ἀλλ᾽ ἐν μιᾷ μόνῃ.","textHash":"6ce324287dd5"},{"id":"EN.I.6.d","chapter":6,"bekker":"1096a30","words":74,"esOnly":"Por otra parte, como de las cosas que son según una sola idea hay una sola ciencia, también habría una ciencia de todos los bienes; ahora bien, hay muchas, incluso de los que caen bajo una sola categoría; así, la ciencia de la oportunidad, en la guerra es la estrategia, en la enfermedad la medicina; y la de lo mesurado, en el alimento es la medicina, en los esfuerzos la gimnasia.","glosses":["ἐπιστήμη","ἰατρική","μετρίου"],"greekParallel":"ἔτι δ᾽ ἐπεὶ τῶν [30] κατὰ μίαν ἰδέαν μία καὶ ἐπιστήμη, καὶ τῶν ἀγαθῶν ἁπάντων ἦν ἂν μία τις ἐπιστήμη· νῦν δ᾽ εἰσὶ πολλαὶ καὶ τῶν ὑπὸ μίαν κατηγορίαν, οἷον καιροῦ, ἐν πολέμῳ μὲν γὰρ στρατηγικὴ ἐν νόσῳ δ᾽ ἰατρική, καὶ τοῦ μετρίου ἐν τροφῇ μὲν ἰατρικὴ ἐν πόνοις δὲ γυμναστική.","textHash":"b95e371a7854"},{"id":"EN.I.6.e","chapter":6,"bekker":"1096a35","words":113,"esOnly":"Podría preguntarse también qué quieren decir con «cada cosa en sí misma»; si la definición de «hombre en sí mismo» y de «hombre» es una y la misma, a saber, la del hombre; pues en cuanto hombre, en nada se distinguirán; y si es así, tampoco en cuanto bien. Ni tampoco por ser eterno será más bien, puesto que tampoco es más blanco lo que dura mucho tiempo que lo que dura un solo día. Los pitagóricos tratan, al parecer, esta cuestión con más verosimilitud al colocar lo uno en la serie de los bienes, y Espeusipo parece seguirlos. Pero dejemos esto para otra discusión.","glosses":["αὐτοέκαστον","λόγος","ἀίδιον","τὸ ἕν","τῶν ἀγαθῶν συστοιχίᾳ"],"greekParallel":"ἀπορήσειε δ᾽ ἄν τις τί [35] ποτε καὶ βούλονται λέγειν αὐτοέκαστον, εἴπερ ἔν τε αὐτοανθρώπῳ 1096b [1] καὶ ἐν ἀνθρώπῳ εἷς καὶ ὁ αὐτὸς λόγος ἐστὶν ὁ τοῦ ἀνθρώπου. ᾗ γὰρ ἄνθρωπος, οὐδὲν διοίσουσιν· εἰ δ᾽ οὕτως, οὐδ᾽ ᾗ ἀγαθόν. ἀλλὰ μὴν οὐδὲ τῷ ἀίδιον εἶναι μᾶλλον ἀγαθὸν ἔσται, εἴπερ μηδὲ λευκότερον τὸ πολυχρόνιον τοῦ [5] ἐφημέρου. πιθανώτερον δ᾽ ἐοίκασιν οἱ Πυθαγόρειοι λέγειν περὶ αὐτοῦ, τιθέντες ἐν τῇ τῶν ἀγαθῶν συστοιχίᾳ τὸ ἕν· οἷς δὴ καὶ Σπεύσιππος ἐπακολουθῆσαι δοκεῖ. Ἀλλὰ περὶ μὲν τούτων ἄλλος ἔστω λόγος·","textHash":"c93787ce2c75"},{"id":"EN.I.6.f","chapter":6,"bekker":"1096b8","words":70,"esOnly":"A propósito de lo dicho se suscita una duda, porque no se han referido estas palabras a todos los bienes, sino que se dicen según una sola especie: los que se buscan y aman por sí mismos, mientras que los bienes que los producen o los defienden de algún modo o impiden sus contrarios se dicen por referencia a éstos y de otra manera.","glosses":["ὑποφαίνεται","καθ᾽ ἓν εἶδος","διὰ ταῦτα"],"greekParallel":"τοῖς δὲ λεχθεῖσιν ἀμφισβήτησίς τις ὑποφαίνεται διὰ τὸ μὴ περὶ παντὸς ἀγαθοῦ τοὺς λόγους [10] εἰρῆσθαι, λέγεσθαι δὲ καθ᾽ ἓν εἶδος τὰ καθ᾽ αὑτὰ διωκόμενα καὶ ἀγαπώμενα, τὰ δὲ ποιητικὰ τούτων ἢ φυλακτικά πως ἢ τῶν ἐναντίων κωλυτικὰ διὰ ταῦτα λέγεσθαι καὶ τρόπον ἄλλον.","textHash":"556cdf840daa"},{"id":"EN.I.6.g","chapter":6,"bekker":"1096b13","words":189,"esOnly":"Es evidente, pues, que los bienes pueden decirse de dos modos: unos por sí mismos, y los otros por éstos. Separando, pues, de los bienes útiles los que son bienes por sí mismos, consideremos si éstos se dicen según una sola idea. Pero ¿qué bienes se han de considerar por sí? ¿Todos aquellos que buscamos incluso aislados, como el pensar y el ver y algunos placeres y honores? Todos éstos, en efecto, aunque los busquemos en vista de otra cosa, podrían considerarse, sin embargo, como bienes por sí mismos; ¿o no se ha de considerar como bien en sí nada más que la idea? En este caso, la especie sería inútil. Si, por otra parte, aquéllos son bienes por sí mismos, forzosamente resplandecerá en todos ellos la misma noción del bien, como la de la blancura en la nieve y en el albayalde. Pero las nociones de honor, prudencia y placer son otras y diferentes precisamente en tanto que bienes; por consiguiente, no es el bien algo común según una sola idea.","glosses":["καθ᾽ αὑτά","διὰ ταῦτα","ὠφελíμων","κατὰ μίαν ἰδέαν","τῆς ἰδέας","εἶδος","μάταιον","φρονεῖν","τὸ ἀγαθὸν κοινόν τι"],"greekParallel":"δῆλον οὖν ὅτι διττῶς λέγοιτ᾽ ἂν τἀγαθά, καὶ τὰ μὲν καθ᾽ αὑτά, θάτερα δὲ διὰ ταῦτα. χωρίσαντες [15] οὖν ἀπὸ τῶν ὠφελίμων τὰ καθ᾽ αὑτὰ σκεψώμεθα εἰ λέγεται κατὰ μίαν ἰδέαν. καθ᾽ αὑτὰ δὲ ποῖα θείη τις ἄν; ἢ ὅσα καὶ μονούμενα διώκεται, οἷον τὸ φρονεῖν καὶ ὁρᾶν καὶ ἡδοναί τινες καὶ τιμαί; ταῦτα γὰρ εἰ καὶ δι᾽ ἄλλο τι διώκομεν, ὅμως τῶν καθ᾽ αὑτὰ ἀγαθῶν θείη τις ἄν. ἢ οὐδ᾽ [20] ἄλλο οὐδὲν πλὴν τῆς ἰδέας; ὥστε μάταιον ἔσται τὸ εἶδος. εἰ δὲ καὶ ταῦτ᾽ ἐστὶ τῶν καθ᾽ αὑτά, τὸν τἀγαθοῦ λόγον ἐν ἅπασιν αὐτοῖς τὸν αὐτὸν ἐμφαίνεσθαι δεήσει, καθάπερ ἐν χιόνι καὶ ψιμυθίῳ τὸν τῆς λευκότητος. τιμῆς δὲ καὶ φρονήσεως καὶ ἡδονῆς ἕτεροι καὶ διαφέροντες οἱ λόγοι ταύτῃ [25] ᾗ ἀγαθά. οὐκ ἔστιν ἄρα τὸ ἀγαθὸν κοινόν τι κατὰ μίαν ἰδέαν.","textHash":"828e4d5db32c"},{"id":"EN.I.6.h","chapter":6,"bekker":"1096b26","words":164,"esOnly":"¿Cómo se dice entonces? Porque no se parece a las cosas que son homónimas por azar. ¿Acaso por proceder de uno solo o por concurrir todos al mismo fin, o más bien por analogía? Como la vista en el cuerpo, la inteligencia en el alma, y así sucesivamente. Pero acaso debemos dejar esto por ahora, porque dar cuenta exacta de esta cuestión sería más propio de otra disciplina filosófica. Y lo mismo acerca de la idea, pues si lo que se predica en común como bien fuera algo uno, o algo separado que existiera por sí mismo, el hombre no podría realizarlo ni adquirirlo; y buscamos algo de esta índole. Acaso podría pensar alguien que sería muy útil conocerlo para alcanzar los bienes que se pueden adquirir y realizar, porque teniendo este modelo conoceremos también mejor nuestros bienes, y conociéndolos los lograremos.","glosses":["ἀπὸ τύχης ὁμωνύμοις","πρὸς ἓν ἅπαντα συντελεῖν","ἐν ψυχῇ νοῦς","οἰκειότερον","χωριστὸν","καθ᾽ αὑτό","πρακτὸν","ζητεῖται","γνωρίζειν αὐτὸ","εἰσόμεθα","τὰ ἡμῖν ἀγαθά"],"greekParallel":"Ἀλλὰ πῶς δὴ λέγεται; οὐ γὰρ ἔοικε τοῖς γε ἀπὸ τύχης ὁμωνύμοις. ἀλλ᾽ ἆρά γε τῷ ἀφ᾽ ἑνὸς εἶναι ἢ πρὸς ἓν ἅπαντα συντελεῖν, ἢ μᾶλλον κατ᾽ ἀναλογίαν; ὡς γὰρ ἐν σώματι ὄψις, ἐν ψυχῇ νοῦς, καὶ ἄλλο δὴ ἐν ἄλλῳ. [30] ἀλλ᾽ ἴσως ταῦτα μὲν ἀφετέον τὸ νῦν· ἐξακριβοῦν γὰρ ὑπὲρ αὐτῶν ἄλλης ἂν εἴη φιλοσοφίας οἰκειότερον. ὁμοίως δὲ καὶ περὶ τῆς ἰδέας· εἰ γὰρ καὶ ἔστιν ἕν τι τὸ κοινῇ κατηγορούμενον ἀγαθὸν ἢ χωριστὸν αὐτό τι καθ᾽ αὑτό, δῆλον ὡς οὐκ ἂν εἴη πρακτὸν οὐδὲ κτητὸν ἀνθρώπῳ· νῦν δὲ τοιοῦτόν τι [35] ζητεῖται. τάχα δέ τῳ δόξειεν ἂν βέλτιον εἶναι γνωρίζειν αὐτὸ 1097a [1] πρὸς τὰ κτητὰ καὶ πρακτὰ τῶν ἀγαθῶν· οἷον γὰρ παράδειγμα τοῦτ᾽ ἔχοντες μᾶλλον εἰσόμεθα καὶ τὰ ἡμῖν ἀγαθά, κἂν εἰδῶμεν, ἐπιτευξόμεθα αὐτῶν.","textHash":"53fd7795d29e"},{"id":"EN.I.6.i","chapter":6,"bekker":"1097a4","words":139,"esOnly":"Este razonamiento ofrece, sin duda, cierta verosimilitud; pero parece discordar de las ciencias: todas, en efecto, aspiran a algún bien y buscando lo que les falta, dejan de lado el conocimiento del bien mismo. Y en verdad no es razonable que todos los técnicos desconozcan una ayuda tan importante y ni siquiera la busquen. Y además no puede comprenderse qué provecho sacará para su arte el tejedor o el carpintero de conocer el bien en sí, o cómo podrá ser mejor médico o mejor general el que haya contemplado esta idea. Es evidente que el médico ni siquiera considera así la salud, sino la salud del hombre, y más bien probablemente la de este hombre, ya que cura a cada individuo. Y baste con lo dicho sobre estas cosas.","glosses":["λόγος","ἐφιέμεναι","γνῶσιν","οὐκ εὔλογον","ἄπορον","τέχνην","εἰδὼς","τεθεαμένος","ἰατρός"],"greekParallel":"πιθανότητα μὲν οὖν τινα ἔχει ὁ λόγος, ἔοικε δὲ ταῖς ἐπιστήμαις διαφωνεῖν· [5] πᾶσαι γὰρ ἀγαθοῦ τινὸς ἐφιέμεναι καὶ τὸ ἐνδεὲς ἐπιζητοῦσαι παραλείπουσι τὴν γνῶσιν αὐτοῦ. καίτοι βοήθημα τηλικοῦτον τοὺς τεχνίτας ἅπαντας ἀγνοεῖν καὶ μηδ᾽ ἐπιζητεῖν οὐκ εὔλογον. ἄπορον δὲ καὶ τί ὠφεληθήσεται ὑφάντης ἢ τέκτων πρὸς τὴν αὑτοῦ τέχνην εἰδὼς τὸ αὐτὸ τοῦτο ἀγαθόν, [10] ἢ πῶς ἰατρικώτερος ἢ στρατηγικώτερος ἔσται ὁ τὴν ἰδέαν αὐτὴν τεθεαμένος. φαίνεται μὲν γὰρ οὐδὲ τὴν ὑγίειαν οὕτως ἐπισκοπεῖν ὁ ἰατρός, ἀλλὰ τὴν ἀνθρώπου, μᾶλλον δ᾽ ἴσως τὴν τοῦδε· καθ᾽ ἕκαστον γὰρ ἰατρεύει. καὶ περὶ μὲν τούτων ἐπὶ τοσοῦτον εἰρήσθω.","textHash":"710dc46dd9f7"},{"id":"EN.I.7.a","chapter":7,"bekker":"1097a15","words":128,"esOnly":"Volvamos de nuevo al bien que buscamos para preguntarnos qué es. Porque parece que es distinto en cada actividad y en cada arte; en efecto, es uno en la medicina, otro en la estrategia, y así en las demás. Pero ¿qué es el bien de cada una? ¿No es aquello en vista de lo cual se hacen las demás cosas? En la medicina es la salud; en la estrategia, la victoria; en la arquitectura, la casa; en otros casos otras cosas, y en toda acción y decisión es el fin, pues todos hacen las demás cosas en vista de él. De modo que si hay algún fin de todos los actos, éste será el bien realizable, y éstos si hay varios.","glosses":["ζητούμενον ἀγαθόν","πράξει καὶ τέχνῃ","νίκη","προαιρέσει"],"greekParallel":"[15] Πάλιν δ᾽ ἐπανέλθωμεν ἐπὶ τὸ ζητούμενον ἀγαθόν, τί ποτ᾽ ἂν εἴη. φαίνεται μὲν γὰρ ἄλλο ἐν ἄλλῃ πράξει καὶ τέχνῃ· ἄλλο γὰρ ἐν ἰατρικῇ καὶ στρατηγικῇ καὶ ταῖς λοιπαῖς ὁμοίως. τί οὖν ἑκάστης τἀγαθόν; ἢ οὗ χάριν τὰ λοιπὰ πράττεται; τοῦτο δ᾽ ἐν ἰατρικῇ μὲν ὑγίεια, ἐν στρατηγικῇ [20] δὲ νίκη, ἐν οἰκοδομικῇ δ᾽ οἰκία, ἐν ἄλλῳ δ᾽ ἄλλο, ἐν ἁπάσῃ δὲ πράξει καὶ προαιρέσει τὸ τέλος· τούτου γὰρ ἕνεκα τὰ λοιπὰ πράττουσι πάντες. ὥστ᾽ εἴ τι τῶν πρακτῶν ἁπάντων ἐστὶ τέλος, τοῦτ᾽ ἂν εἴη τὸ πρακτὸν ἀγαθόν, εἰ δὲ πλείω, ταῦτα.","textHash":"e795ec97659c"},{"id":"EN.I.7.b","chapter":7,"bekker":"1097a24","words":152,"esOnly":"Nuestro razonamiento, después de muchos rodeos, vuelve al mismo punto; pero intentemos aclarar más esto. Puesto que parece que los fines son varios y elgunos de éstos los elegimos por otros, como la riqueza, las flautas y en general los instrumentos, es evidente que no todos son perfectos, pero lo mejor parece ser algo perfecto; de suerte que si sólo hay un bien perfecto, ése será el que buscamos, y si hay varios, el más perfecto de ellos. Llamamos más perfecto al que se persigue por sí mismo que al que se busca por otra cosa, y al que nunca se elige por otra cosa, más que a los que se eligen a la vez por sí mismos y por otro fin, y en general consideramos perfecto lo que se elige siempre por sí mismo y nunca por otra cosa.","glosses":["αἱρούμεθά","ὄργανα","τέλεια","ἄριστον","τελειότατον","καθ᾽ αὑτὸ διωκτὸν","δι᾽ ἄλλο αἱρετὸν","ἀεὶ"],"greekParallel":"Μεταβαίνων δὴ ὁ λόγος εἰς ταὐτὸν ἀφῖκται· τοῦτο [25] δ᾽ ἔτι μᾶλλον διασαφῆσαι πειρατέον. ἐπεὶ δὲ πλείω φαίνεται τὰ τέλη, τούτων δ᾽ αἱρούμεθά τινα δι᾽ ἕτερον, οἷον πλοῦτον αὐλοὺς καὶ ὅλως τὰ ὄργανα, δῆλον ὡς οὐκ ἔστι πάντα τέλεια· τὸ δ᾽ ἄριστον τέλειόν τι φαίνεται. ὥστ᾽ εἰ μέν ἐστιν ἕν τι μόνον τέλειον, τοῦτ᾽ ἂν εἴη τὸ ζητούμενον, [30] εἰ δὲ πλείω, τὸ τελειότατον τούτων. τελειότερον δὲ λέγομεν τὸ καθ᾽ αὑτὸ διωκτὸν τοῦ δι᾽ ἕτερον καὶ τὸ μηδέποτε δι᾽ ἄλλο αἱρετὸν τῶν <καὶ> καθ᾽ αὑτὰ καὶ δι᾽ αὐτὸ αἱρετῶν, καὶ ἁπλῶς δὴ τέλειον τὸ καθ᾽ αὑτὸ αἱρετὸν ἀεὶ καὶ μηδέποτε δι᾽ ἄλλο.","textHash":"49ebe200b00e"},{"id":"EN.I.7.c","chapter":7,"bekker":"1097a34","words":85,"esOnly":"Tal parece ser eminentemente la felicidad, pues la elegimos siempre por ella misma y nunca por otra cosa, mientras que los honores, el placer, el entendimiento y toda virtud los deseamos elegimos ciertamente por sí mismos, pero también los deseamos elegimos en vista de la felicidad, pues creemos que seremos felices por medio de ellos. En cambio, nadie busca elige la felicidad por estas cosas, ni en general por ninguna otra.","glosses":["εὐδαιμονία","αἱρούμεθα","νοῦν","αἱρούμεθα"],"greekParallel":"τοιοῦτον δ᾽ ἡ εὐδαιμονία μάλιστ᾽ εἶναι δοκεῖ· 1097b [1] Ταύτην γὰρ αἱρούμεθα ἀεὶ δι᾽ αὐτὴν καὶ οὐδέποτε δι᾽ ἄλλο, τιμὴν δὲ καὶ ἡδονὴν καὶ νοῦν καὶ πᾶσαν ἀρετὴν αἱρούμεθα μὲν καὶ δι᾽ αὐτά (μηθενὸς γὰρ ἀποβαίνοντος ἑλοίμεθ᾽ (también proviene de αἱρέω) ἂν ἕκαστον αὐτῶν), αἱρούμεθα δὲ καὶ τῆς εὐδαιμονίας χάριν, [5] διὰ τούτων ὑπολαμβάνοντες εὐδαιμονήσειν. τὴν δ᾽ εὐδαιμονίαν οὐδεὶς αἱρεῖται τούτων χάριν, οὐδ᾽ ὅλως δι᾽ ἄλλο.","textHash":"4195f63139c6"},{"id":"EN.I.7.d","chapter":7,"bekker":"1097b7","words":109,"esOnly":"Parece que también ocurre lo mismo con la autarquía, pues el bien perfecto parece ser autosuficiente. Pero no entendemos por autosuficiencia el vivir para sí sólo una vida solitaria, sino también para los padres y los hijos y la mujer, y en general para los amigos y conciudadanos, puesto que el hombre es por naturaleza una realidad social. No obstante, hay que tomar esto dentro de ciertos límites, pues extendiéndolo a los padres y a los descendientes y a los amigos de los amigos, se iría hasta el infinito. Esta cuestión la examinaremos después.","glosses":["τέλειον ἀγαθὸν αὔταρκες εἶναι δοκεῖ","λέγομεν","βίον μονώτην","φύσει πολιτικὸν ὁ ἄνθρωπος","εἰς ἄπειρον πρόεισιν"],"greekParallel":"φαίνεται δὲ καὶ ἐκ τῆς αὐταρκείας τὸ αὐτὸ συμβαίνειν· τὸ γὰρ τέλειον ἀγαθὸν αὔταρκες εἶναι δοκεῖ. τὸ δ᾽ αὔταρκες λέγομεν οὐκ αὐτῷ μόνῳ, τῷ ζῶντι βίον μονώτην, ἀλλὰ καὶ γονεῦσι [10] καὶ τέκνοις καὶ γυναικὶ καὶ ὅλως τοῖς φίλοις καὶ πολίταις, ἐπειδὴ φύσει πολιτικὸν ὁ ἄνθρωπος. τούτων δὲ ληπτέος ὅρος τις· ἐπεκτείνοντι γὰρ ἐπὶ τοὺς γονεῖς καὶ τοὺς ἀπογόνους καὶ τῶν φίλων τοὺς φίλους εἰς ἄπειρον πρόεισιν. ἀλλὰ τοῦτο μὲν εἰσαῦθις ἐπισκεπτέον·","textHash":"55eecbb619fd"},{"id":"EN.I.7.e","chapter":7,"bekker":"1097b14","words":112,"esOnly":"Estimemos autosuficiente lo que por sí solo hace deseable digna de elección la vida y no necesita nada; y pensamos que tal es la felicidad. Es lo más deseable digno de elección de todo, aun sin añadirle nada; porque es evidente que resultaría más deseable digno de elección si se le añade pudiera añadir el más pequeño de los bienes, pues lo agregado resultaría una superabundancia de bienes, y entre los bienes, el mayor es siempre más deseable digno de elección. Parece, pues, que la felicidad es algo perfecto y autosuficiente, ya que es el fin de los actos.","glosses":["τίθεμεν","αἱρετὸν ποιεῖ τὸν βίον","ἐνδεᾶ","οἰόμεθα","αἱρετωτάτην","μεῖζον","τέλειον καὶ αὔταρκες","πρακτῶν"],"greekParallel":"τὸ δ᾽ αὔταρκες τίθεμεν ὃ μονούμενον [15] αἱρετὸν ποιεῖ τὸν βίον καὶ μηδενὸς ἐνδεᾶ· τοιοῦτον δὲ τὴν εὐδαιμονίαν οἰόμεθα εἶναι· ἔτι δὲ πάντων αἱρετωτάτην μὴ συναριθμουμένην--συναριθμουμένην δὲ δῆλον ὡς αἱρετωτέραν μετὰ τοῦ ἐλαχίστου τῶν ἀγαθῶν· ὑπεροχὴ γὰρ ἀγαθῶν γίνεται τὸ προστιθέμενον, ἀγαθῶν δὲ τὸ μεῖζον αἱρετώτερον ἀεί. [20] τέλειον δή τι φαίνεται καὶ αὔταρκες ἡ εὐδαιμονία, τῶν πρακτῶν οὖσα τέλος.","textHash":"cfdc16c53d8b"},{"id":"EN.I.7.f","chapter":7,"bekker":"1097b22","words":104,"esOnly":"Pero tal vez parece cierto y reconocido que la felicidad es lo mejor, y, sin embargo, sería deseable mostrar con mayor claridad qué es. Acaso se lograría esto si se comprendiera la función del hombre. En efecto, del mismo modo que en el caso de un flautista, de un escultor y de todo artífice, y en general de los que hacen alguna obra o actividad, parece que lo bueno y el bien están en la función, así parecerá también en el caso del hombre si hay alguna función que le sea propia.","glosses":["ἄριστον","τί ἐστιν","ἔργον","τεχνίτῃ","ἔργον καὶ πρᾶξις","τἀγαθὸν καὶ τὸ εὖ"],"greekParallel":"Ἀλλ᾽ ἴσως τὴν μὲν εὐδαιμονίαν τὸ ἄριστον λέγειν ὁμολογούμενόν τι φαίνεται, ποθεῖται δ᾽ ἐναργέστερον τί ἐστιν ἔτι λεχθῆναι. τάχα δὴ γένοιτ᾽ ἂν τοῦτ᾽, εἰ ληφθείη τὸ ἔργον [25] τοῦ ἀνθρώπου. ὥσπερ γὰρ αὐλητῇ καὶ ἀγαλματοποιῷ καὶ παντὶ τεχνίτῃ, καὶ ὅλως ὧν ἔστιν ἔργον τι καὶ πρᾶξις, ἐν τῷ ἔργῳ δοκεῖ τἀγαθὸν εἶναι καὶ τὸ εὖ, οὕτω δόξειεν ἂν καὶ ἀνθρώπῳ, εἴπερ ἔστι τι ἔργον αὐτοῦ.","textHash":"8d9377b0c1a6"},{"id":"EN.I.7.g","chapter":7,"bekker":"1097b29","words":175,"esOnly":"¿Habrá algunas obras y actividades propias del carpintero y del zapatero, pero ninguna del hombre, sino que será éste naturalmente inactivo? O bien, así como parece que hay alguna función propia del ojo y de la mano y del pie, y en general de cada uno de los miembros, ¿se atribuirá al hombre alguna función aparte de éstas? ¿Y cuál será ésta finalmente? Porque el vivir parece también común a las plantas, y se busca lo propio. Hay que dejar de lado, por tanto, la vida de nutrición y crecimiento. Vendría después la sensitiva, pero parece que también ésta es común al caballo, al buey y a todo animal. Queda, por último, cierta vida activa propia del ente que tiene razón; y éste, por una parte, obedece a la razón; por otra parte, la posee y piensa. Y como esta actividad se dice de dos maneras, hay que tomarla en acto, pues parece que se dice primariamente ésta.","glosses":["ἔργα καὶ πράξεις","ἀργὸν πέφυκεν","ζῆν","τὸ ἴδιον","αἰσθητική","ζῴῳ","πρακτική","ἐπιπειθὲς","ἔχον καὶ διανοούμενον","κατ᾽ ἐνέργειαν"],"greekParallel":"πότερον οὖν τέκτονος μὲν καὶ σκυτέως ἔστιν ἔργα τινὰ καὶ πράξεις, ἀνθρώπου δ᾽ [30] οὐδέν ἐστιν, ἀλλ᾽ ἀργὸν πέφυκεν; ἢ καθάπερ ὀφθαλμοῦ καὶ χειρὸς καὶ ποδὸς καὶ ὅλως ἑκάστου τῶν μορίων φαίνεταί τι ἔργον, οὕτω καὶ ἀνθρώπου παρὰ πάντα ταῦτα θείη τις ἂν ἔργον τι; τί οὖν δὴ τοῦτ᾽ ἂν εἴη ποτέ; τὸ μὲν γὰρ ζῆν κοινὸν εἶναι φαίνεται καὶ τοῖς φυτοῖς, ζητεῖται δὲ τὸ ἴδιον. 1098a [1] ἀφοριστέον ἄρα τήν τε θρεπτικὴν καὶ τὴν αὐξητικὴν ζωήν. ἑπομένη δὲ αἰσθητική τις ἂν εἴη, φαίνεται δὲ καὶ αὐτὴ κοινὴ καὶ ἵππῳ καὶ βοῒ καὶ παντὶ ζῴῳ. λείπεται δὴ πρακτική τις τοῦ λόγον ἔχοντος· τούτου δὲ τὸ μὲν ὡς ἐπιπειθὲς λόγῳ, τὸ δ᾽ ὡς [5] ἔχον καὶ διανοούμενον. διττῶς δὲ καὶ ταύτης λεγομένης τὴν κατ᾽ ἐνέργειαν θετέον· κυριώτερον γὰρ αὕτη δοκεῖ λέγεσθαι.","textHash":"c44d6b3b84ec"},{"id":"EN.I.7.h","chapter":7,"bekker":"1098a7","words":214,"esOnly":"Y si la función propia del hombre es una actividad del alma según la razón o no desprovista de razón, y por otra parte decimos que esta función es especificamente propia del hombre y del hombre bueno, como el tocar la cítara es propio de un citarista y de un buen citarista, y así en todas las cosas, añadiéndose a la obra la excelencia de la virtud, siendo esto así, decimos que la función del hombre es una cierta vida, y ésta una actividad del alma y acciones razonables, y la del hombre bueno estas mismas cosas bien y primorosamente, y cada una se realiza bien según la virtud adecuada, y, si esto es así, el bien humano es una actividad del alma conforme a la virtud, y si las virtudes son varias, conforme a la mejor y más perfecta, y además en una vida entera. Porque una golondrina no hace verano, ni un solo día, y así tampoco hace venturoso y feliz un solo día o un poco tiempo.","glosses":["ψυχῆς ἐνέργεια κατὰ λόγον","σπουδαίου","ἔργον","ἀρετὴν","ζωήν τινα","ψυχῆς ἐνέργειαν","πράξεις μετὰ λόγου","σπουδαίου","εὖ καὶ καλῶς","οἰκείαν ἀρετὴν","ψυχῆς ἐνέργεια κατ᾽ ἀρετήν","ἀρίστην καὶ τελειοτάτην","ἐν βίῳ τελείῳ"],"greekParallel":"εἰ δ᾽ ἐστὶν ἔργον ἀνθρώπου ψυχῆς ἐνέργεια κατὰ λόγον ἢ μὴ ἄνευ λόγου, τὸ δ᾽ αὐτό φαμεν ἔργον εἶναι τῷ γένει τοῦδε καὶ τοῦδε σπουδαίου, ὥσπερ κιθαριστοῦ καὶ σπουδαίου [10] κιθαριστοῦ, καὶ ἁπλῶς δὴ τοῦτ᾽ ἐπὶ πάντων, προστιθεμένης τῆς κατὰ τὴν ἀρετὴν ὑπεροχῆς πρὸς τὸ ἔργον· κιθαριστοῦ μὲν γὰρ κιθαρίζειν, σπουδαίου δὲ τὸ εὖ· εἰ δ᾽ οὕτως, [ἀνθρώπου δὲ τίθεμεν ἔργον ζωήν τινα, ταύτην δὲ ψυχῆς ἐνέργειαν καὶ πράξεις μετὰ λόγου, σπουδαίου δ᾽ ἀνδρὸς εὖ ταῦτα καὶ [15] καλῶς, ἕκαστον δ᾽ εὖ κατὰ τὴν οἰκείαν ἀρετὴν ἀποτελεῖται· εἰ δ᾽ οὕτω,] τὸ ἀνθρώπινον ἀγαθὸν ψυχῆς ἐνέργεια γίνεται κατ᾽ ἀρετήν, εἰ δὲ πλείους αἱ ἀρεταί, κατὰ τὴν ἀρίστην καὶ τελειοτάτην. Ἔτι δ᾽ ἐν βίῳ τελείῳ. μία γὰρ χελιδὼν ἔαρ οὐ ποιεῖ, οὐδὲ μία ἡμέρα· οὕτω δὲ οὐδὲ μακάριον καὶ εὐδαίμονα [20] μία ἡμέρα οὐδ᾽ ὀλίγος χρόνος.","textHash":"c309999b877e"},{"id":"EN.I.7.i","chapter":7,"bekker":"1098a21","words":70,"esOnly":"Quede, pues, descrito de esta manera el bien, ya que acaso se debe hacer su bosquejo general antes de describirlo detalladamente. Parece, incluso, que cualquiera podría continuar y articular completamente lo que está bien bosquejado, y que el tiempo es en estas cosas buen inventor o colaborador. De ahí han surgido también los progresos de las artes, pues cualquiera puede añadir lo que falta.","glosses":["ὑποτυπῶσαι","προαγαγεῖν","τὰ καλῶς ἔχοντα","συνεργὸς"],"greekParallel":"Περιγεγράφθω μὲν οὖν τἀγαθὸν ταύτῃ· δεῖ γὰρ ἴσως ὑποτυπῶσαι πρῶτον, εἶθ᾽ ὕστερον ἀναγράψαι. δόξειε δ᾽ ἂν παντὸς εἶναι προαγαγεῖν καὶ διαρθρῶσαι τὰ καλῶς ἔχοντα τῇ περιγραφῇ, καὶ ὁ χρόνος τῶν τοιούτων εὑρετὴς ἢ συνεργὸς ἀγαθὸς εἶναι· ὅθεν καὶ τῶν τεχνῶν [25] γεγόνασιν αἱ ἐπιδόσεις· παντὸς γὰρ προσθεῖναι τὸ ἐλλεῖπον.","textHash":"e445d90e6023"},{"id":"EN.I.7.j","chapter":7,"bekker":"1098a26","words":109,"esOnly":"Pero es menester también recordar lo que llevamos dicho, y no buscar el rigor del mismo modo en todas las cuestiones, sino en cada una según la materia propuesta y en la medida propia de aquella investigación. En efecto, el carpintero y el geómetra buscan de distinta manera el ángulo recto: el uno en la medida en que es útil para su obra; el otro busca qué es o qué propiedades tiene, pues es contemplador de la verdad. Lo mismo se ha de hacer en las demás cosas para que lo accesorio no exceda de las obras mismas.","glosses":["ἀκρίβειαν","ἐπιζητεῖν","ὑποκειμένην ὕλην","μεθόδῳ","χρησίμη","ἔργον","τί ἐστιν","ποῖόν τι"],"greekParallel":"μεμνῆσθαι δὲ καὶ τῶν προειρημένων χρή, καὶ τὴν ἀκρίβειαν μὴ ὁμοίως ἐν ἅπασιν ἐπιζητεῖν, ἀλλ᾽ ἐν ἑκάστοις κατὰ τὴν ὑποκειμένην ὕλην καὶ ἐπὶ τοσοῦτον ἐφ᾽ ὅσον οἰκεῖον τῇ μεθόδῳ. καὶ γὰρ τέκτων καὶ γεωμέτρης διαφερόντως [30] ἐπιζητοῦσι τὴν ὀρθήν· ὃ μὲν γὰρ ἐφ᾽ ὅσον χρησίμη πρὸς τὸ ἔργον, ὃ δὲ τί ἐστιν ἢ ποῖόν τι· θεατὴς γὰρ τἀληθοῦς. τὸν αὐτὸν δὴ τρόπον καὶ ἐν τοῖς ἄλλοις ποιητέον, ὅπως μὴ τὰ πάρεργα τῶν ἔργων πλείω γίνηται. 1098b [1]","textHash":"420ea5ae2ef7"},{"id":"EN.I.7.k","chapter":7,"bekker":"1098b1","words":129,"esOnly":"Tampoco se ha de exigir la causa por igual en todas las cuestiones: bastará en algunas mostrar claramente el qué, como cuando se trate de los principios, pues el qué es primero y principio. Y de los principios, unos se contemplan por inducción, otros por percepción, otros mediante cierto hábito, y otros de diversas maneras. Por tanto, se ha de procurar ir a su encuentro según la naturaleza de cada uno, y se ha de poner el mayor esmero en definirlos bien, pues tienen gran importancia para lo que sigue. Parece, en efecto, que el principio es más de la mitad del todo, y que por él se aclaran muchas de las cosas que se buscan.","glosses":["αἰτίαν","ἀρχάς","ἀρχῶν","ἐπαγωγῇ","αἰσθήσει","ἐθισμῷ","πεφύκασιν","διορισθῶσι καλῶς","ἀρχή","συμφανῆ γίνεσθαι"],"greekParallel":"οὐκ ἀπαιτητέον δ᾽ οὐδὲ τὴν αἰτίαν ἐν ἅπασιν ὁμοίως, ἀλλ᾽ ἱκανὸν ἔν τισι τὸ ὅτι δειχθῆναι καλῶς, οἷον καὶ περὶ τὰς ἀρχάς· τὸ δ᾽ ὅτι πρῶτον καὶ ἀρχή. τῶν ἀρχῶν δ᾽ αἳ μὲν ἐπαγωγῇ θεωροῦνται, αἳ δ᾽ αἰσθήσει, αἳ δ᾽ ἐθισμῷ τινί, καὶ ἄλλαι δ᾽ ἄλλως. μετιέναι [5] δὲ πειρατέον ἑκάστας ᾗ πεφύκασιν, καὶ σπουδαστέον ὅπως διορισθῶσι καλῶς· μεγάλην γὰρ ἔχουσι ῥοπὴν πρὸς τὰ ἑπόμενα. δοκεῖ γὰρ πλεῖον ἢ ἥμισυ τοῦ παντὸς εἶναι ἡ ἀρχή, καὶ πολλὰ συμφανῆ γίνεσθαι δι᾽ αὐτῆς τῶν ζητουμένων.","textHash":"2070968e5066"},{"id":"EN.I.8.a","chapter":8,"bekker":"1098b9","words":51,"esOnly":"Se ha de considerar, por tanto, el principio no sólo desde nuestra conclusión y nuestras premisas, sino también de lo que se dice sobre él, pues con lo que es verdad concuerdan todos los datos, pero con lo falso pronto discrepan.","glosses":["περὶ αὐτῆς: ἀρχή","λεγομένων περὶ αὐτῆς","συνᾴδει τὰ ὑπάρχοντα","διαφωνεῖ"],"greekParallel":"Σκεπτέον δὲ περὶ αὐτῆς οὐ μόνον ἐκ τοῦ συμπεράσματος [10] καὶ ἐξ ὧν ὁ λόγος, ἀλλὰ καὶ ἐκ τῶν λεγομένων περὶ αὐτῆς· τῷ μὲν γὰρ ἀληθεῖ πάντα συνᾴδει τὰ ὑπάρχοντα, τῷ δὲ ψευδεῖ ταχὺ διαφωνεῖ τἀληθές.","textHash":"343e5ef6cce0"},{"id":"EN.I.8.b","chapter":8,"bekker":"1098b13","words":135,"esOnly":"Divididos, pues, los bienes en tres clases, los llamados exteriores, los del alma y los del cuerpo, decimos que los del alma son los primarios y más propiamente bienes, y las acciones y actividades anímicas las referimos al alma. Esta opinión es antigua, y están de acuerdo con ella los que filosofan, de suerte que probablemente tenemos razón al adoptarla. Es también exacta en cuanto se dice que el fin consiste en ciertas acciones y actividades, y esto ocurre con los bienes del alma y no con los exteriores. Concuerda también con nuestro razonamiento el que el hombre feliz vive bien y obra bien, pues se dice que viene a ser una buena vida y buena conducta.","glosses":["ἐκτὸς","ψυχὴν","σῶμα","κυριώτατα καὶ μάλιστα ἀγαθά","πράξεις","ἐνεργείας","δόξαν","ὀρθῶς","τέλος","συνᾴδει","λόγῳ","εὐδαίμονα","εὐζωία καὶ εὐπραξία"],"greekParallel":"νενεμημένων δὴ τῶν ἀγαθῶν τριχῇ, καὶ τῶν μὲν ἐκτὸς λεγομένων τῶν δὲ περὶ ψυχὴν καὶ σῶμα, τὰ περὶ ψυχὴν κυριώτατα λέγομεν καὶ [15] μάλιστα ἀγαθά, τὰς δὲ πράξεις καὶ τὰς ἐνεργείας τὰς ψυχικὰς περὶ ψυχὴν τίθεμεν. ὥστε καλῶς ἂν λέγοιτο κατά γε ταύτην τὴν δόξαν παλαιὰν οὖσαν καὶ ὁμολογουμένην ὑπὸ τῶν φιλοσοφούντων. ὀρθῶς δὲ καὶ ὅτι πράξεις τινὲς λέγονται καὶ ἐνέργειαι τὸ τέλος· οὕτω γὰρ τῶν περὶ ψυχὴν ἀγαθῶν [20] γίνεται καὶ οὐ τῶν ἐκτός. συνᾴδει δὲ τῷ λόγῳ καὶ τὸ εὖ ζῆν καὶ τὸ εὖ πράττειν τὸν εὐδαίμονα· σχεδὸν γὰρ εὐζωία τις εἴρηται καὶ εὐπραξία.","textHash":"2b333e3e4cff"},{"id":"EN.I.8.c","chapter":8,"bekker":"1098b22","words":117,"esOnly":"Es claro, además, que lo que hemos dicho incluye todos los requisitos de la felicidad. En efecto, a unos les parece que es la virtud, a otros la prudencia, a otros cierta sabiduría, a otros estas mismas cosas o alguna de ellas, acompañadas de placer o no desprovistas de placer; otros incluyen además en ella la prosperidad exterior. De estas opiniones, unas son sostenidas por muchos y antiguos; otras, por unos pocos hombres ilustres, y es razonable suponer que ni unos ni otros se han equivocado en todo por completo, sino que en algún punto o en la mayor parte de ellos han pensado rectamente.","glosses":["ἀρετὴ","φρόνησις","σοφία","ἡδονῆς","ἐκτὸς εὐετηρίαν","ὀλίγοι καὶ ἔνδοξοι ἄνδρες","διαμαρτάνειν","κατορθοῦν"],"greekParallel":"φαίνεται δὲ καὶ τὰ ἐπιζητούμενα τὰ περὶ τὴν εὐδαιμονίαν ἅπανθ᾽ ὑπάρχειν τῷ λεχθέντι. τοῖς μὲν γὰρ ἀρετὴ τοῖς δὲ φρόνησις ἄλλοις δὲ σοφία τις εἶναι δοκεῖ, [25] τοῖς δὲ ταῦτα ἢ τούτων τι μεθ᾽ ἡδονῆς ἢ οὐκ ἄνευ ἡδονῆς· ἕτεροι δὲ καὶ τὴν ἐκτὸς εὐετηρίαν συμπαραλαμβάνουσιν. τούτων δὲ τὰ μὲν πολλοὶ καὶ παλαιοὶ λέγουσιν, τὰ δὲ ὀλίγοι καὶ ἔνδοξοι ἄνδρες· οὐδετέρους δὲ τούτων εὔλογον διαμαρτάνειν τοῖς ὅλοις, ἀλλ᾽ ἕν γέ τι ἢ καὶ τὰ πλεῖστα κατορθοῦν.","textHash":"c210dbc381f6"},{"id":"EN.I.8.d","chapter":8,"bekker":"1098b30","words":121,"esOnly":"Nuestro razonamiento está de acuerdo con los que dicen que la felicidad consiste en la virtud o en una cierta virtud, pues propio de la felicidad es la actividad conforme a [la virtud]. Pero probablemente hay no poca diferencia entre poner el máximo bien en una posesión o un uso, en una disposición habitual o una actividad. Porque la disposición que se posee puede no producir ningún bien, como en el que duerme o está de cualquier otro modo inactivo, mientras que con la actividad esto no es posible, ya que ésta actuará necesariamente y actuará bien.","glosses":["συνῳδός","κατ᾽ αὐτὴν ἐνέργεια","τὸ ἄριστον ὑπολαμβάνειν","κτήσει ἢ χρήσει","ἕξει ἢ ἐνεργείᾳ","ἕξιν ... ὑπάρχουσαν","μηδὲν ἀγαθὸν ἀποτελεῖν","ἐξηργηκότι","ἐνέργειαν","ἀνάγκης","εὖ πράξει"],"greekParallel":"[30] Τοῖς μὲν οὖν λέγουσι τὴν ἀρετὴν ἢ ἀρετήν τινα συνῳδός ἐστιν ὁ λόγος· ταύτης γάρ ἐστιν ἡ κατ᾽ αὐτὴν ἐνέργεια. διαφέρει δὲ ἴσως οὐ μικρὸν ἐν κτήσει ἢ χρήσει τὸ ἄριστον ὑπολαμβάνειν, καὶ ἐν ἕξει ἢ ἐνεργείᾳ. τὴν μὲν γὰρ ἕξιν ἐνδέχεται μηδὲν ἀγαθὸν ἀποτελεῖν ὑπάρχουσαν, 1099a [1] οἷον τῷ καθεύδοντι ἢ καὶ ἄλλως πως ἐξηργηκότι, τὴν δ᾽ ἐνέργειαν οὐχ οἷόν τε· πράξει γὰρ ἐξ ἀνάγκης, καὶ εὖ πράξει.","textHash":"3f9723526ff1"},{"id":"EN.I.8.e","chapter":8,"bekker":"1099a4","words":138,"esOnly":"Del mismo modo que en los juegos olímpicos no son los más hermosos ni los más fuertes los que alcanzan la corona, sino los que compiten, así también las cosas hermosas y buenas que hay en la vida sólo las alcanzan los que actúan certeramente; y la vida de éstos es agradable por sí misma. Porque el deleitarse es algo anímico, y para cada uno placentero es de lo que se dice aficionado, como el caballo para el aficionado a caballos, el espectáculo para el aficionado a espectáculos, y del mismo modo también las cosas justas para el que ama la justicia, y en general las cosas conformes a la virtud para el que ama la virtud.","glosses":["οἱ κάλλιστοι καὶ ἰσχυρότατοι","στεφανοῦνται","pues entre éstos algunos vencen [νικῶσιν]","οἱ πράττοντες ὀρθῶς","καθ᾽ αὑτὸν ἡδύς","ψυχικῶν","τὰ δίκαια","φιλαρέτῳ"],"greekParallel":"ὥσπερ δ᾽ Ὀλυμπίασιν οὐχ οἱ κάλλιστοι καὶ ἰσχυρότατοι στεφανοῦνται ἀλλ᾽ [5] οἱ ἀγωνιζόμενοι (τούτων γάρ τινες νικῶσιν), οὕτω καὶ τῶν ἐν τῷ βίῳ καλῶν κἀγαθῶν οἱ πράττοντες ὀρθῶς ἐπήβολοι γίνονται. Ἔστι δὲ καὶ ὁ βίος αὐτῶν καθ᾽ αὑτὸν ἡδύς. τὸ μὲν γὰρ ἥδεσθαι τῶν ψυχικῶν, ἑκάστῳ δ᾽ ἐστὶν ἡδὺ πρὸς ὃ λέγεται φιλοτοιοῦτος, οἷον ἵππος μὲν τῷ φιλίππῳ, θέαμα [10] δὲ τῷ φιλοθεώρῳ· τὸν αὐτὸν δὲ τρόπον καὶ τὰ δίκαια τῷ φιλοδικαίῳ καὶ ὅλως τὰ κατ᾽ ἀρετὴν τῷ φιλαρέτῳ.","textHash":"b1b72eeeb409"},{"id":"EN.I.8.f","chapter":8,"bekker":"1099a12","words":170,"esOnly":"Los placeres de la mayoría de los hombres están en pugna porque no lo son por naturaleza, mientras que para los inclinados a las cosas nobles son agradables las cosas que son por naturaleza agradables. Tales son las acciones de acuerdo con la virtud, de suerte que son agradables para ellos y por sí mismas. La vida de éstos, por consiguiente, no necesita en modo alguno del placer como de una especie de añadidura, sino que tiene el placer en sí misma. Es más, ni siquiera es bueno el que no se complace en las buenas acciones, y nadie llamaría justo al que no se complace en la práctica de la justicia, ni libre al que no se goza en las acciones liberales y del mismo modo en todo lo demás. Si esto es así, las acciones de acuerdo con la virtud serán por sí mismas agradables.","glosses":["μὴ φύσει εἶναι","φιλοκάλοις","κατ᾽ ἀρετὴν πράξεις","ἔχει τὴν ἡδονὴν ἐν ἑαυτῷ","καλαῖς πράξεσιν","δικαιοπραγεῖν","ἐλευθερίοις πράξεσιν","κατ᾽ ἀρετὴν πράξεις","καθ᾽ αὑτὰς ἡδεῖαι"],"greekParallel":"τοῖς μὲν οὖν πολλοῖς τὰ ἡδέα μάχεται διὰ τὸ μὴ φύσει τοιαῦτ᾽ εἶναι, τοῖς δὲ φιλοκάλοις ἐστὶν ἡδέα τὰ φύσει ἡδέα· τοιαῦται δ᾽ αἱ κατ᾽ ἀρετὴν πράξεις, ὥστε καὶ τούτοις εἰσὶν ἡδεῖαι καὶ [15] καθ᾽ αὑτάς. οὐδὲν δὴ προσδεῖται τῆς ἡδονῆς ὁ βίος αὐτῶν ὥσπερ περιάπτου τινός, ἀλλ᾽ ἔχει τὴν ἡδονὴν ἐν ἑαυτῷ. πρὸς τοῖς εἰρημένοις γὰρ οὐδ᾽ ἐστὶν ἀγαθὸς ὁ μὴ χαίρων ταῖς καλαῖς πράξεσιν· οὔτε γὰρ δίκαιον οὐθεὶς ἂν εἴποι τὸν μὴ χαίροντα τῷ δικαιοπραγεῖν, οὔτ᾽ ἐλευθέριον τὸν μὴ χαίροντα [20] ταῖς ἐλευθερίοις πράξεσιν· ὁμοίως δὲ καὶ ἐπὶ τῶν ἄλλων. εἰ δ᾽ οὕτω, καθ᾽ αὑτὰς ἂν εἶεν αἱ κατ᾽ ἀρετὴν πράξεις ἡδεῖαι.","textHash":"f8edfa688a30"},{"id":"EN.I.8.g","chapter":8,"bekker":"1099a22","words":122,"esOnly":"Pero, además, son también buenas y nobles, y cada una de ellas en sumo grado, si es que juzga rectamente acerca de ellas el hombre virtuoso; y juzga como ya hemos dicho. Por tanto, lo mejor, lo más noble y lo más agradable es la felicidad y estas cosas no están separadas como en el epigrama de Delos: Lo más noble es lo más justo; lo mejor, la buena salud; lo más agradable por naturaleza, alcanzar lo que se ama. Pues todo ello se da en las mejores actividades; y éstas, o una de ellas, la mejor, decimos que es la felicidad.","glosses":["ἀγαθαί καὶ καλαί","καλῶς κρίνει","σπουδαῖος","ἄριστον","κάλλιστον","ἥδιστον","διώρισται","ὑγιαίνειν","οὗ τις ἐρᾷ … τυχεῖν","ὑπάρχει","ἀρίσταις ἐνεργείαις","ἀρίστην"],"greekParallel":"ἀλλὰ μὴν καὶ ἀγαθαί γε καὶ καλαί, καὶ μάλιστα τούτων ἕκαστον, εἴπερ καλῶς κρίνει περὶ αὐτῶν ὁ σπουδαῖος· κρίνει δ᾽ ὡς εἴπομεν. ἄριστον ἄρα καὶ κάλλιστον καὶ ἥδιστον ἡ [25] εὐδαιμονία, καὶ οὐ διώρισται ταῦτα κατὰ τὸ Δηλιακὸν ἐπίγραμμα· κάλλιστον τὸ δικαιότατον, λῷστον δ᾽ ὑγιαίνειν· ἥδιστον δὲ πέφυχ᾽ οὗ τις ἐρᾷ τὸ τυχεῖν. Ἅπαντα γὰρ ὑπάρχει ταῦτα ταῖς ἀρίσταις ἐνεργείαις· ταύτας [30] δέ, ἢ μίαν τούτων τὴν ἀρίστην, φαμὲν εἶναι τὴν εὐδαιμονίαν.","textHash":"b7e6fa9be616"},{"id":"EN.I.8.h","chapter":8,"bekker":"1099a31","words":140,"esOnly":"Es claro, no obstante, que necesita además de los bienes exteriores, como dijimos; pues es imposible o no es fácil hacer el bien cuando se está desprovisto de recursos. Muchas cosas, en efecto, se hacen, como por medio de instrumentos, mediante los amigos y la riqueza y el poder político; y la falta de algunas cosas empaña la ventura, y así la nobleza de linaje, buenos hijos y belleza: no podría ser feliz del todo aquel cuyo aspecto fuera completamente repulsivo, o mal nacido, o solo y sin hijos, y quizá menos aún aquel cuyos hijos o amigos fueren absolutamente depravados, o, siendo buenos, hubiesen muerto. Por consiguiente, como dijimos, la felicidad parece necesitar también de esta clase de prosperidad, y por eso algunos identifican la buena suerte con la felicidad; pero otros la virtud.","glosses":["καλὰ πράττειν","πολιτικῆς δυνάμεως","εὐτυχίαν"],"greekParallel":"Φαίνεται δ᾽ ὅμως καὶ τῶν ἐκτὸς ἀγαθῶν προσδεομένη, καθάπερ εἴπομεν· ἀδύνατον γὰρ ἢ οὐ ῥᾴδιον τὰ καλὰ πράττειν ἀχορήγητον ὄντα. πολλὰ μὲν γὰρ πράττεται,  1099b [1] καθάπερ δι᾽ ὀργάνων, διὰ φίλων καὶ πλούτου καὶ πολιτικῆς δυνάμεως· ἐνίων δὲ τητώμενοι ῥυπαίνουσι τὸ μακάριον, οἷον εὐγενείας εὐτεκνίας κάλλους· οὐ πάνυ γὰρ εὐδαιμονικὸς ὁ τὴν ἰδέαν παναίσχης ἢ δυσγενὴς ἢ μονώτης καὶ ἄτεκνος, [5] ἔτι δ᾽ ἴσως ἧττον, εἴ τῳ πάγκακοι παῖδες εἶεν ἢ φίλοι, ἢ ἀγαθοὶ ὄντες τεθνᾶσιν. καθάπερ οὖν εἴπομεν, ἔοικε προσδεῖσθαι καὶ τῆς τοιαύτης εὐημερίας· ὅθεν εἰς ταὐτὸ τάττουσιν ἔνιοι τὴν εὐτυχίαν τῇ εὐδαιμονίᾳ, ἕτεροι δὲ τὴν ἀρετήν.","textHash":"159497c705ab"},{"id":"EN.I.9.a","chapter":9,"bekker":"1099b9","words":140,"esOnly":"Por esto se discute también si la felicidad es algo que se aprende, se adquiere por hábito o se logra por algún otro ejercicio; o si sobreviene por algún destino divino o incluso por fortuna. Pues si alguna otra cosa es un don de los dioses a los hombres, es razonable que también lo sea la felicidad, y tanto más cuanto que es la mejor de las cosas humanas. Pero esto sería acaso más propio de otra investigación. Parece, sin embargo, que aun cuando no sea enviada por los dioses sino que sobrevenga mediante la virtud y cierto aprendizaje o ejercicio, se cuenta entre las cosas más divinas; pues el premio y el fin de la virtud es evidentemente lo mejor, algo divino y bienaventurado.","glosses":["μαθητὸν","ἐθιστὸν","θείαν μοῖραν","τύχην","βέλτιστον","θεόπεμπτός","θειοτάτων","ἆθλον καὶ τέλος","ἄριστον","θεῖόν καὶ μακάριον"],"greekParallel":"Ὅθεν καὶ ἀπορεῖται πότερόν ἐστι μαθητὸν ἢ ἐθιστὸν ἢ καὶ [10] ἄλλως πως ἀσκητόν, ἢ κατά τινα θείαν μοῖραν ἢ καὶ διὰ τύχην παραγίνεται. εἰ μὲν οὖν καὶ ἄλλο τί ἐστι θεῶν δώρημα ἀνθρώποις, εὔλογον καὶ τὴν εὐδαιμονίαν θεόσδοτον εἶναι, καὶ μάλιστα τῶν ἀνθρωπίνων ὅσῳ βέλτιστον. ἀλλὰ τοῦτο μὲν ἴσως ἄλλης ἂν εἴη σκέψεως οἰκειότερον, φαίνεται δὲ κἂν εἰ [15] μὴ θεόπεμπτός ἐστιν ἀλλὰ δι᾽ ἀρετὴν καί τινα μάθησιν ἢ ἄσκησιν παραγίνεται, τῶν θειοτάτων εἶναι· τὸ γὰρ τῆς ἀρετῆς ἆθλον καὶ τέλος ἄριστον εἶναι φαίνεται καὶ θεῖόν τι καὶ μακάριον.","textHash":"62d14ba5b543"},{"id":"EN.I.9.b","chapter":9,"bekker":"1099b18","words":188,"esOnly":"Es además común a muchos, ya que lo pueden alcanzar mediante cierto aprendizaje y estudio todos los que no están incapacitados para la virtud. Pero si es mejor ser feliz así que por la fortuna, es razonable que sea de esta manera, ya que las cosas naturales son por naturaleza del modo mejor posible, e igualmente las cosas que proceden de un arte o de cualquier causa y principalmente de la mejor. Por otra parte, sería un gran error dejar a la fortuna lo más grande y noble. También es evidente por nuestra definición lo que buscamos: pues hemos dicho que es una actividad del alma de acuerdo con la virtud. De los demás bienes, unos le son necesarios, los otros son por naturaleza auxiliares y útiles como instrumentos. Además esto también estará de acuerdo con lo que dijimos al comienzo, pues establecimos que el fin de la política es el mejor, y ella pone el mayor cuidado en hacer a los ciudadanos de cierta condición: buenos y agentes de acciones nobles.","glosses":["βέλτιον","κατὰ φύσιν","πέφυκεν","κάλλιστα","ἀρίστην","κάλλιστον","ψυχῆς ἐνέργεια κατ᾽ ἀρετὴν","συνεργὰ","ἄριστον","ἐπιμέλειαν","ἀγαθοὺς","καλῶν"],"greekParallel":"Εἴη δ᾽ ἂν καὶ πολύκοινον· δυνατὸν γὰρ ὑπάρξαι πᾶσι τοῖς μὴ πεπηρωμένοις πρὸς ἀρετὴν διά τινος μαθήσεως [20] καὶ ἐπιμελείας. εἰ δ᾽ ἐστὶν οὕτω βέλτιον ἢ τὸ διὰ τύχην εὐδαιμονεῖν, εὔλογον ἔχειν οὕτως, εἴπερ τὰ κατὰ φύσιν, ὡς οἷόν τε κάλλιστα ἔχειν, οὕτω πέφυκεν, ὁμοίως δὲ καὶ τὰ κατὰ τέχνην καὶ πᾶσαν αἰτίαν, καὶ μάλιστα <τὰ> κατὰ τὴν ἀρίστην. τὸ δὲ μέγιστον καὶ κάλλιστον ἐπιτρέψαι τύχῃ λίαν πλημμελὲς [25] ἂν εἴη. Συμφανὲς δ᾽ ἐστὶ καὶ ἐκ τοῦ λόγου τὸ ζητούμενον· εἴρηται γὰρ ψυχῆς ἐνέργεια κατ᾽ ἀρετὴν ποιά τις. τῶν δὲ λοιπῶν ἀγαθῶν τὰ μὲν ὑπάρχειν ἀναγκαῖον, τὰ δὲ συνεργὰ καὶ χρήσιμα πέφυκεν ὀργανικῶς. ὁμολογούμενα δὲ ταῦτ᾽ ἂν εἴη καὶ τοῖς ἐν ἀρχῇ· τὸ γὰρ τῆς πολιτικῆς [30] τέλος ἄριστον ἐτίθεμεν, αὕτη δὲ πλείστην ἐπιμέλειαν ποιεῖται τοῦ ποιούς τινας καὶ ἀγαθοὺς τοὺς πολίτας ποιῆσαι καὶ πρακτικοὺς τῶν καλῶν.","textHash":"efd37dc492b1"},{"id":"EN.I.9.c","chapter":9,"bekker":"1099b33","words":130,"esOnly":"Tiene sentido, pues, que no llamemos feliz al buey, ni al caballo ni a ningún otro animal, pues ninguno de ellos es capaz de participar de tal actividad. Y por la misma causa, tampoco el niño es feliz: pues por su edad no puede practicar tales cosas, y los así llamados se consideran venturosos en esperanza. Pues la felicidad requiere, como dijimos, una virtud perfecta y una vida entera; pues ocurren muchos cambios y azares de todo género a lo largo de la vida, y es posible que el más próspero caiga a la vejez en grandes calamidades, como se cuenta de Príamo en los poemas troyanos, y nadie estima feliz al que ha sufrido tales azares y ha acabado miserablemente.","glosses":["κοινωνῆσαι τοιαύτης ἐνεργείας","ἐλπίδα","ἀρετῆς τελείας καὶ βίου τελείου"],"greekParallel":"Εἰκότως οὖν οὔτε βοῦν οὔτε ἵππον οὔτε ἄλλο τῶν ζῴων οὐδὲν εὔδαιμον λέγομεν· 1100a [1] οὐδὲν γὰρ αὐτῶν οἷόν τε κοινωνῆσαι τοιαύτης ἐνεργείας. διὰ ταύτην δὲ τὴν αἰτίαν οὐδὲ παῖς εὐδαίμων ἐστίν· οὔπω γὰρ πρακτικὸς τῶν τοιούτων διὰ τὴν ἡλικίαν· οἱ δὲ λεγόμενοι διὰ τὴν ἐλπίδα μακαρίζονται. δεῖ γάρ, ὥσπερ εἴπομεν, καὶ ἀρετῆς τελείας [5] καὶ βίου τελείου. πολλαὶ γὰρ μεταβολαὶ γίνονται καὶ παντοῖαι τύχαι κατὰ τὸν βίον, καὶ ἐνδέχεται τὸν μάλιστ᾽ εὐθηνοῦντα μεγάλαις συμφοραῖς περιπεσεῖν ἐπὶ γήρως, καθάπερ ἐν τοῖς Τρωικοῖς περὶ Πριάμου μυθεύεται· τὸν δὲ τοιαύταις χρησάμενον τύχαις καὶ τελευτήσαντα ἀθλίως οὐδεὶς εὐδαιμονίζει.","textHash":"6ab053b0e8fd"},{"id":"EN.I.10.a","chapter":10,"bekker":"1100a10","words":149,"esOnly":"Entonces, ¿no hemos de considerar feliz a ningún hombre mientras viva, y será menester, como dice Solón, «ver el fin»? Y si hemos de sentar esto, ¿es acaso feliz después de su muerte? ¿No es esto completamente absurdo, sobre todo para nosotros que decimos que la felicidad consiste en cierta actividad? Y si no llamamos feliz al hombre muerto —y tampoco Solón quiere decir eso, sino que en ese momento se podría considerar con seguridad venturoso a un hombre por estar ya exento de los males y de los infortunios—, también eso sería discutible, pues parece que para el hombre muerto existe también un mal y un bien —lo mismo que existen para el que vive, pero no se da cuenta, por ejemplo, honores, deshonras, y prosperidad e infortunio de sus hijos y en general de sus descendientes—.","glosses":["ἕως ἂν ζῇ","ἄτοπον","ἐνέργειάν τινα","ἀσφαλῶς","τιμαὶ","εὐπραξίαι καὶ δυστυχίαι"],"greekParallel":"[10] Πότερον οὖν οὐδ᾽ ἄλλον οὐδένα ἀνθρώπων εὐδαιμονιστέον ἕως ἂν ζῇ, κατὰ Σόλωνα δὲ χρεὼν τέλος ὁρᾶν; εἰ δὲ δὴ καὶ θετέον οὕτως, ἆρά γε καὶ ἔστιν εὐδαίμων τότε ἐπειδὰν ἀποθάνῃ; ἢ τοῦτό γε παντελῶς ἄτοπον, ἄλλως τε καὶ τοῖς λέγουσιν ἡμῖν ἐνέργειάν τινα τὴν εὐδαιμονίαν; εἰ δὲ μὴ λέγομεν [15] τὸν τεθνεῶτα εὐδαίμονα, μηδὲ Σόλων τοῦτο βούλεται, ἀλλ᾽ ὅτι τηνικαῦτα ἄν τις ἀσφαλῶς μακαρίσειεν ἄνθρωπον ὡς ἐκτὸς ἤδη τῶν κακῶν ὄντα καὶ τῶν δυστυχημάτων, ἔχει μὲν καὶ τοῦτ᾽ ἀμφισβήτησίν τινα· δοκεῖ γὰρ εἶναί τι τῷ τεθνεῶτι καὶ κακὸν καὶ ἀγαθόν, εἴπερ καὶ τῷ ζῶντι μὴ [20] αἰσθανομένῳ δέ, οἷον τιμαὶ καὶ ἀτιμίαι καὶ τέκνων καὶ ὅλως ἀπογόνων εὐπραξίαι τε καὶ δυστυχίαι. ἀπορίαν δὲ καὶ ταῦτα παρέχει· τῷ γὰρ μακαρίως βεβιωκότι μέχρι γήρως καὶ τελευτήσαντι κατὰ λόγον ἐνδέχεται πολλὰς μεταβολὰς συμβαίνειν περὶ τοὺς ἐκγόνους, καὶ τοὺς μὲν αὐτῶν [25] ἀγαθοὺς εἶναι καὶ τυχεῖν βίου τοῦ κατ᾽ ἀξίαν, τοὺς δ᾽ ἐξ ἐναντίας· δῆλον δ᾽ ὅτι καὶ τοῖς ἀποστήμασι πρὸς τοὺς γονεῖς παντοδαπῶς ἔχειν αὐτοὺς ἐνδέχεται. ἄτοπον δὴ γίνοιτ᾽ ἄν, εἰ συμμεταβάλλοι καὶ ὁ τεθνεὼς καὶ γίνοιτο ὁτὲ μὲν εὐδαίμων πάλιν δ᾽ ἄθλιος· ἄτοπον δὲ καὶ τὸ μηδὲν μηδ᾽ ἐπί [30] τινα χρόνον συνικνεῖσθαι τὰ τῶν ἐκγόνων τοῖς γονεῦσιν.","textHash":"5523cd1a8510"},{"id":"EN.I.10.b","chapter":10,"bekker":"1100a10","words":118,"esOnly":"Sin embargo, esto también presenta una dificultad, pues al que ha vivido dichosamente hasta la vejez y ha muerto de manera acorde, pueden ocurrirle muchos cambios en sus descendientes, a saber, que unos de ellos sean buenos y les toque en suerte la vida conforme a su valía, y otros al contrario; porque es evidente que al alejarse de sus progenitores les puede ir de todas las maneras posibles. Sería, en verdad, absurdo si con ellos cambiara también el muerto y fuera tan pronto feliz como desgraciado; pero también es absurdo suponer que las cosas de los hijos pueden en algún momento dejar de interesar a los padres.","glosses":["μακαρίως","κατὰ λόγον","κατ᾽ ἀξίαν","συμμεταβάλλοι καὶ ὁ τεθνεὼς","ἄθλιος"],"greekParallel":null,"textHash":"549800441f5b"},{"id":"EN.I.10.c","chapter":10,"bekker":"1100a31","words":190,"esOnly":"Pero volvamos a lo que antes preguntábamos; quizá por aquello se comprenderá también lo que ahora buscamos. Si es menester ver el fin y juzgar entonces venturoso a cada uno no porque lo sea en ese momento, sino porque lo fué antes, ¿cómo no será absurdo que cuando uno es feliz no se reconozca con verdad la felicidad que posee por no querer declarar felices a los que viven, a causa de las mudanzas de las cosas y por entender la felicidad como algo estable, que en modo alguno cambia fácilmente, mientras las vicisitudes de la fortuna giran incesantemente en torno de ellos? Porque es evidente que si seguimos las vicisitudes de la fortuna declararemos al mismo hombre tan pronto feliz como desgraciado, presentando al hombre feliz como un camaleón y sin fundamentos sólidos. Pero en modo alguno se deben seguir las vicisitudes de la fortuna; porque no estriba en ellas el bien ni el mal, aunque la vida humana necesita de ellas, como dijimos; las que determinan la felicidad son las actividades de acuerdo con la virtud, y las contrarias, lo contrario.","glosses":["τὸ τέλος ὁρᾶν","τὰς μεταβολάς","οὐδαμῶς ὀρθόν"],"greekParallel":"Ἀλλ᾽ ἐπανιτέον ἐπὶ τὸ πρότερον ἀπορηθέν· τάχα γὰρ ἂν θεωρηθείη καὶ τὸ νῦν ἐπιζητούμενον ἐξ ἐκείνου. εἰ δὴ τὸ τέλος ὁρᾶν δεῖ καὶ τότε μακαρίζειν ἕκαστον οὐχ ὡς ὄντα μακάριον ἀλλ᾽ ὅτι πρότερον ἦν, πῶς οὐκ ἄτοπον, εἰ ὅτ᾽ ἔστιν εὐδαίμων, [35] μὴ ἀληθεύσεται κατ᾽ αὐτοῦ τὸ ὑπάρχον 1100b [1] διὰ τὸ μὴ βούλεσθαι τοὺς ζῶντας εὐδαιμονίζειν διὰ τὰς μεταβολάς, καὶ διὰ τὸ μόνιμόν τι τὴν εὐδαιμονίαν ὑπειληφέναι καὶ μηδαμῶς εὐμετάβολον, τὰς δὲ τύχας πολλάκις ἀνακυκλεῖσθαι περὶ τοὺς αὐτούς; δῆλον γὰρ ὡς εἰ συνακολουθοίημεν [5] ταῖς τύχαις, τὸν αὐτὸν εὐδαίμονα καὶ πάλιν ἄθλιον ἐροῦμεν πολλάκις, χαμαιλέοντά τινα τὸν εὐδαίμονα ἀποφαίνοντες καὶ σαθρῶς ἱδρυμένον. ἢ τὸ μὲν ταῖς τύχαις ἐπακολουθεῖν οὐδαμῶς ὀρθόν; οὐ γὰρ ἐν ταύταις τὸ εὖ ἢ κακῶς, ἀλλὰ προσδεῖται τούτων ὁ ἀνθρώπινος βίος, καθάπερ εἴπομεν, κύριαι [10] δ᾽ εἰσὶν αἱ κατ᾽ ἀρ
