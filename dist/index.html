ετὴν ἐνέργειαι τῆς εὐδαιμονίας, αἱ δ᾽ ἐναντίαι τοῦ ἐναντίου.","textHash":"79a05932c96a"},{"id":"EN.I.10.d","chapter":10,"bekker":"1100b12","words":73,"esOnly":"Y lo que ahora discutíamos apoya nuestro razonamiento. En ninguna obra humana, en efecto, hay tanta firmeza como en las actividades virtuosas, que parecen más firmes incluso que las ciencias; y las más valiosas de ellas son más firmes, porque en ellas viven sobre todo y con más continuidad los hombres venturosos. Y ésta parece ser la causa de que no se las olvide.","glosses":["τῶν ἀνθρωπίνων ἔργων","ὑπάρχει","βεβαιότης","ἐπιστημῶν","αἱ τιμιώταται","μακαρίους"],"greekParallel":"Μαρτυρεῖ δὲ τῷ λόγῳ καὶ τὸ νῦν διαπορηθέν. περὶ οὐδὲν γὰρ οὕτως ὑπάρχει τῶν ἀνθρωπίνων ἔργων βεβαιότης ὡς περὶ τὰς ἐνεργείας τὰς κατ᾽ ἀρετήν· μονιμώτεραι γὰρ καὶ τῶν ἐπιστημῶν αὗται δοκοῦσιν εἶναι· [15] τούτων δ᾽ αὐτῶν αἱ τιμιώταται μονιμώτεραι διὰ τὸ μάλιστα καὶ συνεχέστατα καταζῆν ἐν αὐταῖς τοὺς μακαρίους· τοῦτο γὰρ ἔοικεν αἰτίῳ τοῦ μὴ γίνεσθαι περὶ αὐτὰς λήθην.","textHash":"1c250a9ef8e3"},{"id":"EN.I.10.e","chapter":10,"bekker":"1100b18","words":75,"esOnly":"Se dará, pues, lo que buscamos en el hombre feliz, y será feliz toda su vida; pues siempre, o más que cualquier otra cosa, hará y contemplará lo que es conforme a la virtud, y en cuanto a las vicisitudes de la fortuna, las sobrellevará de la mejor manera, y moderadamente en todos los respectos el que es «verdaderamente bueno» y «cuadrilátero intachable».","glosses":["διὰ βίου","πράξει καὶ θεωρήσει","τὰ κατ᾽ ἀρετήν","τὰς τύχας","ἀληθῶς ἀγαθὸς"],"greekParallel":"ὑπάρξει δὴ τὸ ζητούμενον τῷ εὐδαίμονι, καὶ ἔσται διὰ βίου τοιοῦτος· ἀεὶ γὰρ ἢ μάλιστα πάντων πράξει καὶ θεωρήσει [20] τὰ κατ᾽ ἀρετήν, καὶ τὰς τύχας οἴσει κάλλιστα καὶ πάντῃ πάντως ἐμμελῶς ὅ γ᾽ ὡς ἀληθῶς ἀγαθὸς καὶ τετράγωνος ἄνευ ψόγου.","textHash":"4b155b39f0ce"},{"id":"EN.I.10.f","chapter":10,"bekker":"1100b22","words":148,"esOnly":"Puesto que muchas cosas suceden por azar y difieren en magnitud y pequeñez, es evidente que los pequeños favores de fortuna —e igualmente sus opuestos— no inclinan el balance de la vida; en cambio los grandes y numerosos, si acontecen favorablemente, harán la vida más bienaventurada —pues estos bienes por naturaleza le suman un realce cosmético, ya que el uso que de ellos hace el hombre virtuoso será siempre noble y excelente —, pero si sobrevienen a la inversa, oprimen y desfiguran la bienaventuranza, pues acarrean pesares y ponen trabas a muchas actividades. Con todo, incluso a través de éstas resplandece lo bello, cuando quiera que alguien sobrelleve con buen talante muchos y grandes infortunios, no por insensibilidad, sino por ser de ilustre linaje y magnánimo.","glosses":["ζωῆς","μεγάλα καὶ πολλὰ","μακαριώτερον τὸν βίον","πέφυκεν","συνεπικοσμεῖν","καλή καὶ σπουδαία","τὸ μακάριον","λύπας","ἐνεργείαις","διαλάμπει τὸ καλόν","ἀτυχίας","γεννάδας καὶ μεγαλόψυχος"],"greekParallel":"Πολλῶν δὲ γινομένων κατὰ τύχην καὶ διαφερόντων μεγέθει καὶ μικρότητι, τὰ μὲν μικρὰ τῶν εὐτυχημάτων, ὁμοίως δὲ καὶ τῶν ἀντικειμένων, δῆλον ὡς οὐ ποιεῖ [25] ῥοπὴν τῆς ζωῆς, τὰ δὲ μεγάλα καὶ πολλὰ γινόμενα μὲν εὖ μακαριώτερον τὸν βίον ποιήσει (καὶ γὰρ αὐτὰ συνεπικοσμεῖν πέφυκεν, καὶ ἡ χρῆσις αὐτῶν καλὴ καὶ σπουδαία γίνεται), ἀνάπαλιν δὲ συμβαίνοντα θλίβει καὶ λυμαίνεται τὸ μακάριον· λύπας τε γὰρ ἐπιφέρει καὶ ἐμποδίζει πολλαῖς [30] ἐνεργείαις. ὅμως δὲ καὶ ἐν τούτοις διαλάμπει τὸ καλόν, ἐπειδὰν φέρῃ τις εὐκόλως πολλὰς καὶ μεγάλας ἀτυχίας, μὴ δι᾽ ἀναλγησίαν, ἀλλὰ γεννάδας ὢν καὶ μεγαλόψυχος.","textHash":"e7b89c9fd5c9"},{"id":"EN.I.10.g","chapter":10,"bekker":"1100b33","words":113,"esOnly":"Y si las actividades son rectoras de la vida, como dijimos, ningún hombre bienaventurado podrá llegar a ser desgraciado, ya que jamás hará lo que es odioso y vil. Pensamos, en efecto, que quien es verdaderamente bueno y prudente sobrelleva con decoro todas las vicisitudes de la fortuna y obra siempre lo más noble a partir de lo disponible, igual que el buen general se sirve del ejército disponible del modo más estratégico posible, y el zapatero hace con los cueros que se le dan el mejor calzado posible, y de la misma manera todos los demás artesanos.","glosses":["ἐνέργειαι κύριαι τῆς ζωῆς","μακαρίων","πράξει","ἀληθῶς ἀγαθὸν καὶ ἔμφρονα","φέρειν","κάλλιστα πράττειν","ποιεῖν","τεχνίτας"],"greekParallel":"Εἰ δ᾽ εἰσὶν αἱ ἐνέργειαι κύριαι τῆς ζωῆς, καθάπερ εἴπομεν, οὐδεὶς ἂν γένοιτο τῶν μακαρίων ἄθλιος· οὐδέποτε [35] γὰρ πράξει τὰ μισητὰ καὶ τὰ φαῦλα. 1101a [1] τὸν γὰρ ὡς ἀληθῶς ἀγαθὸν καὶ ἔμφρονα πάσας οἰόμεθα τὰς τύχας εὐσχημόνως φέρειν καὶ ἐκ τῶν ὑπαρχόντων ἀεὶ τὰ κάλλιστα πράττειν, καθάπερ καὶ στρατηγὸν ἀγαθὸν τῷ παρόντι στρατοπέδῳ χρῆσθαι πολεμικώτατα καὶ σκυτοτόμον ἐκ τῶν δοθέντων [5] σκυτῶν κάλλιστον ὑπόδημα ποιεῖν· τὸν αὐτὸν δὲ τρόπον καὶ τοὺς ἄλλους τεχνίτας ἅπαντας.","textHash":"65d99cefcc28"},{"id":"EN.I.10.h","chapter":10,"bekker":"1101a7","words":94,"esOnly":"Y si esto es así, jamás será desgraciado el hombre feliz, aunque tampoco se le podrá llamar bienaventurado si cae en los infortunios de Príamo. Ni será, desde luego, inestable ni cambiante: no será removido fácilmente de su felicidad, ni siquiera por los reveses que le toquen, sino por otros grandes y numerosos; y después de tales desgracias no volverá a ser feliz en breve, sino, si es que llega a serlo, en un tiempo largo y pleno tras haber alcanzado grandes y nobles logros.","glosses":["ἄθλιος","εὐδαίμων","κινηθήσεται ῥᾳδίως","μεγάλων καὶ πολλῶν","τελείῳ","ἐπήβολος"],"greekParallel":"εἰ δ᾽ οὕτως, ἄθλιος μὲν οὐδέποτε γένοιτ᾽ ἂν ὁ εὐδαίμων, οὐ μὴν μακάριός γε, ἂν Πριαμικαῖς τύχαις περιπέσῃ. Οὐδὲ δὴ ποικίλος γε καὶ εὐμετάβολος· οὔτε γὰρ ἐκ τῆς εὐδαιμονίας κινηθήσεται ῥᾳδίως, [10] οὐδ᾽ ὑπὸ τῶν τυχόντων ἀτυχημάτων ἀλλ᾽ ὑπὸ μεγάλων καὶ πολλῶν, ἔκ τε τῶν τοιούτων οὐκ ἂν γένοιτο πάλιν εὐδαίμων ἐν ὀλίγῳ χρόνῳ, ἀλλ᾽ εἴπερ, ἐν πολλῷ τινὶ καὶ τελείῳ, μεγάλων καὶ καλῶν ἐν αὐτῷ γενόμενος ἐπήβολος.","textHash":"31741a81856a"},{"id":"EN.I.10.i","chapter":10,"bekker":"1101a14","words":114,"esOnly":"¿Qué nos impide, pues, llamar feliz al que actúa conforme a la virtud perfecta y está suficientemente provisto de bienes exteriores, no en un tiempo cualquiera, sino la vida entera? ¿O hay que añadir que ha de vivir de ese modo y acabar su vida de manera análoga? Puesto que lo porvenir nos está oculto, concluímos que la felicidad es fin y completamente perfecta en todos sentidos. Y si esto es así, llamaremos venturosos entre los vivos a aquellos que poseen y poseerán lo que hemos dicho, es decir, venturosos en cuanto hombres. Y sobre estas cosas baste con estas precisiones.","glosses":["κατ᾽ ἀρετὴν τελείαν ἐνεργοῦντα","τέλειον βίον","ἀφανὲς ἡμῖν ἐστίν","τέλος καὶ τέλειον","μακαρίους"],"greekParallel":"Τί οὖν κωλύει λέγειν εὐδαίμονα τὸν κατ᾽ ἀρετὴν τελείαν [15] ἐνεργοῦντα καὶ τοῖς ἐκτὸς ἀγαθοῖς ἱκανῶς κεχορηγημένον μὴ τὸν τυχόντα χρόνον ἀλλὰ τέλειον βίον; ἢ προσθετέον καὶ βιωσόμενον οὕτω καὶ τελευτήσοντα κατὰ λόγον; ἐπειδὴ τὸ μέλλον ἀφανὲς ἡμῖν ἐστίν, τὴν εὐδαιμονίαν δὲ τέλος καὶ τέλειον τίθεμεν πάντῃ πάντως. εἰ δ᾽ οὕτω, μακαρίους ἐροῦμεν [20] τῶν ζώντων οἷς ὑπάρχει καὶ ὑπάρξει τὰ λεχθέντα, μακαρίους δ᾽ ἀνθρώπους. καὶ περὶ μὲν τούτων ἐπὶ τοσοῦτον διωρίσθω.","textHash":"eea6c27ad183"},{"id":"EN.I.11.a","chapter":11,"bekker":"1101a22","words":79,"esOnly":"En cuanto a la buena o mala fortuna de los descendientes y de todos los amigos, el que nada en absoluto afecte a los muertos parece demasiado impío y contrario a las opiniones recibidas. Pero como son muchas y con todo género de diferencias las cosas que suceden, y unas nos interesan más y otras menos, sería largo e interminable explicarlas una por una, y quizá baste tratarlo en general y esquemáticamente.","glosses":["ἄφιλον","μακρὸν καὶ ἀπέραντον","καθόλου καὶ τύπῳ"],"greekParallel":"Τὰς δὲ τῶν ἀπογόνων τύχας καὶ τῶν φίλων ἁπάντων τὸ μὲν μηδοτιοῦν συμβάλλεσθαι λίαν ἄφιλον φαίνεται καὶ ταῖς δόξαις ἐναντίον· πολλῶν δὲ καὶ παντοίας ἐχόντων διαφορὰς [25] τῶν συμβαινόντων, καὶ τῶν μὲν μᾶλλον συνικνουμένων τῶν δ᾽ ἧττον, καθ᾽ ἕκαστον μὲν διαιρεῖν μακρὸν καὶ ἀπέραντον φαίνεται, καθόλου δὲ λεχθὲν καὶ τύπῳ τάχ᾽ ἂν ἱκανῶς ἔχοι.","textHash":"7d1a748e3b9d"},{"id":"EN.I.11.b","chapter":11,"bekker":"1101a28","words":104,"esOnly":"Así, pues, como de los infortunios propios unos tienen peso e importancia para la vida y otros parecen más ligeros, lo mismo ocurre con los de todos los amigos; pero hay entre las desgracias una gran diferencia según ocurran en vida o después de muertos; mucho mayor que la que hay en las tragedias entre los delitos y horrores anteriores y los que acontecen en escena. Se ha de concluir, pues, que existe esta diferencia, o acaso más bien que no se sabe, respecto de los muertos, si participan de algún bien o de los contrarios.","glosses":["παθῶν","παράνομα καὶ δεινὰ","εἴ τινος ἀγαθοῦ κοινωνοῦσιν"],"greekParallel":"εἰ δή, καθάπερ καὶ τῶν περὶ αὑτὸν ἀτυχημάτων τὰ μὲν ἔχει τι βρῖθος καὶ ῥοπὴν πρὸς τὸν βίον τὰ [30] δ᾽ ἐλαφροτέροις ἔοικεν, οὕτω καὶ τὰ περὶ τοὺς φίλους ὁμοίως ἅπαντας, διαφέρει δὲ τῶν παθῶν ἕκαστον περὶ ζῶντας ἢ τελευτήσαντας συμβαίνειν πολὺ μᾶλλον ἢ τὰ παράνομα καὶ δεινὰ προϋπάρχειν ἐν ταῖς τραγῳδίαις ἢ πράττεσθαι, συλλογιστέον δὴ καὶ ταύτην τὴν διαφοράν, μᾶλλον δ᾽ ἴσως [35] τὸ διαπορεῖσθαι περὶ τοὺς κεκμηκότας εἴ τινος ἀγαθοῦ κοινωνοῦσιν ἢ τῶν ἀντικειμένων. 1101b [1]","textHash":"f54de42d45ac"},{"id":"EN.I.11.c","chapter":11,"bekker":"1101b1","words":100,"esOnly":"Parece, pues, según esto, que si algo llega hasta ellos, sea bien o lo contrario, es tenue y poca cosa, ya sea en absoluto o para ellos; y si no, es de tal magnitud e índole que ni puede hacer felices a los que no lo son, ni a los que lo son quitarles la ventura. Parece, pues, que alcanza de algún modo a los muertos la prosperidad de sus amigos, e igualmente sus desgracias, pero de tal modo y en tal medida que ni pueden hacer que los felices no sean felices ni otra cosa semejante.","glosses":["ἁπλῶς ἢ ἐκείνοις"],"greekParallel":"ἔοικε γὰρ ἐκ τούτων εἰ καὶ διικνεῖται πρὸς αὐτοὺς ὁτιοῦν, εἴτ᾽ ἀγαθὸν εἴτε τοὐναντίον, ἀφαυρόν τι καὶ μικρὸν ἢ ἁπλῶς ἢ ἐκείνοις εἶναι, εἰ δὲ μή, τοσοῦτόν γε καὶ τοιοῦτον ὥστε μὴ ποιεῖν εὐδαίμονας τοὺς μὴ ὄντας [5] μηδὲ τοὺς ὄντας ἀφαιρεῖσθαι τὸ μακάριον. συμβάλλεσθαι μὲν οὖν τι φαίνονται τοῖς κεκμηκόσιν αἱ εὐπραξίαι τῶν φίλων, ὁμοίως δὲ καὶ αἱ δυσπραξίαι, τοιαῦτα δὲ καὶ τηλικαῦτα ὥστε μήτε τοὺς εὐδαίμονας μὴ εὐδαίμονας ποιεῖν μήτ᾽ ἄλλο τῶν τοιούτων μηδέν.","textHash":"fb9751b495d8"},{"id":"EN.I.12.a","chapter":12,"bekker":"1101b10","words":30,"esOnly":"Explicado esto, consideremos si la felicidad es una cosa elogiable o, más aún, digna de ser ensalzada; pues es claro que no es una mera facultad.","glosses":["ἐπαινετῶν ἢ τιμίων","δυνάμεων"],"greekParallel":"[10] Διωρισμένων δὲ τούτων ἐπισκεψώμεθα περὶ τῆς εὐδαιμονίας πότερα τῶν ἐπαινετῶν ἐστὶν ἢ μᾶλλον τῶν τιμίων· δῆλον γὰρ ὅτι τῶν γε δυνάμεων οὐκ ἔστιν.","textHash":"03a2a6c6aa3d"},{"id":"EN.I.12.b","chapter":12,"bekker":"1101b13","words":216,"esOnly":"Parece, en efecto, que todo lo elogiable se elogia por ser de cierta índole y por tener cierta referencia a algo; y así elogiamos al justo y al valiente y en general al bueno y a la virtud por sus acciones y sus obras, y al robusto y al ligero y a cada uno de los demás por ser de cierta condición y encontrarse referidos a algo bueno y decente. Esto es también evidente por las alabanzas a los dioses: resulta, en efecto, ridículo que se los ponga en comparación con nosotros, y esto ocurre porque los elogios implican una referencia, como dijimos. Y si el elogio es de esta índole, es claro que de las cosas mejores no hay elogio, sino algo mayor y mejor, como es también notorio: pues a los dioses los ensalzamos como bienaventurados y felices y a los más divinos de los hombres los ensalzamos también como bienaventurados. Y lo mismo respecto de los bienes, porque nadie elogia la felicidad como elogia lo justo, sino que la ensalza como algo más divino y mejor.","glosses":["πρός τι πῶς ἔχειν","δίκαιον καὶ τὸν ἀνδρεῖον","διὰ τὰς πράξεις καὶ τὰ ἔργα","ἔχειν πως","πρὸς ἀγαθόν τι καὶ σπουδαῖον","τοὺς θεοὺς ἐπαίνων","πρὸς ἡμᾶς ἀναφερόμενοι","ἀναφορᾶς","τῶν ἀρίστων","μακαρίζομεν καὶ εὐδαιμονίζομεν","μακαρίζει","θειότερόν καὶ βέλτιον"],"greekParallel":"φαίνεται δὴ πᾶν τὸ ἐπαινετὸν τῷ ποιόν τι εἶναι καὶ πρός τι πῶς ἔχειν ἐπαινεῖσθαι· τὸν γὰρ δίκαιον καὶ τὸν ἀνδρεῖον καὶ ὅλως τὸν [15] ἀγαθόν τε καὶ τὴν ἀρετὴν ἐπαινοῦμεν διὰ τὰς πράξεις καὶ τὰ ἔργα, καὶ τὸν ἰσχυρὸν δὲ καὶ τὸν δρομικὸν καὶ τῶν ἄλλων ἕκαστον τῷ ποιόν τινα πεφυκέναι καὶ ἔχειν πως πρὸς ἀγαθόν τι καὶ σπουδαῖον. δῆλον δὲ τοῦτο καὶ ἐκ τῶν περὶ τοὺς θεοὺς ἐπαίνων· γελοῖοι γὰρ φαίνονται πρὸς ἡμᾶς ἀναφερόμενοι, [20] τοῦτο δὲ συμβαίνει διὰ τὸ γίνεσθαι τοὺς ἐπαίνους δι᾽ ἀναφορᾶς, ὥσπερ εἴπομεν. εἰ δ᾽ ἐστὶν ὁ ἔπαινος τῶν τοιούτων, δῆλον ὅτι τῶν ἀρίστων οὐκ ἔστιν ἔπαινος, ἀλλὰ μεῖζόν τι καὶ βέλτιον, καθάπερ καὶ φαίνεται· τούς τε γὰρ θεοὺς μακαρίζομεν καὶ εὐδαιμονίζομεν καὶ τῶν ἀνδρῶν τοὺς θειοτάτους [25] [μακαρίζομεν]. μοίως δὲ καὶ τῶν ἀγαθῶν· οὐδεὶς γὰρ τὴν εὐδαιμονίαν ἐπαινεῖ καθάπερ τὸ δίκαιον, ἀλλ᾽ ὡς θειότερόν τι καὶ βέλτιον μακαρίζει.","textHash":"c3b560d875a8"},{"id":"EN.I.12.c","chapter":12,"bekker":"1101b28","words":52,"esOnly":"Y parece que Eudoxo reivindicó con razón la supremacía del placer; pensó, en efecto, que el no ser elogiado, siendo un bien, significaba que era mejor que las cosas elogiables, de igual manera que Dios y el bien, pues los demás bienes son elogiados por referencia a estos.","glosses":["πρὸς ταῦτα … ἀναφέρεσθαι"],"greekParallel":"Δοκεῖ δὲ καὶ Εὔδοξος καλῶς συνηγορῆσαι περὶ τῶν ἀριστείων τῇ ἡδονῇ· τὸ γὰρ μὴ ἐπαινεῖσθαι τῶν ἀγαθῶν οὖσαν μηνύειν ᾤετο ὅτι κρεῖττόν ἐστι [30] τῶν ἐπαινετῶν, τοιοῦτον δ᾽ εἶναι τὸν θεὸν καὶ τἀγαθόν· πρὸς ταῦτα γὰρ καὶ τἆλλα ἀναφέρεσθαι.","textHash":"dca8e93ae49f"},{"id":"EN.I.12.d","chapter":12,"bekker":"1101b32","words":110,"esOnly":"Porque el elogio corresponde a la virtud, pues los hombres realizan los hechos nobles por ella; los encomios, a las obras, tanto corporales como anímicas. Pero explicar esto minuciosamente es acaso más propio de los que se dedican a los encomios; para nosotros es evidente, por lo que se ha dicho, que la felicidad es cosa perfecta y digna de ser ensalzada. Parece que es así tembién por ser principio, ya que todos hacemos por ella todas las demás cosas, y el principio y la causa de los bienes lo consideramos algo precioso y divino.","glosses":["ἔπαινος","πρακτικοὶ τῶν καλῶν","ἐγκώμια","δῆλον","τιμίων καὶ τελείων","ἀρχή","αἴτιον","τίμιόν τι καὶ θεῖον"],"greekParallel":"ὁ μὲν γὰρ ἔπαινος τῆς ἀρετῆς· πρακτικοὶ γὰρ τῶν καλῶν ἀπὸ ταύτης· τὰ δ᾽ ἐγκώμια τῶν ἔργων ὁμοίως καὶ τῶν σωματικῶν καὶ τῶν ψυχικῶν. ἀλλὰ ταῦτα μὲν ἴσως οἰκειότερον ἐξακριβοῦν [35] τοῖς περὶ τὰ ἐγκώμια πεπονημένοις· ἡμῖν δὲ δῆλον ἐκ τῶν εἰρημένων 1102a [1] ὅτι ἐστὶν ἡ εὐδαιμονία τῶν τιμίων καὶ τελείων. ἔοικε δ᾽ οὕτως ἔχειν καὶ διὰ τὸ εἶναι ἀρχή· ταύτης γὰρ χάριν τὰ λοιπὰ πάντα πάντες πράττομεν, τὴν ἀρχὴν δὲ καὶ τὸ αἴτιον τῶν ἀγαθῶν τίμιον τι καὶ θεῖον τίθεμεν.","textHash":"ad5c04b7d070"},{"id":"EN.I.13.a","chapter":13,"bekker":"1102a5","words":32,"esOnly":"Puesto que la felicidad es una actividad del alma según la virtud perfecta, hay que tratar de la virtud, pues acaso así consideraremos mejor lo referente a la felicidad.","glosses":["ἐπισκεπτέον","βέλτιον θεωρήσαιμεν"],"greekParallel":"[5] Ἐπεὶ δ᾽ ἐστὶν ἡ εὐδαιμονία ψυχῆς ἐνέργειά τις κατ᾽ ἀρετὴν τελείαν, περὶ ἀρετῆς ἐπισκεπτέον ἂν εἴη· τάχα γὰρ οὕτως ἂν βέλτιον καὶ περὶ τῆς εὐδαιμονίας θεωρήσαιμεν.","textHash":"1c908be0a76f"},{"id":"EN.I.13.b","chapter":13,"bekker":"1102a8","words":78,"esOnly":"Y parece también que el que es de veras político se ocupa sobre todo de ella, pues quiere hacer a los ciudadanos buenos y obedientes a las leyes — como ejemplo de éstos tenemos a los legisladores cretenses y lacedemonios y los demás semejantes que puedan haber existido. Y si esta investigación pertenece a la política, es evidente que esta indagación estará de acuerdo con nuestro proyecto inicial.","glosses":["ἀλήθειαν πολιτικὸς","τῶν νόμων ὑπηκόους","νομοθέτας","σκέψις","ζήτησις","ἀρχῆς προαίρεσιν"],"greekParallel":"δοκεῖ δὲ καὶ ὁ κατ᾽ ἀλήθειαν πολιτικὸς περὶ ταύτην μάλιστα πεπονῆσθαι· βούλεται γὰρ τοὺς πολίτας ἀγαθοὺς ποιεῖν καὶ τῶν [10] νόμων ὑπηκόους. παράδειγμα δὲ τούτων ἔχομεν τοὺς Κρητῶν καὶ Λακεδαιμονίων νομοθέτας, καὶ εἴ τινες ἕτεροι τοιοῦτοι γεγένηνται. εἰ δὲ τῆς πολιτικῆς ἐστὶν ἡ σκέψις αὕτη, δῆλον ὅτι γίνοιτ᾽ ἂν ἡ ζήτησις κατὰ τὴν ἐξ ἀρχῆς προαίρεσιν.","textHash":"b5068b64b344"},{"id":"EN.I.13.c","chapter":13,"bekker":"1102a14","words":159,"esOnly":"Acerca de la virtud es evidente que hemos de investigar la humana, ya que también buscábamos el bien humano y la felicidad humana. Llamamos virtud humana no a la del cuerpo, sino a la del alma; y decimos que la felicidad es una actividad del alma. Y si esto es así, es evidente que el político debe conocer en cierto modo lo referente al alma, como el que cura los ojos también todo el cuerpo, y tanto más cuanto que la política es más estimable y mejor que la medicina; y los médicos distinguidos se ocupan mucho del conocimiento del cuerpo; también el político ha de considerar el alma, pero la ha de considerar en vista de estas cosas y en la medida suficiente para lo que buscamos, pues examinar esta cuestión con más detalle es acaso demasiado laborioso para nuestro propósito.","glosses":["ἐπισκεπτέον","ψυχῆς","εἰδέναι","περὶ ψυχῆς","τιμιωτέρα καὶ βελτίων τῆς ἰατρικῆς","σώματος γνῶσιν","θεωρητέον","τὰ ζητούμενα","ἐξακριβοῦν"],"greekParallel":"περὶ ἀρετῆς δὲ ἐπισκεπτέον ἀνθρωπίνης δῆλον ὅτι· καὶ γὰρ τἀγαθὸν [15] ἀνθρώπινον ἐζητοῦμεν καὶ τὴν εὐδαιμονίαν ἀνθρωπίνην. ἀρετὴν δὲ λέγομεν ἀνθρωπίνην οὐ τὴν τοῦ σώματος ἀλλὰ τὴν τῆς ψυχῆς· καὶ τὴν εὐδαιμονίαν δὲ ψυχῆς ἐνέργειαν λέγομεν. εἰ δὲ ταῦθ᾽ οὕτως ἔχει, δῆλον ὅτι δεῖ τὸν πολιτικὸν εἰδέναι πως τὰ περὶ ψυχῆς, ὥσπερ καὶ τὸν ὀφθαλμοὺς θεραπεύσοντα [20] καὶ πᾶν <τὸ> σῶμα, καὶ μᾶλλον ὅσῳ τιμιωτέρα καὶ βελτίων ἡ πολιτικὴ τῆς ἰατρικῆς· τῶν δ᾽ ἰατρῶν οἱ χαρίεντες πολλὰ πραγματεύονται περὶ τὴν τοῦ σώματος γνῶσιν. θεωρητέον δὴ καὶ τῷ πολιτικῷ περὶ ψυχῆς, θεωρητέον δὲ τούτων χάριν, καὶ ἐφ᾽ ὅσον ἱκανῶς ἔχει πρὸς τὰ ζητούμενα· [25] τὸ γὰρ ἐπὶ πλεῖον ἐξακριβοῦν ἐργωδέστερον ἴσως ἐστὶ τῶν προκειμένων.","textHash":"2f1cdcb1b4c1"},{"id":"EN.I.13.d","chapter":13,"bekker":"1102a26","words":143,"esOnly":"Además en los tratados exotéricos se estudian suficientemente algunos puntos acerca del alma, y hay que servirse de ellos; por ejemplo, que una parte de ella es irracional y la otra tiene razón — si éstas se distinguen como las partes del cuerpo y todo lo divisible, o son dos para la razón, pero naturalmente inseparables como en la circunferencia lo convexo y lo cóncavo, nada importa para la presente cuestión. Del elemento irracional una parte parece común: la vegetativa; quiero decir la causa de la nutrición y el crecimiento; pues esta facultad del alma puede admitirse en todos los seres que se nutren, siendo la misma tanto en los embriones, como también en los organismos perfectos, pues es más razonable que admitir alguna otra.","glosses":["ἐξωτερικοῖς λόγοις","χρηστέον αὐτοῖς","ἄλογον","λόγον ἔχον","σώματος μόρια","τῷ λόγῳ","κοινῷ","φυτικῷ","αἴτιον","δύναμιν τῆς ψυχῆς"],"greekParallel":"Λέγεται δὲ περὶ αὐτῆς καὶ ἐν τοῖς ἐξωτερικοῖς λόγοις ἀρκούντως ἔνια, καὶ χρηστέον αὐτοῖς· οἷον τὸ μὲν ἄλογον αὐτῆς εἶναι, τὸ δὲ λόγον ἔχον. ταῦτα δὲ πότερον διώρισται καθάπερ τὰ τοῦ σώματος μόρια καὶ πᾶν τὸ [30] μεριστόν, ἢ τῷ λόγῳ δύο ἐστὶν ἀχώριστα πεφυκότα καθάπερ ἐν τῇ περιφερείᾳ τὸ κυρτὸν καὶ τὸ κοῖλον, οὐθὲν διαφέρει πρὸς τὸ παρόν. Τοῦ ἀλόγου δὲ τὸ μὲν ἔοικε κοινῷ καὶ φυτικῷ, λέγω δὲ τὸ αἴτιον τοῦ τρέφεσθαι καὶ αὔξεσθαι· τὴν τοιαύτην γὰρ δύναμιν τῆς ψυχῆς ἐν ἅπασι τοῖς τρεφομένοις θείη τις ἂν 1102b [1] καὶ ἐν τοῖς ἐμβρύοις, τὴν αὐτὴν δὲ ταύτην καὶ ἐν τοῖς τελείοις· εὐλογώτερον γὰρ ἢ ἄλλην τινά.","textHash":"038c2968ba0a"},{"id":"EN.I.13.e","chapter":13,"bekker":"1102b3","words":144,"esOnly":"Es claro, pues, que su virtud es común y no humana, parece, en efecto, que en los sueños actúa principalmente esta parte y esta facultad, y el hombre bueno y el malo se confunden enteramente en el sueño — por eso dicen que en la mitad de la vida en nada se diferencian los felices de los desgraciados. Es normal que así ocurra, pues el sueño es una inactividad del alma en cuanto no corresponde decir que es buena o mala, excepto si de algún modo penetran en el alma un poco algunos movimientos y resultan así mejores los sueños de los hombres superiores que los de un cualquiera. Pero sobre estas cosas basta, y dejemos también la parte nutritiva, puesto que es naturalmente ajena a la virtud humana.","glosses":["ἐνεργεῖν μάλιστα","ἀργία","σπουδαία καὶ φαύλη","κινήσεων","φαντάσματα","τῶν ἐπιεικῶν","τὸ θρεπτικὸν","ἀνθρωπικῆς ἀρετῆς ἄμοιρον"],"greekParallel":"ταύτης μὲν οὖν κοινή τις ἀρετὴ καὶ οὐκ ἀνθρωπίνη φαίνεται· δοκεῖ γὰρ ἐν τοῖς ὕπνοις ἐνεργεῖν μάλιστα τὸ μόριον τοῦτο καὶ [5] ἡ δύναμις αὕτη, ὁ δ᾽ ἀγαθὸς καὶ κακὸς ἥκιστα διάδηλοι καθ᾽ ὕπνον (ὅθεν φασὶν οὐδὲν διαφέρειν τὸ ἥμισυ τοῦ βίου τοὺς εὐδαίμονας τῶν ἀθλίων· συμβαίνει δὲ τοῦτο εἰκότως· ἀργία γάρ ἐστιν ὁ ὕπνος τῆς ψυχῆς ᾗ λέγεται σπουδαία καὶ φαύλη), πλὴν εἰ μὴ κατὰ μικρὸν καὶ διικνοῦνταί τινες τῶν κινήσεων, [10] καὶ ταύτῃ βελτίω γίνεται τὰ φαντάσματα τῶν ἐπιεικῶν ἢ τῶν τυχόντων. ἀλλὰ περὶ μὲν τούτων ἅλις, καὶ τὸ θρεπτικὸν ἐατέον, ἐπειδὴ τῆς ἀνθρωπικῆς ἀρετῆς ἄμοιρον πέφυκεν.","textHash":"65e19fb1b7f0"},{"id":"EN.I.13.f","chapter":13,"bekker":"1102b13","words":227,"esOnly":"Pero parece que hay además otro elemento natural, irracional, en el alma, que participa, sin embargo, de la razón en cierto modo. Pues tanto en el continente como en el incontinente elogiamos la razón y la parte del alma que tiene razón —porque rectamente exhorta también a lo mejor —, pero también aparece en ellos otro elemento natural, ajeno a la razón, que lucha y se tensa contra ella. Exactamente como los miembros paralíticos del cuerpo cuando queremos moverlos hacia la derecha se van al contrario hacia la izquierda, y así ocurre también con el alma: pues los impulsos de los incontinentes se mueven en sentido contrario. Pero en los cuerpos vemos lo que se desvía, en el alma no lo vemos; hemos de creer no obstante que en el alma hay algo ajeno a la razón que se le opone y le hace resistencia — en qué sentido es distinto, no hace ninguna diferencia. Pero parece que también participa de la razón, como dijimos. Al menos obedece a la razón en el hombre continente, y además es probablemente más dócil en el hombre morigerado y esforzado, pues en estos casos la concordancia [de dicho elemento] con la razón es total.","glosses":["φύσις","ἐγκρατοῦς καὶ ἀκρατοῦς","ἐπαινοῦμεν","λόγον ἔχον","τὰ βέλτιστα","ἄλλο τι","μάχεται καὶ ἀντιτείνει","προαιρουμένων κινῆσαι","ὁρμαὶ τῶν ἀκρατῶν","ὁρῶμεν","νομιστέον","ἀντιβαῖνον","ἕτερον","λόγου μετέχειν","σώφρονος","ἀνδρείου"],"greekParallel":"Ἔοικε δὲ καὶ ἄλλη τις φύσις τῆς ψυχῆς ἄλογος εἶναι, μετέχουσα μέντοι πῃ λόγου. τοῦ γὰρ ἐγκρατοῦς καὶ ἀκρατοῦς τὸν [15] λόγον καὶ τῆς ψυχῆς τὸ λόγον ἔχον ἐπαινοῦμεν· ὀρθῶς γὰρ καὶ ἐπὶ τὰ βέλτιστα παρακαλεῖ· φαίνεται δ᾽ ἐν αὐτοῖς καὶ ἄλλο τι παρὰ τὸν λόγον πεφυκός, ὃ μάχεται καὶ ἀντιτείνει τῷ λόγῳ. ἀτεχνῶς γὰρ καθάπερ τὰ παραλελυμένα τοῦ σώματος μόρια εἰς τὰ δεξιὰ προαιρουμένων κινῆσαι [20] τοὐναντίον εἰς τὰ ἀριστερὰ παραφέρεται, καὶ ἐπὶ τῆς ψυχῆς οὕτως· ἐπὶ τἀναντία γὰρ αἱ ὁρμαὶ τῶν ἀκρατῶν. ἀλλ᾽ ἐν τοῖς σώμασι μὲν ὁρῶμεν τὸ παραφερόμενον, ἐπὶ δὲ τῆς ψυχῆς οὐχ ὁρῶμεν. ἴσως δ᾽ οὐδὲν ἧττον καὶ ἐν τῇ ψυχῇ νομιστέον εἶναί τι παρὰ τὸν λόγον, ἐναντιούμενον τούτῳ καὶ ἀντιβαῖνον. [25] πῶς δ᾽ ἕτερον, οὐδὲν διαφέρει. λόγου δὲ καὶ τοῦτο φαίνεται μετέχειν, ὥσπερ εἴπομεν· πειθαρχεῖ γοῦν τῷ λόγῳ τὸ τοῦ ἐγκρατοῦς --ἔτι δ᾽ ἴσως εὐηκοώτερόν ἐστι τὸ τοῦ σώφρονος καὶ ἀνδρείου· πάντα γὰρ ὁμοφωνεῖ τῷ λόγῳ.\nΦαίνεται δὴ καὶ τὸ ἄλογον διττόν. τὸ μὲν γὰρ φυτικὸν οὐδαμῶς κοινωνεῖ [30] λόγου, τὸ δ᾽ ἐπιθυμητικὸν καὶ ὅλως ὀρεκτικὸν μετέχει πως, ᾗ κατήκοόν ἐστιν αὐτοῦ καὶ πειθαρχικόν· οὕτω δὴ καὶ τοῦ πατρὸς καὶ τῶν φίλων φαμὲν ἔχειν λόγον, καὶ οὐχὥσπερ τῶν μαθηματικῶν. ὅτι δὲ πε // normalize.js — capa de normalizacion. Se usa SOLO para indexar/buscar.

const GREEK_CHAR = /[\u0370-\u03FF\u1F00-\u1FFF]/;

const hasGreek = (s) => GREEK_CHAR.test(s);

function greekRatio(s) {
  const letters = [...s].filter((c) => /\p{L}/u.test(c));
  if (!letters.length) return 0;
  return letters.filter((c) => GREEK_CHAR.test(c)).length / letters.length;
}

// sufijos castellanos, de mas largo a mas corto
const ES_SUF = [
  'amientos','imientos','amiento','imiento','aciones','iciones','adoras','adores',
  'ancias','encias','ismos','istas','ables','ibles','anzas','icos','icas','ismo',
  'able','ible','ista','osos','osas','ivos','ivas','anza','icar','izar','ando',
  'iendo','arse','erse','irse','ador','idad','ivo','iva','oso','osa','ico','ica',
  'ion','dad','mente','ar','er','ir','os','as','es','a','o','e','s',
];

function esNormalize(s) {
  return s
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')   // quita tildes latinas
    .normalize('NFC')
    .toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function esStem(w) {
  if (w.length <= 4) return w;
  for (const suf of ES_SUF) {
    if (w.endsWith(suf) && w.length - suf.length >= 4) return w.slice(0, -suf.length);
  }
  return w;
}

function esTokens(text) {
  return esNormalize(text)
    .split(' ')
    .filter((w) => w && w.length > 2 && !ES_STOP.has(w))
    .map(esStem);
}

// articulos, particulas y pronombres que aparecen dentro de glosas multi-palabra
const GR_STOP = new Set(
  ('και τε δε μεν ο η το τον την τω τη τα των τους τας οι αι του της γαρ ουν δη '
  + 'αλλα αλλ περι προς εν εις εκ εξ απο κατα κατ καθ δια δι μη ου ουκ ουχ ως ει αν '
  + 'τι τις τινα τινος τουτο ταυτα τουτων αυτο αυτου αυτων αυτο αυτη ουτος ουτω '
  + 'μαλλον ετι ηδη νυν οτι εαν ινα τε γε μεντοι ουδε μηδε ειτε ουτε μητε παρα παρ '
  + 'υπο υπερ συν μετα επι εφ αφ ωσπερ οσον οσα ουδεν πας πασα παν εστι ειναι').split(/\s+/)
);

// terminaciones de declinacion/conjugacion, de mas larga a mas corta
const GR_SUF = [
  'ουσιν','οντων','ωσιν','ουσα','οντα','ασιν','εσθαι','ηναι','εων','ιων','ους',
  'ωσι','ατος','ατι','ατα','ων','ας','ης','οι','αι','ες','εα','ον','αν','ην',
  'ῳ','ᾳ','ῃ','ω','α','η','ο','ε','ι','ν','σ',
];

// quita diacriticos politonicos, marcas de elision y unifica sigma final
function grStrip(s) {
  return s
    .normalize('NFD')
    .replace(/[\u0300-\u036f\u0345]/g, '')      // acentos, espiritus, iota suscrita
    .replace(/[\u1FBD\u1FBF\u1FFE\u2019\u02BC']/g, '') // apostrofo de elision: κατ᾽ -> κατ
    .normalize('NFC')
    .toLowerCase()
    .replace(/ς/g, 'σ');
}

// la stoplist se compara SIEMPRE normalizada (bug: 'τας' !== 'τασ')
let GR_STOP_N = null;
function isGrStop(token) {
  if (!GR_STOP_N) GR_STOP_N = new Set([...GR_STOP].map(grStrip));
  return GR_STOP_N.has(grStrip(token));
}

function grStem(w) {
  const base = grStrip(w);
  if (base.length <= 4) return base;
  for (const suf of GR_SUF) {
    const s = grStrip(suf);
    if (base.endsWith(s) && base.length - s.length >= 4) return base.slice(0, -s.length);
  }
  return base;
}

const GR_TOKEN = /[\u0370-\u03FF\u1F00-\u1FFF]+/g;

function grTokens(text) {
  return (text.match(GR_TOKEN) || [])
    .filter((t) => !isGrStop(t))
    .map(grStem)
    .filter((t) => t.length >= 3);
}

// devuelve las formas originales (para el glosario), sin stemming
function grSurfaceForms(text) {
  return (text.match(GR_TOKEN) || []).filter((t) => !isGrStop(t));
}

const DEFAULT_WEIGHTS = { gr: 1.0, grForms: 1.0, es: 0.5 };

// vectorize.js - texto -> vector de 24 dimensiones.
// El MISMO pipeline se aplica a pasajes y a consultas.

// formas griegas exactas: se normalizan (sin acentos, sigma final) pero NO se stemmean
const grExactTokens = (text) => grSurfaceForms(text).map(grStrip).filter((t) => t.length >= 3);

const DIM = AXES.length;
const MAX_NGRAM = 4;
const COLLAPSED = [];

// Indices invertidos separados para unigramas y frases.
// Las frases NO se descomponen en tokens sueltos: "vivir bien" no debe hacer
// que el token "bien" active el eje felicidad.
function buildIndex() {
  const esUni = new Map(), esPhr = new Map();
  const grUni = new Map(), grPhr = new Map();
  const gxUni = new Map(), gxPhr = new Map();
  COLLAPSED.length = 0;

  const add = (map, key, axis, w) => {
    if (!key) return;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push({ axis, w });
  };

  AXES.forEach((ax, ai) => {
    const load = (list, tokenize, uni, phr, defW) => {
      for (const raw of list || []) {
        const [term, w] = Array.isArray(raw) ? raw : [raw, defW];
        const toks = tokenize(term);
        // TRAMPA: un termino de varias palabras cuyas stopwords se caen queda
        // reducido a un unigrama y deja de ser restrictivo. "lo mejor de todo"
        // se convertia en el unigrama "mejor", que aparece en 30/70 pasajes.
        if (toks.length === 1 && String(term).trim().split(/\s+/).length > 1) {
          COLLAPSED.push({ axis: ax.id, term, token: toks[0] });
        }
        if (toks.length === 1) add(uni, toks[0], ai, w);
        else if (toks.length > 1 && toks.length <= MAX_NGRAM) add(phr, toks.join(' '), ai, w);
        // toks.length === 0 -> el termino se disolvio en stopwords, se descarta
      }
    };
    load(ax.es, esTokens, esUni, esPhr, DEFAULT_WEIGHTS.es);
    load(ax.gr, grTokens, grUni, grPhr, DEFAULT_WEIGHTS.gr);
    load(ax.grForms, grExactTokens, gxUni, gxPhr, DEFAULT_WEIGHTS.grForms);
  });

  return { esUni, esPhr, grUni, grPhr, gxUni, gxPhr };
}

const INDEX = buildIndex();

// Auditoria de terminos colapsados. Se revisa en el build, no en el navegador.
function collapsedTerms() { return COLLAPSED.slice(); }

// tf sublineal: la 5a aparicion vale menos que la 1a
const tf = (n) => 1 + Math.log(n);

function accumulate(tokens, uni, phr, lang, vec, hits) {
  // 1. frases (n-gramas). Se marcan las posiciones consumidas.
  const used = new Array(tokens.length).fill(false);
  const phraseCounts = new Map();
  for (let n = MAX_NGRAM; n >= 2; n--) {
    for (let i = 0; i + n <= tokens.length; i++) {
      if (used.slice(i, i + n).some(Boolean)) continue;
      const key = tokens.slice(i, i + n).join(' ');
      if (!phr.has(key)) continue;
      for (let j = i; j < i + n; j++) used[j] = true;
      phraseCounts.set(key, (phraseCounts.get(key) || 0) + 1);
    }
  }
  for (const [key, n] of phraseCounts) {
    for (const { axis, w } of phr.get(key)) {
      const contrib = w * tf(n);
      vec[axis] += contrib;
      hits.push({ axis, token: key, n, lang, contrib, phrase: true });
    }
  }

  // 2. unigramas (solo tokens no consumidos por una frase)
  const counts = new Map();
  tokens.forEach((t, i) => { if (!used[i]) counts.set(t, (counts.get(t) || 0) + 1); });
  for (const [tok, n] of counts) {
    const entries = uni.get(tok);
    if (!entries) continue;
    for (const { axis, w } of entries) {
      const contrib = w * tf(n);
      vec[axis] += contrib;
      hits.push({ axis, token: tok, n, lang, contrib, phrase: false });
    }
  }
}

/**
 * @param {string} spanish  texto castellano (sin glosas)
 * @param {string[]} glosses  glosas griegas del pasaje
 */
function vectorize(spanish, glosses = []) {
  const vec = new Array(DIM).fill(0);
  const hits = [];
  const greek = glosses.join(' ');
  accumulate(esTokens(spanish), INDEX.esUni, INDEX.esPhr, 'es', vec, hits);
  accumulate(grTokens(greek), INDEX.grUni, INDEX.grPhr, 'gr', vec, hits);
  accumulate(grExactTokens(greek), INDEX.gxUni, INDEX.gxPhr, 'gr', vec, hits);
  return { vector: l2(vec), raw: vec, hits };
}

function l2(v) {
  const n = Math.sqrt(v.reduce((s, x) => s + x * x, 0));
  if (!n) return v.slice();
  return v.map((x) => x / n);
}

// Vector armado directamente desde ejes seleccionados (querybuilder)
function vectorFromAxes(selected) {
  const vec = new Array(DIM).fill(0);
  for (const [axisId, weight] of Object.entries(selected)) {
    const i = AXES.findIndex((a) => a.id === axisId);
    if (i >= 0) vec[i] = weight;
  }
  return { vector: l2(vec), raw: vec, hits: [] };
}

function cosine(a, b) {
  let s = 0;
  for (let i = 0; i < a.length; i++) s += a[i] * b[i];
  return s;
}

function topK(queryVec, passages, k = 8) {
  return passages
    .map((p) => ({ passage: p, score: cosine(queryVec, p.vector) }))
    .filter((r) => r.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, k);
}

let PASSAGES = [];

/* ------------------------------------------------ INDEXADO + localStorage --- */

function buildIndexNow() {
  const t0 = performance.now();
  PASSAGES = CORPUS.passages.map((p) => {
    const { vector, raw, hits } = vectorize(p.esOnly, p.glosses);
    return { ...p, vector, raw, hits, vectorizedFrom: p.textHash };
  });
  const ms = performance.now() - t0;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      builtAt: new Date().toISOString(),
      items: PASSAGES.map((p) => ({ id: p.id, vector: p.vector, raw: p.raw, vectorizedFrom: p.vectorizedFrom })),
    }));
  } catch (e) { /* cuota */ }
  return ms;
}

function loadIndex() {
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) {}
  if (cached && cached.items && cached.items.length === CORPUS.passages.length) {
    const map = new Map(cached.items.map((i) => [i.id, i]));
    let stale = 0;
    PASSAGES = CORPUS.passages.map((p) => {
      const c = map.get(p.id);
      if (!c || c.vectorizedFrom !== p.textHash) { stale++; const v = vectorize(p.esOnly, p.glosses); return { ...p, ...v, vectorizedFrom: p.textHash }; }
      const { hits } = vectorize(p.esOnly, p.glosses);
      return { ...p, vector: c.vector, raw: c.raw, hits, vectorizedFrom: c.vectorizedFrom };
    });
    setStatus(stale ? `Índice cargado de localStorage · ${stale} pasaje(s) revectorizado(s)` : `Índice cargado de localStorage · ${PASSAGES.length} pasajes`);
    return;
  }
  const ms = buildIndexNow();
  setStatus(`Índice construido en ${ms.toFixed(0)} ms · ${PASSAGES.length} pasajes · guardado en localStorage`);
}

const setStatus = (t) => { $('#status').textContent = t; };

/* --------------------------------------------------------------- BUSQUEDA -- */

function runQuery(qv, label, hits) {
  lastQuery = { vector: qv, label, hits: hits || [] };
  lastResults = topK(qv, PASSAGES, 8);
  renderResults();
  renderQueryVector();
}

function searchText() {
  const q = $('#q').value.trim();
  if (!q) return;
  const { vector, hits } = vectorize(q, []);
  if (!vector.some((x) => x)) {
    lastQuery = null;
    $('#results').innerHTML = '';
    $('#results').append(emptyState('Ningún término de la consulta activó un eje. Probá con otras palabras, abrí el menú Preguntas o usá las categorías de la izquierda.'));
    renderSidebarHint();
    return;
  }
  runQuery(vector, q, hits);
}

function searchAxes() {
  const active = Object.keys(selectedAxes);
  if (!active.length) return;
  const { vector } = vectorFromAxes(selectedAxes);
  runQuery(vector, active.map((a) => AXES.find((x) => x.id === a).label).join(' + '), []);
}

function toggleFaq(open) {
  $('#faqmenu').hidden = !open;
  $('#faqbtn').setAttribute('aria-expanded', String(open));
}

function renderFaq() {
  const box = $('#faqmenu');
  box.innerHTML = '';
  FAQ.forEach(([cat, qs], i) => {
    const d = el('details', 'faqcat');
    if (i === 0) d.open = true;
    d.append(el('summary', null, cat));
    qs.forEach((t) => {
      const b = el('button', 'faqq', t);
      b.type = 'button';
      b.setAttribute('role', 'menuitem');
      b.onclick = () => { $('#q').value = t; toggleFaq(false); searchText(); };
      d.append(b);
    });
    box.append(d);
  });
}

function renderAxisChips() {
  const box = $('#axes');
  box.innerHTML = '';
  AXES.forEach((ax) => {
    const b = el('button', 'chip');
    b.type = 'button';
    b.innerHTML = `<span>${ax.label}</span><span class="gr">${ax.greek}</span>`;
    b.onclick = () => {
      if (selectedAxes[ax.id]) delete selectedAxes[ax.id];
      else selectedAxes[ax.id] = 1;
      b.classList.toggle('on', Boolean(selectedAxes[ax.id]));
      syncAxCount();
      if (Object.keys(selectedAxes).length) searchAxes();
      else resetToStart();
    };
    box.append(b);
  });
}

function barRow(label, value, max, extra) {
  const row = el('div', 'bar');
  row.append(el('span', 'bl', label));
  const track = el('span', 'bt');
  const fill = el('span', 'bf');
  fill.style.width = `${Math.max(2, (value / (max || 1)) * 100)}%`;
  track.append(fill);
  row.append(track);
  row.append(el('span', 'bv', extra != null ? extra : value.toFixed(2)));
  return row;
}

function syncAxCount() {
  const n = Object.keys(selectedAxes).length;
  $('#axcount').textContent = n ? `${n} de ${AXES.length}` : '';
  $('#clearax').hidden = !n;
}

function clearAxes() {
  selectedAxes = {};
  document.querySelectorAll('.chip.on').forEach((c) => c.classList.remove('on'));
  syncAxCount();
  resetToStart();
}

// estado inicial: sin consulta, con la franja del vector en modo pista
function resetToStart() {
  lastQuery = null;
  lastResults = [];
  renderSidebarHint();
  const box = $('#results');
  box.innerHTML = '';
  box.append(emptyState('Escribí una pregunta, abrí el menú Preguntas del encabezado o seleccioná categorías para empezar.'));
}

function renderSidebarHint() {
  const box = $('#qvec');
  box.innerHTML = '';
  box.append(el('h3', null, 'Vector de la consulta'));
  box.append(el('p', 'muted', 'Acá vas a ver en qué ejes se proyecta tu pregunta y qué términos los activaron.'));
}

function renderQueryVector() {
  const box = $('#qvec');
  box.innerHTML = '';
  if (!lastQuery) { renderSidebarHint(); return; }
  const pairs = lastQuery.vector.map((v, i) => ({ v, ax: AXES[i] })).filter((p) => p.v > 0).sort((a, b) => b.v - a.v);
  if (!pairs.length) { renderSidebarHint(); return; }
  box.append(el('h3', null, 'Vector de la consulta'));
  box.append(el('p', 'qlabel', lastQuery.label));
  const max = pairs[0].v;
  const grid = el('div', 'vgrid');
  pairs.forEach((p) => grid.append(barRow(p.ax.label, p.v, max)));
  box.append(grid);
  if (lastQuery.hits.length) {
    const d = el('div', 'hitlist');
    d.append(el('span', 'muted', 'Términos reconocidos: '));
    const seen = new Set();
    lastQuery.hits.forEach((h) => { if (!seen.has(h.token)) { seen.add(h.token); d.append(el('code', null, h.token)); } });
    box.append(d);
  }
}

function renderResults() {
  const box = $('#results');
  box.innerHTML = '';
  if (!lastResults.length) { box.append(emptyState('Sin coincidencias.')); return; }
  const head = el('div', 'rhead');
  head.append(el('h3', null, `${lastResults.length} pasajes`));
  head.append(el('span', 'muted', lastQuery.label));
  box.append(head);

  lastResults.forEach((r, i) => {
    const p = r.passage;
    const card = el('article', 'card');

    const top = el('div', 'ctop');
    top.append(el('span', 'rank', String(i + 1)));
    const meta = el('div', 'meta');
    meta.append(el('strong', null, p.id));
    meta.append(el('span', 'bek', p.bekker || ''));
    top.append(meta);
    const score = el('span', 'score', r.score.toFixed(3));
    top.append(score);
    card.append(top);

    card.append(el('p', 'text', p.esOnly.length > 320 ? p.esOnly.slice(0, 320) + '…' : p.esOnly));

    // por que gano: contribucion por eje al producto escalar
    const contrib = p.vector.map((v, j) => ({ j, c: v * lastQuery.vector[j] })).filter((x) => x.c > 0).sort((a, b) => b.c - a.c).slice(0, 4);
    if (contrib.length) {
      const why = el('div', 'why');
      why.append(el('span', 'muted', 'Aporte al puntaje'));
      const max = contrib[0].c;
      contrib.forEach((c) => why.append(barRow(AXES[c.j].label, c.c, max, ((c.c / r.score) * 100).toFixed(0) + '%')));
      card.append(why);
    }

    if (p.glosses.length) {
      const g = el('div', 'gloss');
      p.glosses.slice(0, 8).forEach((x) => g.append(el('span', 'gtag', x)));
      card.append(g);
    }

    if (p.greekParallel) {
      const det = el('details');
      det.append(el('summary', null, 'Griego original'));
      det.append(el('p', 'grtext', p.greekParallel));
      card.append(det);
    }

    box.append(card);
  });
}

  $('#stats').textContent = `${PASSAGES.length} pasajes · ${AXES.length} dimensiones · ${cov} vectorizados`;
}

document.addEventListener('DOMContentLoaded', init);

</script>
